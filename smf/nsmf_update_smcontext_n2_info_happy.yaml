# Nsmf_PDUSession_UpdateSMContext — N2 info update happy path (compliance).
# 3GPP TS 29.502 §5.2.2.3 / §6.1.3.3; TS 23.502 §4.3.3.
#
# runner (AMF) first creates an SM context, extracts the smContextRef from the
# Location header, then POSTs SmContextUpdateData to {ref}/modify to carry N2 SM
# information (e.g. PDU Session Resource Setup Response acknowledgement). A
# spec-correct SMF replies 200 OK.
#
# RUNTIME RISK: both CreateSMContext (needs an embedded N1 SM NAS PDU /
# multipart) and the N2-info update (needs a binary n2SmInfo part) cannot carry
# their binary parts in single-part JSON, so a real Open5GS SMF is likely to
# reject before a valid smContextRef is ever produced. The flow is structurally
# valid and asserts the spec 200 success, but the live run is expected to expose
# the multipart/N1-N2 transport gap rather than a flow bug. Multi-step
# extract->reuse pipeline is exercised regardless.
kind: flow
name: smf_nsmf_update_smcontext_n2_info_happy
description: AMF Create then Update (N2 info) SM context — expect 200 OK on modify
category: functional
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - updated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 14,
                  "dnn": "internet",
                  "sNssai": {"sst": 1, "sd": "000001"},
                  "servingNfId": "00000000-0000-0000-0000-000000000001",
                  "guami": {"plmnId": {"mcc": "001", "mnc": "01"}, "amfId": "020040"},
                  "servingNetwork": {"mcc": "001", "mnc": "01"},
                  "anType": "3GPP_ACCESS",
                  "ratType": "NR",
                  "requestType": "INITIAL_REQUEST",
                  "smContextStatusUri": "http://127.0.0.1:7777/namf-callback/v1/smContextStatus/1"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_update
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: smCtxRef
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.smCtxRef}}/modify",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "n2SmInfoType": "PDU_RES_SETUP_RSP",
                  "toBeSwitched": false
                }
              }

  wait_update:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: updated
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
