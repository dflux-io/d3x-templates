# Nsmf_PDUSession_RetrieveSMContext — happy path (compliance).
# 3GPP TS 29.502 §5.2.2.5 / §6.1.3.x.
#
# runner (AMF) creates an SM context, extracts its ref, then POSTs
# SmContextRetrieveData to {ref}/retrieve to fetch the stored SM context (e.g.
# during EPS<->5GS interworking / handover). A spec-correct SMF replies 200 OK
# with a SmContextRetrievedData body.
#
# RUNTIME RISK: depends on a created SM context; CreateSMContext via single-part
# JSON (no embedded N1 SM NAS) is likely rejected by Open5GS, so the live run is
# expected to expose the multipart/N1 transport gap before retrieve. Structurally
# valid; asserts the spec 200 success. Exercises the create->extract->retrieve
# chain.
kind: flow
name: smf_nsmf_retrieve_smcontext_happy
description: AMF Create then Retrieve SM context — expect 200 OK on retrieve
category: functional
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - retrieved
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 19,
                  "dnn": "internet",
                  "sNssai": {"sst": 1, "sd": "000001"},
                  "servingNfId": "00000000-0000-0000-0000-000000000001",
                  "guami": {"plmnId": {"mcc": "001", "mnc": "01"}, "amfId": "020040"},
                  "servingNetwork": {"mcc": "001", "mnc": "01"},
                  "anType": "3GPP_ACCESS",
                  "ratType": "NR",
                  "requestType": "INITIAL_REQUEST",
                  "smContextStatusUri": "http://127.0.0.1:7777/namf-callback/v1/smContextStatus/1"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_retrieve
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: smCtxRef
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.smCtxRef}}/retrieve",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "targetMmeCap": {"nasRerouteSupportInd": false}
                }
              }

  wait_retrieve:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: retrieved
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
