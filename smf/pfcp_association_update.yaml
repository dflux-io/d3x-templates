# PFCP Association Update (3GPP TS 29.244 §6.2.6.3 / §7.4.5).
#
# After establishing the node-level association, Runik (CP function) issues a
# PFCPAssociationUpdateRequest to the real UPF. The Association Update enricher
# stamps our NodeID and a fresh sequence number; the request may carry updated
# CP Function Features (here we advertise a feature flag via message_body to
# exercise feature renegotiation). The UPF replies with
# PFCPAssociationUpdateResponse carrying Cause "Request accepted".
#
# Spec-correct success = an AssociationUpdateResponse with Cause
# "Request accepted" (TS 29.244 §8.2.1).

kind: flow
name: smf_pfcp_association_update
description: SMF updates an established PFCP association against a real UPF (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - updated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_update
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPAssociationUpdateRequest

  wait_update:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationUpdateResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `updated` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: updated

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `updated`.
final_checks:
  - name: the flow reached `updated`
    metric: final_state_counts.updated
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPAssociationUpdateRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationUpdateRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPAssociationUpdateResponse arrived
    metric: rx_events.pfcp.PFCPAssociationUpdateResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
