# PFCP Session with QER (F-08) — install + modify a QoS Enforcement Rule.
#
# Runik (SMF) establishes a session whose uplink PDR is bound to a Create QER
# carrying a Maximum Bitrate (MBR) and open gates, then sends a Session
# Modification that updates the QER's MBR, then deletes. The standalone UPF
# installs the QER into its datapath (upf/n4/session_handlers.go:228) and
# accepts each step.
#
# Sanity scope: the QER is accepted and survives the lifecycle (Cause
# "Request accepted" at establish / modify / delete). Actual rate
# ENFORCEMENT is a datapath concern (Class B / load plan), not asserted here.

kind: flow
name: smf_pfcp_session_qer
description: SMF installs and modifies a QER (MBR) on a session; UPF accepts the lifecycle (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - modified
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": { "source_interface": 1, "local_f_teid": {"ch": true, "v4": true} },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1},
                    "qer_id": [ {"value": 1} ]
                  }
                ],
                "create_far": [
                  { "far_id": {"value": 1}, "apply_action": {"flags": 2},
                    "forwarding_parameters": {"destination_interface": 2} }
                ],
                "create_qer": [
                  { "qer_id": {"value": 1},
                    "gate_status": {"ul_gate": 0, "dl_gate": 0},
                    "maximum_bitrate": {"ul_mbr": 200000, "dl_mbr": 200000} }
                ]
              }

  wait_session:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_modify
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              {
                "update_qer": [
                  { "qer_id": {"value": 1},
                    "maximum_bitrate": {"ul_mbr": 500000, "dl_mbr": 500000} }
                ]
              }

  wait_modify:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `modified` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: modified

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `modified`.
final_checks:
  - name: the flow reached `modified`
    metric: final_state_counts.modified
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionModificationRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionModificationRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionModificationResponse arrived
    metric: rx_events.pfcp.PFCPSessionModificationResponse
    op: greater_or_equal
    value: 1
  - name: all 3 declared checks ran
    metric: checks_total
    op: equals
    value: 3
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
