# N4/PFCP — Session Set Deletion, started by the SMF.
# 3GPP TS 29.244 §7.4.6.1 / §7.4.6.2; TS 23.527 (partial failure
# handling).
#
# Runik is the SMF. One of its components has failed, and with it every PDU
# session that component served. Instead of deleting them one by one the SMF
# names the set: FQ-CSID = (its node address, connection set 1). The UPF
# deletes every session it associated with that CSID and answers once.
#
# Node message: no SEID. FQ-CSID node_id_type 1 is "IPv4 address".
#
# Pair: upf_pfcp_responder. Env: the SMF dials, the UPF listens
# (runik/config/lab-pfcp.yaml).
#
kind: flow
name: smf_pfcp_session_set_deletion
description: SMF tells the UPF to delete every session tied to a failed CSID
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_set_deletion
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionSetDeletionRequest
            message_body: |
              { "fq_csid": [ { "node_id_type": 1, "node_address": "{{$b64_ipv4 \"127.0.0.1\"}}", "csids": [1] } ] }

  wait_set_deletion:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionSetDeletionResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.node_id
            op: not_empty

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionSetDeletionRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionSetDeletionRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionSetDeletionResponse arrived
    metric: rx_events.pfcp.PFCPSessionSetDeletionResponse
    op: greater_or_equal
    value: 1
  - name: all 3 declared checks ran
    metric: checks_total
    op: equals
    value: 3
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
