# N4/PFCP — the SMF side of a Downlink Data Report.
# 3GPP TS 29.244 §6.3.5, §7.5.8.2 / §7.5.9; TS 23.502 (network triggered
# service request).
#
# Runik is the SMF. It brings a session up, opens its downlink, then puts the
# downlink FAR into buffer-and-notify (the UE went idle) and waits for the UPF
# to say that downlink data arrived. It acknowledges the report and, as an SMF
# does once the UE has been paged and is back (200 ms here), switches the FAR
# to forward again.
#
# What it asserts about the report: Report Type is DLDR and nothing else, and
# the Downlink Data Report names PDR 2 — the downlink PDR of this session.
#
# Pair: upf_pfcp_report_downlink_data is the UPF. Env: the SMF dials, the UPF
# listens (runik/config/lab-pfcp.yaml).
#
kind: flow
name: smf_pfcp_report_downlink_data_responder
description: SMF buffers a session, receives the UPF's Downlink Data Report, acknowledges it and resumes forwarding
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  { "pdr_id": {"value": 1}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 1, "local_f_teid": {"ch": true},
                             "network_instance": {"value": "internet"}, "qfi": [{"value": 1}] },
                    "outer_header_removal": {"description": 1},
                    "far_id": {"value": 1}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] },
                  { "pdr_id": {"value": 2}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 2, "network_instance": {"value": "internet"},
                             "ue_ip_address": {"v4": true, "sd": true, "ipv4_address": "{{$b64_ipv4 \"10.45.0.2\"}}"} },
                    "far_id": {"value": 2}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] }
                ],
                "create_far": [
                  { "far_id": {"value": 1}, "apply_action": {"flags": 2},
                    "forwarding_parameters": { "destination_interface": 2,
                                               "network_instance": {"value": "internet"} } },
                  { "far_id": {"value": 2}, "apply_action": {"flags": 4} }
                ],
                "create_qer": [
                  { "qer_id": {"value": 1}, "gate_status": {"ul_gate": 1, "dl_gate": 1},
                    "maximum_bitrate": {"ul_mbr": 100000, "dl_mbr": 100000}, "qfi": {"value": 1} }
                ],
                "create_urr": [
                  { "urr_id": {"value": 1}, "measurement_method": {"flags": 2},
                    "reporting_triggers": {"flags": 2},
                    "volume_threshold": {"tovol": true, "total_volume": 1000000} }
                ],
                "pdn_type": {"value": 1}
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      # The UPF's answer names the N3 tunnel endpoint it chose for PDR 1 and
      # its own F-SEID; without both the SMF cannot hand a tunnel to the gNB.
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_buffering
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.created_pdr[0].pdr_id.value
            op: equals
            expected: 1
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.teid
            op: equals
            expected: 4660
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.ipv4_address
            op: equals
            expected: "192.0.2.1"
          - type: check
            field: pfcp.up_f_seid.seid
            op: greater_than
            expected: 0
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "create_bar": {"bar_id": {"value": 1}},
                "update_far": [ { "far_id": {"value": 2}, "apply_action": {"flags": 12}, "bar_id": {"value": 1} } ] }

  wait_buffering:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_report
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
      # Out of order: this arrived before the SessionModificationResponse.
      - event: pfcp.PFCPSessionReportRequest
        target: wait_buffering_second
        actions:
          - type: check
            field: pfcp.report_type.flags
            op: equals
            expected: 1
          - type: check
            field: pfcp.downlink_data_report[0].pdr_id.value
            op: equals
            expected: 2
          - type: send
            message: PFCPSessionReportResponse

  wait_buffering_second:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: paging
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  wait_report:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionReportRequest
        target: paging
        actions:
          - type: check
            field: pfcp.report_type.flags
            op: equals
            expected: 1
          - type: check
            field: pfcp.downlink_data_report[0].pdr_id.value
            op: equals
            expected: 2
          - type: send
            message: PFCPSessionReportResponse

  # Paging: the UE is back 200 ms later.
  paging:
    on_timeout:
      duration: 200ms
      target: wait_resume
      actions:
        - type: send
          message: PFCPSessionModificationRequest
          message_body: |
            { "update_far": [ { "far_id": {"value": 2}, "apply_action": {"flags": 2} } ] }

  wait_resume:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_delete
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionDeletionRequest

  wait_delete:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionDeletionResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionModificationRequest sent 2x
    metric: msg_types.tx.pfcp.PFCPSessionModificationRequest
    op: equals
    value: 2
  - name: PFCPSessionReportResponse sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionReportResponse
    op: equals
    value: 1
  - name: PFCPSessionDeletionRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionDeletionRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionModificationResponse arrived
    metric: rx_events.pfcp.PFCPSessionModificationResponse
    op: greater_or_equal
    value: 2
  - name: a PFCPSessionReportRequest arrived
    metric: rx_events.pfcp.PFCPSessionReportRequest
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionDeletionResponse arrived
    metric: rx_events.pfcp.PFCPSessionDeletionResponse
    op: greater_or_equal
    value: 1
  - name: all 11 declared checks ran
    metric: checks_total
    op: equals
    value: 11
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
