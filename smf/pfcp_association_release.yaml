# PFCP Association Release (3GPP TS 29.244 §6.2.6.5 / §7.4.6).
#
# Runik (CP function) establishes a node-level association with the real UPF
# then tears it down with a PFCPAssociationReleaseRequest. The release enricher
# stamps our NodeID and a fresh sequence number; the UPF must release all
# associated PFCP sessions and answer with PFCPAssociationReleaseResponse
# carrying Cause "Request accepted".
#
# Spec-correct success = an AssociationReleaseResponse with Cause
# "Request accepted" (TS 29.244 §8.2.1).

kind: flow
name: smf_pfcp_association_release
description: SMF establishes then releases a PFCP association against a real UPF (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - released
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_release
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPAssociationReleaseRequest

  wait_release:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationReleaseResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `released` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: released

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `released`.
final_checks:
  - name: the flow reached `released`
    metric: final_state_counts.released
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPAssociationReleaseRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationReleaseRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPAssociationReleaseResponse arrived
    metric: rx_events.pfcp.PFCPAssociationReleaseResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
