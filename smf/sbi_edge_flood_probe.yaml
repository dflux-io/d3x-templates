# Signature demo Act 4 — SBI flood against an allowed path (not path-denied).
#
# block-forged only denies POST /nsmf-pdusession/v1/sm-contexts. This GET
# probe is deliberately outside that matcher so the global flood-limit
# rate-limit filter can return 429 (policy runs before rate-limit; a
# denied path would short-circuit at 403).
#
# Suite step: repetitions: 20, rate: 50, success_when at_least_one
# final_state rate_limited (see edge e2e 08-sbi-rate-limit-burst-yields-429).
kind: flow
name: sbi_edge_flood_probe
description: GET am-data through edge — expect 429 when flood-limit is installed
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rate_limited
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-sdm/v2/imsi-001010000000001/am-data",
                "query": {"dataset-names": "AM"}
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rate_limited
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 429
