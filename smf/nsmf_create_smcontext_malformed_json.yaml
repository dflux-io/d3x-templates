# Nsmf_PDUSession_CreateSMContext — malformed JSON body (negative/security).
# 3GPP TS 29.502 §6.1.6; TS 29.500 §5.2.7 / §6.3.
#
# runner (AMF) POSTs a truncated, non-parseable JSON document to the SMF's
# CreateSMContext endpoint via SBI_Request raw_body. A spec-correct SMF MUST
# reject with 400 Bad Request (ProblemDetails) and stay up — it must not crash
# or hang. Cross-cutting goal mirrors the gnb security suite: the NF reacts
# spec-correctly and remains live.
kind: flow
name: smf_nsmf_create_smcontext_malformed_json
description: AMF sends truncated JSON to SMF CreateSMContext — expect 400 rejection
category: negative
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_reject
        actions:
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "raw_body": "{ \"supi\": \"imsi-001010000000001\", \"pduSessionId\": "
              }

  wait_reject:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
