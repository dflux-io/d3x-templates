# PFCP Association Setup (3GPP TS 29.244 §6.2.6.2 / §7.4.4).
#
# Runik plays the SMF/CP-function peer and establishes a node-level PFCP
# association with a real Open5GS UPF over N4. The enricher auto-fills our
# NodeID (from the binding config) and a RecoveryTimeStamp; the UPF replies
# with PFCPAssociationSetupResponse carrying Cause "Request accepted".
#
# Spec-correct success = an AssociationSetupResponse whose Cause IE is
# "Request accepted" (TS 29.244 §8.2.1, value 1).

kind: flow
name: smf_pfcp_association_setup
description: SMF establishes a PFCP association against a real UPF (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - associated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.node_id
            op: not_empty

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `associated` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: associated

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `associated`.
final_checks:
  - name: the flow reached `associated`
    metric: final_state_counts.associated
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
