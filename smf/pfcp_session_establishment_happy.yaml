# N4/PFCP — Session Establishment happy path (compliance).
# 3GPP TS 29.244 §7.5.2 / §7.5.3.
#
# runner (SMF) first sets up a PFCP association, then sends a
# PFCPSessionEstablishmentRequest. The establishment enricher auto-fills the
# header + CP F-SEID + NodeID; the UPF replies with
# PFCPSessionEstablishmentResponse. With the pfcp.cause resolver we assert the
# spec-correct success cause (Request accepted) and a non-empty UP F-SEID is
# echoed back via pfcp.seid.
#
# RUNTIME RISK: the establishment enricher does NOT build CreatePDR/FAR/QER, so
# a strict Open5GS UPF may reject a rule-less session (Cause != Request accepted)
# or accept a no-rule session. The flow is structurally valid and asserts the
# spec happy-path cause; the live run sorts a genuine "needs PDR/FAR" core gap
# from a flow bug. Terminal kept conservative (established vs failed).
kind: flow
name: smf_pfcp_session_establishment_happy
description: SMF associates then establishes a PFCP session — expect Cause Request accepted
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - established
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: smf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: established
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
