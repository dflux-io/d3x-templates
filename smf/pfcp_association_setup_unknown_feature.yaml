# PFCP Association Setup advertising unknown/reserved CP Function Features
# (3GPP TS 29.244 §8.2.58 / §5.20).
#
# Security/robustness: Runik advertises a CP Function Features IE with reserved /
# future bits set (flags=0xFFFFFFFF). Per TS 29.244 §5.20 feature negotiation
# must ignore bits a peer does not understand — the UPF must NOT fault on
# unknown CP feature bits. A spec-correct UPF accepts the association
# (Cause "Request accepted") and echoes its own UP Function Features IE,
# advertising only mutually-supported features. The flow asserts the
# association succeeded and the UPF returned a UP Function Features IE, i.e. the
# unknown bits were tolerated and negotiation completed.
#
# Spec-correct success = AssociationSetupResponse Cause "Request accepted" with
# a UP Function Features IE present.

kind: flow
name: smf_pfcp_association_setup_unknown_feature
description: Association Setup with reserved CP feature bits; UPF tolerates and negotiates
category: negative
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf
            message_body: |
              {
                "cp_function_features": {"flags": 4294967295}
              }

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.up_function_features
            op: not_empty

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `tolerated` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: tolerated

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `tolerated`.
final_checks:
  - name: the flow reached `tolerated`
    metric: final_state_counts.tolerated
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
