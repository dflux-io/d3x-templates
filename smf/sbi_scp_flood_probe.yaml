# Signature demo Act 4 — SBI flood against an allowed path (not path-denied).
#
# block-forged only denies POST /nsmf-pdusession/v1/sm-contexts. This GET
# probe is deliberately outside that matcher so the global flood-limit
# rate-limit filter can return 429 (policy runs before rate-limit; a
# denied path would short-circuit at 403).
#
# Suite step: repetitions: 20, rate: 50. Each request ends in `answered`,
# whatever the status: the requests inside the limit's burst are let through
# (and the UDM answers them, 401 without a token), so a per-request 429 check
# fails those and the step with them. The claim is over the whole step, in
# final_checks: every request was answered and at least one was a 429.
kind: flow
name: sbi_scp_flood_probe
description: GET am-data through SCP at a flood rate — at least one 429 when flood-limit is installed
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - answered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-sdm/v2/imsi-001010000000001/am-data",
                "query": {"dataset-names": "AM"}
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: answered

final_checks:
  - name: every request was answered
    metric: final_state_counts.answered
    op: equals
    value: 1
    value_metric: flows_started
  - name: the SCP rate-limited at least one request (429)
    metric: msg_types.rx.sbi.status_429
    op: greater_or_equal
    value: 1
