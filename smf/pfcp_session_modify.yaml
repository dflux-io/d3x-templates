# PFCP Session Modification (3GPP TS 29.244 §7.5.4 / §7.5.5).
#
# Runik (SMF) brings up an association + session, then modifies the session by
# updating the FAR — switching Apply Action to FORW with an Outer Header
# Creation IE (GTP-U/UDP/IPv4, description=256/0x100 per TS 29.244 §8.2.56)
# pointing at a downlink F-TEID, the typical "activate downlink path" step.
# The modification enricher reuses the RemoteSEID learned from the
# establishment response, so this must run after establishment in the same
# UE execution.
#
# Spec-correct success = a SessionModificationResponse with Cause
# "Request accepted" (TS 29.244 §8.2.1).

kind: flow
name: smf_pfcp_session_modify
description: SMF establishes then modifies a PFCP session against a real UPF (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - modified
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true, "v4": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_modify
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              {
                "update_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "update_forwarding_parameters": {
                      "destination_interface": 1
                    }
                  }
                ]
              }

  wait_modify:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `modified` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: modified

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `modified`.
final_checks:
  - name: the flow reached `modified`
    metric: final_state_counts.modified
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionModificationRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionModificationRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionModificationResponse arrived
    metric: rx_events.pfcp.PFCPSessionModificationResponse
    op: greater_or_equal
    value: 1
  - name: all 3 declared checks ran
    metric: checks_total
    op: equals
    value: 3
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
