# Nsmf_PDUSession_CreateSMContext — replay / identical resend (negative/security).
# 3GPP TS 29.500 §6.x; TS 29.502 §5.2.2.2.
#
# runner (AMF) sends a CreateSMContext, then re-sends the byte-identical request
# again. A spec-correct SMF must handle the replay deterministically — it must
# not create two divergent contexts nor crash; it either idempotently returns a
# reference or rejects the duplicate. The security assertion is that the SMF
# stays up and answers both with a non-5xx status (no server fault from replay).
kind: flow
name: smf_nsmf_create_smcontext_replay
description: AMF replays identical CreateSMContext — SMF handles deterministically, stays up
category: negative
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_first
        actions:
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 12,
                  "dnn": "internet",
                  "sNssai": {"sst": 1, "sd": "000001"},
                  "servingNfId": "00000000-0000-0000-0000-000000000001",
                  "guami": {"plmnId": {"mcc": "001", "mnc": "01"}, "amfId": "020040"},
                  "servingNetwork": {"mcc": "001", "mnc": "01"},
                  "anType": "3GPP_ACCESS",
                  "ratType": "NR",
                  "requestType": "INITIAL_REQUEST",
                  "smContextStatusUri": "http://127.0.0.1:7777/namf-callback/v1/smContextStatus/1"
                }
              }

  wait_first:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_replay
        actions:
          - type: check
            field: sbi.status
            op: less_than
            expected: 500
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 12,
                  "dnn": "internet",
                  "sNssai": {"sst": 1, "sd": "000001"},
                  "servingNfId": "00000000-0000-0000-0000-000000000001",
                  "guami": {"plmnId": {"mcc": "001", "mnc": "01"}, "amfId": "020040"},
                  "servingNetwork": {"mcc": "001", "mnc": "01"},
                  "anType": "3GPP_ACCESS",
                  "ratType": "NR",
                  "requestType": "INITIAL_REQUEST",
                  "smContextStatusUri": "http://127.0.0.1:7777/namf-callback/v1/smContextStatus/1"
                }
              }

  wait_replay:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: tolerated
        actions:
          - type: check
            field: sbi.status
            op: less_than
            expected: 500
