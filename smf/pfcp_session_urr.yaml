# PFCP Session with URR (F-07) — install a Usage Reporting Rule + query it.
#
# Runik (SMF) establishes a session whose uplink PDR is bound to a Create URR
# (volume measurement, volume threshold), then sends a Session Modification
# carrying a Query URR for that rule, then deletes. The standalone UPF
# installs the URR into its datapath (upf/n4/session_handlers.go:239) and
# accepts each step.
#
# Sanity scope: the URR is accepted, queryable, and survives the lifecycle
# (Cause "Request accepted" at establish / modify / delete). Asserting the
# returned Usage Report contents needs a pfcp.usage_report resolver path Runik
# doesn't expose yet (see docs/upf/sanity-tests.md §9 / G-series), so this
# pins the accept path; volume reporting end-to-end is future work (G1).

kind: flow
name: smf_pfcp_session_urr
description: SMF installs a URR and queries it across a session lifecycle; UPF accepts (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - deleted
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": { "source_interface": 1, "local_f_teid": {"ch": true, "v4": true} },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1},
                    "urr_id": [ {"value": 1} ]
                  }
                ],
                "create_far": [
                  { "far_id": {"value": 1}, "apply_action": {"flags": 2},
                    "forwarding_parameters": {"destination_interface": 2} }
                ],
                "create_urr": [
                  { "urr_id": {"value": 1},
                    "measurement_method": {"flags": 2},
                    "reporting_triggers": {"flags": 2},
                    "volume_threshold": {"tovol": true, "total_volume": 1000000} }
                ]
              }

  wait_session:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_query
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "query_urr": [ { "urr_id": {"value": 1} } ] }

  wait_query:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_delete
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionDeletionRequest

  wait_delete:
    on_timeout: { duration: 5s, target: failed }
    transitions:
      - event: pfcp.PFCPSessionDeletionResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `deleted` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: deleted

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `deleted`.
final_checks:
  - name: the flow reached `deleted`
    metric: final_state_counts.deleted
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionModificationRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionModificationRequest
    op: equals
    value: 1
  - name: PFCPSessionDeletionRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionDeletionRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionModificationResponse arrived
    metric: rx_events.pfcp.PFCPSessionModificationResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionDeletionResponse arrived
    metric: rx_events.pfcp.PFCPSessionDeletionResponse
    op: greater_or_equal
    value: 1
  - name: all 4 declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
