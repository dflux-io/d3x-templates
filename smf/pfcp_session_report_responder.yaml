# N4/PFCP — the SMF side of a Session Report.
# 3GPP TS 29.244 §6.3.5, §7.5.8 / §7.5.9.
#
# Runik is the SMF. It sets up a session — with a URR and a 2 s User Plane
# Inactivity Timer, so the UPF has something to report on — and then stays in
# `serving` for 1.5 s, answering every PFCP Session Report Request with Cause
# "Request accepted". Then it deletes the session.
#
# It acknowledges any report type; what a given report must contain is
# asserted by the UPF flow that sends it. The exception is the Downlink Data
# Report, where the SMF has to act on the report: see
# smf_pfcp_report_downlink_data_responder.
#
# Pair: any of upf_pfcp_report_usage_volume, upf_pfcp_report_usage_periodic,
# upf_pfcp_report_error_indication, upf_pfcp_report_inactivity. Env: the SMF
# dials, the UPF listens (runik/config/lab-pfcp.yaml).
#
kind: flow
name: smf_pfcp_session_report_responder
description: SMF holds a session open and acknowledges every Session Report the UPF sends
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  { "pdr_id": {"value": 1}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 1, "local_f_teid": {"ch": true, "v4": true},
                             "network_instance": {"value": "internet"}, "qfi": [{"value": 1}] },
                    "outer_header_removal": {"description": 1},
                    "far_id": {"value": 1}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] },
                  { "pdr_id": {"value": 2}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 2, "network_instance": {"value": "internet"},
                             "ue_ip_address": {"v4": true, "sd": true, "ipv4_address": "{{$b64_ipv4 \"10.45.0.2\"}}"} },
                    "far_id": {"value": 2}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] }
                ],
                "create_far": [
                  { "far_id": {"value": 1}, "apply_action": {"flags": 2},
                    "forwarding_parameters": { "destination_interface": 2,
                                               "network_instance": {"value": "internet"} } },
                  { "far_id": {"value": 2}, "apply_action": {"flags": 4} }
                ],
                "create_qer": [
                  { "qer_id": {"value": 1}, "gate_status": {"ul_gate": 1, "dl_gate": 1},
                    "maximum_bitrate": {"ul_mbr": 100000, "dl_mbr": 100000}, "qfi": {"value": 1} }
                ],
                "create_urr": [
                  { "urr_id": {"value": 1}, "measurement_method": {"flags": 2},
                    "reporting_triggers": {"flags": 2},
                    "volume_threshold": {"tovol": true, "total_volume": 1000000} }
                ],
                "pdn_type": {"value": 1},
                "user_plane_inactivity_timer": {"value": 2}
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      # The UPF's answer names the N3 tunnel endpoint it chose for PDR 1 and
      # its own F-SEID; without both the SMF cannot hand a tunnel to the gNB.
      # `greater_than 0`, not `not_empty`: the TEID is a number and `not_empty`
      # passes on a zero one. The values are the UPF's to choose, so they are
      # not pinned.
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: serving
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.created_pdr[0].pdr_id.value
            op: equals
            expected: 1
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.teid
            op: greater_than
            expected: 0
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.ipv4_address
            op: not_empty
          - type: check
            field: pfcp.up_f_seid.seid
            op: greater_than
            expected: 0
      - event: pfcp.PFCPSessionReportRequest
        target: wait_session
        actions:
          - type: check
            field: pfcp.report_type.flags
            op: greater_than
            expected: 0
          - type: check
            field: pfcp.seid
            op: greater_than
            expected: 0
          - type: send
            message: PFCPSessionReportResponse

  # The report's header SEID is the SMF's own (the CP F-SEID it gave at
  # establishment); a report addressed to SEID 0 names no session.
  serving:
    on_timeout:
      duration: 1500ms
      target: wait_delete
      actions:
        - type: send
          message: PFCPSessionDeletionRequest
    transitions:
      - event: pfcp.PFCPSessionReportRequest
        target: serving
        actions:
          - type: check
            field: pfcp.report_type.flags
            op: greater_than
            expected: 0
          - type: check
            field: pfcp.seid
            op: greater_than
            expected: 0
          - type: send
            message: PFCPSessionReportResponse

  wait_delete:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionDeletionResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionDeletionRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionDeletionRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionDeletionResponse arrived
    metric: rx_events.pfcp.PFCPSessionDeletionResponse
    op: greater_or_equal
    value: 1
  - name: at least one PFCPSessionReportRequest arrived
    metric: rx_events.pfcp.PFCPSessionReportRequest
    op: greater_or_equal
    value: 1
  - name: and at least one PFCPSessionReportResponse was sent
    metric: msg_types.tx.pfcp.PFCPSessionReportResponse
    op: greater_or_equal
    value: 1
  - name: all 7 declared checks ran
    metric: checks_total
    op: greater_or_equal
    value: 7
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
