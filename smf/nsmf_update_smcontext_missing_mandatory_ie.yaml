# Nsmf_PDUSession_UpdateSMContext — empty / missing-IE body (negative/security).
# 3GPP TS 29.502 §6.1.6.2.x / §6.1.6.3.5.
#
# runner (AMF) POSTs an empty SmContextUpdateData ({}) to a modify endpoint — no
# meaningful update IEs. A spec-correct SMF MUST reject with a 4xx
# ProblemDetails (cause MANDATORY_IE_MISSING / no action requested) and stay up.
kind: flow
name: smf_nsmf_update_smcontext_missing_mandatory_ie
description: AMF Update SM context with empty body — expect 4xx rejection
category: negative
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_reject
        actions:
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts/deadbeef-0000-0000-0000-000000000000/modify",
                "headers": {"Content-Type": "application/json"},
                "body": {}
              }

  wait_reject:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: greater_than
            expected: 399
          - type: check
            field: sbi.status
            op: less_than
            expected: 500
