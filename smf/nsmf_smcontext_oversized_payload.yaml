# Nsmf_PDUSession_CreateSMContext — oversized payload (negative/security).
# 3GPP TS 29.500 §6.10; TS 29.502 §6.1.
#
# runner (AMF) POSTs a CreateSMContext whose body carries a grossly oversized field
# (a multi-kilobyte junk string in an unexpected attribute). A spec-correct SMF
# must bound request size / reject the malformed-oversized body (4xx, e.g. 400
# or 413 Payload Too Large) and stay up — it must not exhaust memory or crash.
kind: flow
name: smf_nsmf_smcontext_oversized_payload
description: AMF CreateSMContext with oversized body — expect 4xx rejection, SMF stays up
category: negative
type: client
protocol: sbi
nf: smf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_reject
        actions:
          # A long junk string stresses the SMF's request-size handling. Kept
          # inline (not a builder) since SBI_Request body is pass-through.
          - type: send
            message: SBI_Request
            peer: smf
            message_body: |
              {
                "method": "POST",
                "path": "/nsmf-pdusession/v1/sm-contexts",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 13,
                  "dnn": "internet",
                  "sNssai": {"sst": 1, "sd": "000001"},
                  "servingNetwork": {"mcc": "001", "mnc": "01"},
                  "anType": "3GPP_ACCESS",
                  "requestType": "INITIAL_REQUEST",
                  "extSsmContextPad": ""
                }
              }

  wait_reject:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: greater_than
            expected: 399
