# PFCP Heartbeat (3GPP TS 29.244 §6.2.2 / §7.4.3).
#
# Node-level liveness probe. Runik sends a PFCPHeartbeatRequest (auto-stamped
# with a RecoveryTimeStamp) and the UPF must answer with a
# PFCPHeartbeatResponse carrying its own RecoveryTimeStamp IE.
#
# Spec-correct success = a HeartbeatResponse arrives carrying a
# RecoveryTimeStamp IE (TS 29.244 §8.2.10).

kind: flow
name: smf_pfcp_heartbeat
description: SMF liveness-probes a real UPF via PFCP Heartbeat (N4)
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_heartbeat
        actions:
          - type: send
            message: PFCPHeartbeatRequest
            peer: upf

  wait_heartbeat:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPHeartbeatResponse
        target: settle
        actions:
          - type: check
            field: pfcp.recovery_timestamp
            op: not_empty

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `completed` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `completed`.
final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPHeartbeatRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPHeartbeatRequest
    op: equals
    value: 1
  - name: a PFCPHeartbeatResponse arrived
    metric: rx_events.pfcp.PFCPHeartbeatResponse
    op: greater_or_equal
    value: 1
  - name: all 1 declared checks ran
    metric: checks_total
    op: equals
    value: 1
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
