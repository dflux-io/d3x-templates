# N4/PFCP — the SMF side of a release the UPF asks for.
# 3GPP TS 29.244 §5.18 (enhanced PFCP association release), §6.2.7.3,
# §6.2.8, §7.4.4.3–§7.4.4.6.
#
# A UPF cannot release an association; only the CP function can. A UPF that
# wants out (maintenance, scale-in) sends an Association Update Request with
# the PFCP Association Release Request IE and a Graceful Release Period. The
# SMF accepts the update, moves its sessions away within the period, and then
# sends the Association Release Request itself.
#
# Runik is the SMF: it sets the association up, waits for that update, checks
# SARR is set and the period is 5 x 2 s, accepts — and 300 ms later (standing
# in for the period) releases.
#
# Pair: upf_pfcp_graceful_release is the UPF. Env: the SMF dials, the UPF
# listens (runik/config/lab-pfcp.yaml).
#
kind: flow
name: smf_pfcp_graceful_release_responder
description: SMF is asked by the UPF to release the association, accepts, and releases it
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - released
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_release_request
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
      # Out of order: this arrived before the AssociationSetupResponse.
      - event: pfcp.PFCPAssociationUpdateRequest
        target: wait_assoc_second
        actions:
          - type: check
            field: pfcp.pfcp_association_release_request.sarr
            op: equals
            expected: true
          - type: check
            field: pfcp.graceful_release_period.timer_unit
            op: equals
            expected: 1
          - type: check
            field: pfcp.graceful_release_period.timer_value
            op: equals
            expected: 5
          - type: send
            message: PFCPAssociationUpdateResponse

  wait_assoc_second:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: draining
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  wait_release_request:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationUpdateRequest
        target: draining
        actions:
          - type: check
            field: pfcp.pfcp_association_release_request.sarr
            op: equals
            expected: true
          - type: check
            field: pfcp.graceful_release_period.timer_unit
            op: equals
            expected: 1
          - type: check
            field: pfcp.graceful_release_period.timer_value
            op: equals
            expected: 5
          - type: send
            message: PFCPAssociationUpdateResponse

  # The graceful release period, shortened: sessions would be moved to
  # another UPF here.
  draining:
    on_timeout:
      duration: 300ms
      target: wait_release
      actions:
        - type: send
          message: PFCPAssociationReleaseRequest

  wait_release:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationReleaseResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: released

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `released`
    metric: final_state_counts.released
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPAssociationUpdateResponse sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationUpdateResponse
    op: equals
    value: 1
  - name: PFCPAssociationReleaseRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationReleaseRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPAssociationUpdateRequest arrived
    metric: rx_events.pfcp.PFCPAssociationUpdateRequest
    op: greater_or_equal
    value: 1
  - name: a PFCPAssociationReleaseResponse arrived
    metric: rx_events.pfcp.PFCPAssociationReleaseResponse
    op: greater_or_equal
    value: 1
  - name: all 5 declared checks ran
    metric: checks_total
    op: equals
    value: 5
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
