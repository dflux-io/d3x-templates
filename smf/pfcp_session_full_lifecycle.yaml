# N4/PFCP — one session, whole life.
# 3GPP TS 29.244 §6.3.2–§6.3.4; TS 23.502 (PDU session establishment,
# modification and release, AN release, service request, handover).
#
# Runik is the SMF. Each step below is one Session Modification, sent when the
# previous one was accepted:
#
# establish        two PDRs, two FARs, QER, URR; downlink buffered
# activate         gNB tunnel known: FAR 2 forwards into it
# add a QoS flow   PDR 3 + QER 2 for QFI 5
# go idle          FAR 2 buffers and notifies, BAR 1
# resume           FAR 2 forwards into a new tunnel
# hand over        FAR 2 moves to the target gNB, end markers on the old path
# throttle         QER 1 to 50 Mbit/s, downlink gate closed
# drop the flow    Remove PDR 3, Remove QER 2
# delete
#
# The single-step flows (smf_pfcp_dl_tunnel_activate, smf_pfcp_an_release, ...)
# say what each request means; this one is their sequence on one session.
#
# Pair: upf_pfcp_session_establish_responder. Env: the SMF dials, the UPF
# listens (runik/config/lab-pfcp.yaml).
#
kind: flow
name: smf_pfcp_session_full_lifecycle
description: SMF walks one PFCP session through everything a PDU session does, from establishment to deletion
category: functional
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  { "pdr_id": {"value": 1}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 1, "local_f_teid": {"ch": true},
                             "network_instance": {"value": "internet"}, "qfi": [{"value": 1}] },
                    "outer_header_removal": {"description": 1},
                    "far_id": {"value": 1}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] },
                  { "pdr_id": {"value": 2}, "precedence": {"value": 255},
                    "pdi": { "source_interface": 2, "network_instance": {"value": "internet"},
                             "ue_ip_address": {"v4": true, "sd": true, "ipv4_address": "{{$b64_ipv4 \"10.45.0.2\"}}"} },
                    "far_id": {"value": 2}, "qer_id": [{"value": 1}], "urr_id": [{"value": 1}] }
                ],
                "create_far": [
                  { "far_id": {"value": 1}, "apply_action": {"flags": 2},
                    "forwarding_parameters": { "destination_interface": 2,
                                               "network_instance": {"value": "internet"} } },
                  { "far_id": {"value": 2}, "apply_action": {"flags": 4} }
                ],
                "create_qer": [
                  { "qer_id": {"value": 1}, "gate_status": {"ul_gate": 1, "dl_gate": 1},
                    "maximum_bitrate": {"ul_mbr": 100000, "dl_mbr": 100000}, "qfi": {"value": 1} }
                ],
                "create_urr": [
                  { "urr_id": {"value": 1}, "measurement_method": {"flags": 2},
                    "reporting_triggers": {"flags": 2},
                    "volume_threshold": {"tovol": true, "total_volume": 1000000} }
                ],
                "pdn_type": {"value": 1}
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      # The UPF's answer names the N3 tunnel endpoint it chose for PDR 1 and
      # its own F-SEID; without both the SMF cannot hand a tunnel to the gNB.
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_activate
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.created_pdr[0].pdr_id.value
            op: equals
            expected: 1
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.teid
            op: equals
            expected: 4660
          - type: check
            field: pfcp.created_pdr[0].local_f_teid.ipv4_address
            op: equals
            expected: "192.0.2.1"
          - type: check
            field: pfcp.up_f_seid.seid
            op: greater_than
            expected: 0
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "update_far": [
                  { "far_id": {"value": 2}, "apply_action": {"flags": 2},
                    "update_forwarding_parameters": {
                      "destination_interface": 1,
                      "outer_header_creation": { "description": 256,
                        "teid": "{{$b64_u32 22136}}", "ipv4_address": "{{$b64_ipv4 \"192.0.2.10\"}}" } } } ] }

  wait_activate:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_flow_added
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "create_pdr": [
                  { "pdr_id": {"value": 3}, "precedence": {"value": 100},
                    "pdi": { "source_interface": 1, "qfi": [{"value": 5}],
                             "sdf_filter": [ {"fd": true, "flow_description": "permit out ip from 198.51.100.0/24 to assigned"} ] },
                    "outer_header_removal": {"description": 1},
                    "far_id": {"value": 1}, "qer_id": [{"value": 2}] } ],
                "create_qer": [
                  { "qer_id": {"value": 2}, "gate_status": {"ul_gate": 1, "dl_gate": 1},
                    "maximum_bitrate": {"ul_mbr": 5000, "dl_mbr": 5000},
                    "guaranteed_bitrate": {"ul_gbr": 1000, "dl_gbr": 1000}, "qfi": {"value": 5} } ] }

  wait_flow_added:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_buffering
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "create_bar": {"bar_id": {"value": 1}},
                "update_far": [ { "far_id": {"value": 2}, "apply_action": {"flags": 12}, "bar_id": {"value": 1} } ] }

  wait_buffering:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_resume
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "update_far": [
                  { "far_id": {"value": 2}, "apply_action": {"flags": 2},
                    "update_forwarding_parameters": {
                      "destination_interface": 1,
                      "outer_header_creation": { "description": 256,
                        "teid": "{{$b64_u32 22137}}", "ipv4_address": "{{$b64_ipv4 \"192.0.2.10\"}}" } } } ] }

  wait_resume:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_switched
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "update_far": [
                  { "far_id": {"value": 2}, "apply_action": {"flags": 2},
                    "update_forwarding_parameters": {
                      "destination_interface": 1,
                      "outer_header_creation": { "description": 256,
                        "teid": "{{$b64_u32 39612}}", "ipv4_address": "{{$b64_ipv4 \"192.0.2.11\"}}" },
                      "pfcpsmreq_flags": {"flags": 2} } } ] }

  wait_switched:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_qer_updated
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "update_qer": [
                  { "qer_id": {"value": 1}, "gate_status": {"ul_gate": 1, "dl_gate": 2},
                    "maximum_bitrate": {"ul_mbr": 50000, "dl_mbr": 50000} } ] }

  wait_qer_updated:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_flow_removed
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              { "remove_pdr": [ { "pdr_id": {"value": 3} } ],
                "remove_qer": [ { "qer_id": {"value": 2} } ] }

  wait_flow_removed:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: wait_delete
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionDeletionRequest

  wait_delete:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionDeletionResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: PFCPSessionModificationRequest sent 7x
    metric: msg_types.tx.pfcp.PFCPSessionModificationRequest
    op: equals
    value: 7
  - name: PFCPSessionDeletionRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionDeletionRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionModificationResponse arrived
    metric: rx_events.pfcp.PFCPSessionModificationResponse
    op: greater_or_equal
    value: 7
  - name: a PFCPSessionDeletionResponse arrived
    metric: rx_events.pfcp.PFCPSessionDeletionResponse
    op: greater_or_equal
    value: 1
  - name: all 14 declared checks ran
    metric: checks_total
    op: equals
    value: 14
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
