# PFCP Heartbeat without a prior Association (3GPP TS 29.244 §7.4.2 / §6.2.2).
#
# Security/robustness: a node-level Heartbeat is sent BEFORE any
# PFCPAssociationSetup. Per TS 29.244 the Heartbeat is node-level and does not
# require an established association, so a spec-correct UPF either answers with
# a PFCPHeartbeatResponse (carrying its RecoveryTimeStamp) or silently ignores
# the stray request — in both cases it must STAY UP. The cross-cutting goal,
# like the gNB security suite, is that the UPF reacts spec-correctly and does
# not crash.
#
# Tolerated terminal:
#   - response arrives  -> "tolerated" (UPF answered, RecoveryTimeStamp present)
#   - silent drop       -> on_timeout -> "tolerated" (no crash; liveness)
# Run with success_when: at_least_one_final_state: tolerated.

kind: flow
name: smf_pfcp_heartbeat_no_association
description: Stray PFCP Heartbeat with no association; UPF tolerates and stays up
category: negative
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_heartbeat
        actions:
          - type: send
            message: PFCPHeartbeatRequest
            peer: upf

  wait_heartbeat:
    # No response is itself a spec-allowed reaction (silent drop), so the
    # timeout lands on the tolerated terminal rather than failed.
    on_timeout:
      duration: 5s
      target: tolerated
    transitions:
      - event: pfcp.PFCPHeartbeatResponse
        target: settle
        actions:
          - type: check
            field: pfcp.recovery_timestamp
            op: not_empty

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `tolerated` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: tolerated

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `tolerated`.
final_checks:
  - name: the flow reached `tolerated`
    metric: final_state_counts.tolerated
    op: equals
    value: 1
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
