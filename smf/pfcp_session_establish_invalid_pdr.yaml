# PFCP Session Establishment with an invalid PDR (dangling FAR reference)
# (3GPP TS 29.244 §7.5.2 / §8.2.1 / §7.6).
#
# Security/negative: the Create PDR references FAR ID 99, but the only FAR
# the request creates is FAR 1 (dangling rule reference). A spec-correct UPF
# must REJECT and install nothing, returning Cause "Rule creation/modification
# Failure" (TS 29.244 §8.2.1, value 73: "used by the UP function if a received
# Rule failed to be stored and be applied") with the PDR in Failed Rule ID
# (Table 7.5.3.1-1). The on_timeout/tolerated fallback covers a UPF that drops
# instead.
#
# The request DOES carry a Create FAR. Create FAR is "M" in Table 7.5.2.1-1,
# so a request with no Create FAR at all is a different defect with a
# different answer — "Mandatory IE missing" with Create FAR as the Offending
# IE (§7.6.6) — and an earlier version of this flow, which sent none, was
# asking a spec-correct UPF for the wrong cause.
#
# Spec-correct success = a SessionEstablishmentResponse whose Cause indicates
# rule-creation failure.

kind: flow
name: smf_pfcp_session_establish_invalid_pdr
description: Session Establishment with a dangling FAR reference; UPF must reject
category: negative
type: client
protocol: pfcp
nf: smf

initial_state: idle
final_states:
  - rejected
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          # PDR points at FAR id 99; only FAR 1 is created -> dangling ref.
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true, "v4": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 99}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: tolerated
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: settle_rejected
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Rule creation/modification Failure"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `rejected` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle_rejected:
    on_timeout:
      duration: 100ms
      target: rejected

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `rejected`.
final_checks:
  - name: the flow reached `rejected`
    metric: final_state_counts.rejected
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPSessionEstablishmentRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPSessionEstablishmentRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPSessionEstablishmentResponse arrived
    metric: rx_events.pfcp.PFCPSessionEstablishmentResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
