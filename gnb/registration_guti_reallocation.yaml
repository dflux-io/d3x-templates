# 5G-GUTI reallocation is part of initial registration, and REGISTRATION
# COMPLETE stops T3550 (register row REG-102).
#
# Clauses (retrieved with matrix/scripts/spec-clause.py, not recalled):
#
#   TS 24.501 §5.5.1.2.4 — "The 5G-GUTI reallocation shall be part of the
#   initial registration procedure. During the initial registration procedure,
#   if the AMF has not allocated a new 5G-GUTI by the generic UE configuration
#   update procedure, the AMF shall include in the REGISTRATION ACCEPT message
#   the new assigned 5G-GUTI together with the assigned TAI list."
#
#   TS 24.501 §5.5.1.2.4 — "If a 5G-GUTI or the SOR transparent container IE is
#   included in the REGISTRATION ACCEPT message, the AMF shall start timer
#   T3550 …" and "Upon receiving a REGISTRATION COMPLETE message, the AMF shall
#   stop timer T3550 and change to state 5GMM-REGISTERED."
#
#   TS 24.501 §5.5.1.2.8 c) — "T3550 time-out. On the first expiry of the
#   timer, the AMF shall retransmit the REGISTRATION ACCEPT message and shall
#   reset and restart timer T3550."
#
#   TS 24.501 §5.3.3 — "The AMF shall assign a new 5G-GUTI for a particular UE:
#   a) during a successful initial registration procedure;"
#
# ---------------------------------------------------------------------------
# How the ABSENCE half of the pass criterion is encoded — read before editing
# ---------------------------------------------------------------------------
# The criterion is "after REGISTRATION COMPLETE is sent, no retransmitted
# REGISTRATION ACCEPT arrives". An FSM cannot assert a non-event with a
# `check`, and the runner has no "absent" operator, so the absence is encoded
# as the SHAPE of the wait_no_retransmission state:
#
#   * a retransmitted REGISTRATION ACCEPT — on either carriage, a
#     DownlinkNASTransport (the normal one once the UE context exists) or a
#     second InitialContextSetupRequest — has an EXPLICIT transition to
#     `failed`. Without that transition the message would merely be
#     unconsumed and the row would pass by ignoring the very thing it tests.
#     THAT explicit transition is what makes the timeout below meaningful.
#
#   * only then does `on_timeout -> registered` (a SUCCESS terminal) mean
#     what it says: "the observation window closed with the retransmission
#     never having arrived". This is the one place in this batch where an
#     on_timeout legitimately targets something other than `failed`; it is the
#     positive outcome of an absence assertion, not a lenient escape hatch.
#     Every other on_timeout in this flow still targets `failed`.
#
# Window length: §5.5.1.2.8 c) puts the first retransmission one T3550 expiry
# after the REGISTRATION ACCEPT, so the window has to be longer than T3550 or
# the assertion is vacuous — it would close before the retransmission it looks
# for could possibly arrive. The register row's absent_after_s: 5 is too short:
# a control probe (this flow with the RegistrationComplete send removed;
# scratchpad only, not committed) measured open5gs retransmitting the accept
# 6.007 s later, as a DownlinkNASTransport. Hence 8 s here, and recommend
# absent_after_s: 8 on the row. (The 6 s T3550 default is measured behaviour,
# not a citation: TS 24.501 table 10.2.2 did not come back out of the corpus.)
#
# Same probe on tinycore: no retransmission in 25 s — tinycore does not
# implement §5.5.1.2.8 c) at all, so it satisfies this absence assertion
# trivially rather than by stopping T3550. That gap belongs to register row
# REG-145 (T3550 retransmits the accept four times then aborts), which is
# unbound; it is noted here so a green REG-102 on tinycore is not over-read.
#
# Positive/negative pairing for the GUTI check: `nas.guti` is asserted with
# `ie_present` (which fails on a misspelled path, unlike `equals: null`), and
# the identity type is pinned to 2 = 5G-GUTI so a SUCI/IMEI-shaped mobile
# identity in that slot cannot satisfy it.

kind: flow
name: registration_guti_reallocation
description: Initial registration; assert a new 5G-GUTI in the Registration Accept and no T3550 retransmission after Registration Complete
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - registered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            message_body: |
              {
                "criticality": 1,
                "rrc_establishment_cause": 0,
                "ue_context_request": 1
              }

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_no_retransmission
        actions:
          - { type: check, field: security_key, op: not_empty }
          # §5.5.1.2.4: the new 5G-GUTI is mandatory in this REGISTRATION
          # ACCEPT. identity_type 2 = 5G-GUTI (TS 24.501 §9.11.3.4), and the
          # 5G-TMSI is the part that actually identifies the UE.
          - { type: check, field: nas.guti, op: ie_present }
          - { type: check, field: nas.guti.identity_type, op: equals, expected: 2 }
          - { type: check, field: nas.guti.tmsi_5g, op: ie_present }
          # NOT asserted here: the "together with the assigned TAI list" half
          # of the same sentence. tinycore omits the TAI list IE (measured
          # 2026-08-10) — that is register row REG-103's subject, and folding
          # it in here would make REG-102 red for a defect that is not the one
          # REG-102 names.
          - { type: send, message: InitialContextSetupResponse }
          # REGISTRATION COMPLETE acknowledges the reallocated 5G-GUTI and is
          # what must stop T3550.
          - { type: send, message: RegistrationComplete }

  # Absence window — see the header note. A retransmitted REGISTRATION ACCEPT
  # here means the AMF did not stop T3550 on our REGISTRATION COMPLETE.
  wait_no_retransmission:
    on_timeout:
      duration: 8s
      target: registered
    transitions:
      - event:
          or:
            - NASDownlinkTransport.RegistrationAccept
            - InitialContextSetupRequest.RegistrationAccept
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-102).
#
# REG-102 — nas.guti is present in the decoded RegistrationAccept; after REGISTRATION
# COMPLETE is sent no retransmitted RegistrationAccept arrives within absent_after_s
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  # THE TERMINAL, AND WHAT IT DOES NOT PROVE ON ITS OWN. Every path to `registered` in
  # this flow ends on a TIMER — the absence window is the point of the row — so this pin
  # says "the flow got as far as the window and nothing knocked it out", and the message
  # assertions below are what say the run happened at all.
  - name: the flow reached `registered`
    metric: final_state_counts.registered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  # "…after REGISTRATION COMPLETE is sent no retransmitted
  # RegistrationAccept arrives within absent_after_s" (REG-102). This is
  # the one row in this set whose accept count is EXACTLY one rather than a
  # floor: a second accept is the T3550 retransmission of TS 24.501
  # §5.5.1.2.7, and its arrival means the AMF did not treat our
  # REGISTRATION COMPLETE as the acknowledgement of the new 5G-GUTI.
  - name: exactly one REGISTRATION ACCEPT arrived — no T3550 retransmission
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: equals
    value: 1
  # The six `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all six declared checks ran
    metric: checks_total
    op: equals
    value: 6
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
