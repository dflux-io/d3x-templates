# Registration + immediate re-registration with same SUCI.
#
# YAML mirror of the built-in `duplicate_registration` flow defined in
# runner/flows/gnb/flow_duplicate_registration.go.

kind: flow
name: duplicate_registration
description: Registration + immediate re-registration with same SUCI — test AMF handling (YAML)
detail: |
  Performs a complete initial registration (establishing security context and UE
  association), then immediately initiates a second registration using the same
  subscriber identity (SUCI) via a new InitialUEMessage.

  Per 3GPP TS 24.501 §5.5.1.2, the AMF should handle a new registration from an
  already-registered UE by treating it as a mobility registration update or
  re-registration. The AMF may also release the old context first
  (UEContextReleaseCommand for the first RAN-UE-NGAP-ID) before proceeding with
  the new registration.

  This is a negative/robustness test that validates the AMF correctly handles
  duplicate registrations without state corruption, resource leaks, or crashes.
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - re_registered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_second_auth
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: ngap_realloc
          - type: send
            message: InitialUEMessage

  wait_second_auth:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_second_security_mode
        actions:
          - type: send
            message: AuthResponse

  wait_second_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_second_context_setup
        actions:
          - type: send
            message: SecurityModeComplete

  wait_second_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: re_registered
        actions:
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

any_state_transitions:
  - event: Error
    target: failed
  # AMF may release the old context — absorb and stay in current state
  - event: UEContextReleaseCommand
    target: _self

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-142).
#
# REG-142 — The second registration draws an AuthenticationRequest, SecurityModeCommand
# or RegistrationAccept, and the first UE-associated NG connection does not continue to
# be served (no further downlink NAS on the old AMF-UE-NGAP-ID)
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `re_registered`
    metric: final_state_counts.re_registered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: two INITIAL CONTEXT SETUP RESPONSE messages went out
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 2
  - name: two INITIAL UE MESSAGE messages went out
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 2
  - name: six NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 6
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: two REGISTRATION ACCEPT messages arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 2
  - name: two AUTHENTICATION REQUEST messages arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 2
  - name: two SECURITY MODE COMMAND messages arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 2
  # The four `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all four declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
