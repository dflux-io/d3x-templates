# N2 HandoverRequired carrying a stale AMF-UE-NGAP-ID (TS 38.413 §10.6 / §10.4).
# Registers, then sends HandoverRequired with amf_ue_ngap_id 8388607 — not this
# UE's id. REG-507 accepts an ErrorIndication echoing those AP IDs, or a silent
# discard. Neither may produce a HandoverCommand, and the association stays up.
# Tinycore's handleHandoverRequired returns without a response when the id
# matches no UE, so the discard leg is the one this core takes. The absence
# window used to time out into `failed`, which Runik counts as a failed flow
# even though the criterion permits the discard. The probe after that window
# is what separates a discard from a dead association.
kind: flow
name: n2_handover_required_stale_amf_ue_ngap_id
description: HandoverRequired with a stale AMF-UE-NGAP-ID; no HandoverCommand, association stays up (YAML)
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states: [prep_failed, discarded, handed_over, failed]
states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions: [{ type: send, message: InitialUEMessage }]
  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }
  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_ho_reaction
        actions:
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          - type: send
            message: HandoverRequired
            message_body: |
              { "amf_ue_ngap_id": 8388607 }
  wait_ho_reaction:
    # Silence is not yet a terminal. REG-507's discard is only a pass once a
    # later uplink on the real UE ids still draws a downlink.
    on_timeout:
      duration: 12s
      target: prove_association_up
      actions:
        - { type: send, message: PDUSessionEstablishmentRequest }
    transitions:
      - { event: HandoverPreparationFailure, target: prep_failed }
      - { event: ErrorIndication, target: prep_failed }
      - { event: HandoverCommand, target: handed_over }
      # Releasing the live UE is not "the association stays up". Answer the
      # command (the default would) and fail the row.
      - event: UEContextReleaseCommand
        target: failed
        actions:
          - { type: send, message: UEContextReleaseComplete }
  prove_association_up:
    on_timeout: { duration: 8s, target: failed }
    transitions:
      # Any downlink for this UE is the association still serving it. The
      # session accept is what this lab's AMF sends; a reject or a §5.4.5.3.2
      # #90 is the same proof when the SMF refuses the probe.
      - event: PDUSessionResourceSetupRequest
        target: discarded
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
      - event:
          or:
            - NASDownlinkTransport.PDUSessionEstablishmentReject
            - NASDownlinkTransport.DLNASTransport.PDUSessionEstablishmentReject
            - NASDownlinkTransport.DLNASTransport.PDUSessionEstablishmentAccept
            - NASDownlinkTransport.DLNASTransport.PayloadNotForwarded
            - NASDownlinkTransport.5GMMStatus
        target: discarded
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
      - { event: HandoverCommand, target: handed_over }
      - event: UEContextReleaseCommand
        target: failed
        actions:
          - { type: send, message: UEContextReleaseComplete }
      - { event: ErrorIndication, target: failed }
any_state_transitions:
  - { event: Error, target: failed }

# END-OF-FLOW ASSERTIONS — Runik is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-507 (robustness, expected_terminal: null) — An
# ErrorIndication is received on the source association echoing the offending AP ID(s),
# or the message is silently discarded; in neither case is a HandoverCommand produced,
# and the association stays up.
#
# NO PASS TERMINAL IS PINNED. REG-507 declares `expected_terminal: null` and accepts an
# ErrorIndication OR a silent discard. Pinning `prep_failed` would fail a core that
# discards, which §10.6 also permits. `discarded` is that discard, and only after
# prove_association_up saw a downlink for the real UE — a timer alone is not the
# association staying up. What the criterion rules out without an alternative is a
# HandoverCommand (`handed_over` equals 0) and a dead association (`failed` equals 0).
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality.
#
# THE FLOOR IS 2, THE PREAMBLE. `amf_ue_ngap_id` not_empty and `ue.SecCtx` not_empty
# both lie on the only route to the handover. The discard path adds a third check
# (`amf_ue_ngap_id` on the probe); the ErrorIndication path does not, so 2 is the
# minimum and the floor stays 2. `checks_failed equals 0` is true of a run that
# evaluated nothing, which is why the floor is here.
final_checks:
  - name: no UE ended in `handed_over` — no HANDOVER COMMAND was produced
    metric: final_state_counts.handed_over
    op: equals
    value: 0
  - name: no UE ended in `failed` — the association or the preamble died
    metric: final_state_counts.failed
    op: equals
    value: 0
  - name: both pre-handover checks actually ran — `checks_failed` alone is true of a run that evaluated nothing
    metric: checks_total
    op: greater_or_equal
    value: 2
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
