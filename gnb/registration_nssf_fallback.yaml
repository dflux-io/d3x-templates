# 5G UE initial registration asserting AMF static Allowed NSSAI fallback
# when NSSF is unreachable (e2e-gnb-run.sh stops tinycore-nssf first).
#
# Lab contract:
#   - dmf -sst 1 (no -sd) → staticAllowedNssai is a single S-NSSAI {sst:1}
#   - AMF computeAllowedNssai falls back on NSSF error / empty / unwired
#     (tinycore/dmf/amf/nssf.go)
#
# Distinct from registration_nssf_allowed (expects 2 NSSF-plan slices).
# Run via suites/gnb_nssf_fallback.yaml (e2e-gnb-run.sh step 10-nssf-fallback).

kind: flow
name: registration_nssf_fallback
description: Registration + assert Allowed NSSAI is AMF static single-slice fallback
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - registered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            message_body: |
              {
                "criticality": 1,
                "rrc_establishment_cause": 0,
                "ue_context_request": 1
              }

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: registered
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          # Static fallback: a single S-NSSAI, sst=1, no SD.
          #
          # NOTE (xp-255): the parenthetical here used to read "(omitempty omits
          # sd=0)". That was wrong on both halves. decodeSNSSAI defaults an
          # ABSENT SD to the 0xFFFFFF sentinel (nas_ies.go), not to 0, so
          # `,omitempty` never omitted it; and non-pointer fields no longer
          # carry `,omitempty` at all. The SD is therefore observable — but this
          # flow still does not assert it, so it cannot today tell the AMF
          # static fallback apart from the NSSF-derived slice that
          # registration_nssf_allowed expects (sst=1, sd=1). Closing that gap
          # means asserting `snssai_list.0.sd equals 16777215` once the lab's
          # dmf static fallback is confirmed to emit no SD octets; unmeasured
          # in the 2026-08-11 matrix run (no REG trace for this flow), so it is
          # reported rather than guessed at.
          - type: check
            field: nas.allowed_nssai
            op: ie_present
          - type: check
            field: nas.allowed_nssai.snssai_list
            op: length
            expected: 1
          - type: check
            field: nas.allowed_nssai.snssai_list.0.sst
            op: equals
            expected: 1
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-106).
#
# REG-106 — nas.allowed_nssai.snssai_list in the decoded RegistrationAccept contains
# every S-NSSAI marked default in the provisioned subscription, including its SD, and
# contains no S-NSSAI that is not subscribed
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `registered`
    metric: final_state_counts.registered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  # The seven `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all seven declared checks ran
    metric: checks_total
    op: equals
    value: 7
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
