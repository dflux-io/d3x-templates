# gNB-initiated PDUSessionResourceNotify reporting QoS-flow / session release
# (3GPP TS 38.413 §8.2.5 / §9.2.1.5).
#
# Under test: after a PDU session is established, the gNB sends a
# PDUSessionResourceNotify carrying a released-session entry for the active PDU
# session id, signalling that QoS flows / the session are no longer fulfilled on
# the RAN side. A compliant AMF processes the notification (and may trigger SMF
# action) without crashing or tearing down unrelated state.
#
# gNB-initiated, so deterministically testable. Success terminal `notified`
# (quiet timeout) or `handled` (the AMF reacts with a 5GMM STATUS). An ERROR
# INDICATION is the failure REG-380's criterion names and lands on `failed`.

kind: flow
name: pdu_session_resource_notify_qos_flow_release
description: Establish a PDU session, then send PDUSessionResourceNotify (released); assert AMF tolerance (YAML)
detail: |
  Registers, establishes a PDU session, then sends a gNB-initiated
  PDUSessionResourceNotify whose released list references the active PDU session
  id (3GPP TS 38.413 §8.2.5). A compliant AMF accepts the notification and stays
  healthy. Reaching `notified` (quiet timeout) or `handled` (a 5GMM STATUS) is
  the assertion; an ERROR INDICATION is the failure the row names.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - notified
  - handled
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say so
            # (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1 connection
            # as soon as registration completes, and free5GC does.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_reaction
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          # N2 tunnel fidelity: UPF uplink GTP-U F-TEID present (non-zero)
          # at establishment — proves the tunnel was allocated (T2 item 5).
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          # gNB-initiated notify: this session's QoS flows released.
          - type: send
            message: PDUSessionResourceNotify

  wait_reaction:
    on_timeout:
      duration: 8s
      target: notified
    transitions:
      # AN ERROR INDICATION IS THE FAILURE THIS ROW NAMES, so it terminates in
      # `failed` and not in `handled`. It used to route to `handled`, a declared
      # NON-failure terminal, while the final_check below asserts
      # `rx_events.ErrorIndication equals 0` — so reaching `handled` this way
      # GUARANTEED that check failed, and the runner's report then said the flow
      # ended in a success terminal about a run it had just scored red. Proven
      # live 2026-08-17: with an ErrorIndication provoked in this window the row
      # reported `final_state_counts: {handled: 1}` alongside `verdict: fail`.
      # The criterion is the arbiter and it is unambiguous — "the NG association
      # stays up WITH NO ErrorIndication" — so the routing was the wrong half.
      - event: ErrorIndication
        target: failed
      # A 5GMM STATUS violates nothing the criterion names; it is the AMF
      # reacting at the NAS layer and is recorded as its own terminal.
      - event: NASDownlinkTransport.5GMMStatus
        target: handled

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-380 (abnormal, expected_terminal: null) — After
# the PDUSessionResourceNotify the NG association stays up with no ErrorIndication, and
# either a PDUSessionResourceModifyRequest or a PDUSessionResourceReleaseCommand for
# that session follows, or the session remains releasable normally
#
# NO TERMINAL IS PINNED, AND THE ERROR-INDICATION CONTRADICTION IS NOW FIXED. REG-380
# declares `expected_terminal: null` and requires "the NG association stays up WITH NO
# ErrorIndication, and either a PDUSessionResourceModifyRequest or a
# PDUSessionResourceReleaseCommand for that session follows, or the session remains
# releasable normally".
#
# This FSM used to route an ERROR INDICATION to `handled`, a NON-failure terminal — the
# very message the criterion calls a failure — while the first check below asserts
# `rx_events.ErrorIndication equals 0`. Those two could not both be satisfied: reaching
# `handled` by that route guaranteed the check failed, so the row was unpassable on that
# path and, worse, the runner's report named a success terminal for a run it had scored
# red. Corrected 2026-08-17 by routing ERROR INDICATION to `failed`, which is what the
# criterion says it is. The check was kept because the criterion is the arbiter and it is
# unambiguous on this point.
#
# Still not expressed, and not in scope for v1: the criterion's POSITIVE observation (a
# follow-up modify or release for that session) has no terminal at all, and `notified` is
# the bare 8 s timer. Both need an FSM that waits for the follow-up.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: no ERROR INDICATION followed the PDU SESSION RESOURCE NOTIFY
    metric: rx_events.ErrorIndication
    op: equals
    value: 0
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 5
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
