# Registration + UE-initiated deregistration (3GPP TS 24.501 §5.5.1 + §5.5.2).
#
# YAML mirror of the built-in `deregistration` flow defined in
# runner/flows/gnb/flow_deregistration.go. Composes registrationStates +
# deregistrationStates.

kind: flow
name: deregistration
description: Registration + UE-initiated deregistration from the 5G network (YAML)
detail: |
  Performs UE registration followed by UE-initiated deregistration (3GPP TS 24.501
  §5.5.2). After completing registration, the UE sends an UplinkNASTransport
  carrying a NAS-secured DeregistrationRequest. The AMF may respond with a
  DeregistrationAccept (acknowledging the request) or may skip the accept and
  proceed directly to resource cleanup. In either case, the AMF sends a
  UEContextReleaseCommand to the gNB, which responds with UEContextReleaseComplete
  to confirm that all radio and signalling resources have been freed.

  Some AMF implementations (e.g., Open5GS) send the DeregistrationAccept before
  the UEContextReleaseCommand, while others skip the accept entirely — both are
  valid per the 3GPP spec. The flow handles both paths.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - deregistered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say so
            # (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1 connection
            # as soon as registration completes, and free5GC does.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_dereg_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: DeregistrationRequest

  wait_dereg_accept:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.DeregistrationAccept
        target: wait_release
      - event: UEContextReleaseCommand
        target: deregistered
        actions:
          - type: check
            field: ran_ue_ngap_id
            op: not_empty
          - type: send
            message: UEContextReleaseComplete

  wait_release:
    on_timeout:
      duration: 10s
      target: deregistered
    transitions:
      - event: UEContextReleaseCommand
        target: deregistered
        actions:
          - type: check
            field: ran_ue_ngap_id
            op: not_empty
          - type: send
            message: UEContextReleaseComplete

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-174).
#
# REG-174 — A DeregistrationAccept and/or a UEContextReleaseCommand is received; the
# flow reaches terminal state 'deregistered'
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  # THE TERMINAL. One route to `deregistered` is a timer (the absence window), so the
  # message assertions below are what separate "reached it" from "waited it out".
  - name: the flow reached `deregistered`
    metric: final_state_counts.deregistered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: four NAS UPLINK TRANSPORT messages went out (AuthResponse, DeregistrationRequest, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 4
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  # Several routes reach `deregistered` with different numbers of checks
  # (4..5); 4 is the shortest one, so it is the floor that still proves
  # an assertion was made on the messages this run saw.
  - name: at least four declared checks ran
    metric: checks_total
    op: greater_or_equal
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
