# Registration immediately after a completed de-registration succeeds cleanly
# (register row REG-185).
#
# CLAUSES (retrieved with matrix/scripts/spec-clause.py, not recalled).
#
#   TS 24.501 §5.3.3 — "The AMF shall assign a new 5G-GUTI for a particular UE:
#   a) during a successful initial registration procedure; …" and "The purpose
#   of the 5G-GUTI and 5G-S-TMSI is to provide identity confidentiality, i.e.,
#   to protect a user from being identified and located by an intruder."
#
#   TS 24.501 §5.5.1.2.4 — "The 5G-GUTI reallocation shall be part of the
#   initial registration procedure. During the initial registration procedure,
#   if the AMF has not allocated a new 5G-GUTI by the generic UE configuration
#   update procedure, the AMF shall include in the REGISTRATION ACCEPT message
#   the new assigned 5G-GUTI together with the assigned TAI list."
#
# WHAT THIS ROW IS FOR, AS DISTINCT FROM `deregistration`.
# `deregistration` (REG-174) ends when the context is released and asserts
# nothing about what the AMF is able to do NEXT. The interesting failure this
# row catches is state left behind by the de-registration: an AUSF or AMF that
# purged something it should have kept, or kept something it should have purged,
# shows up as the immediately following registration being rejected, hanging, or
# — most quietly of all — being answered with the SAME 5G-GUTI the de-registered
# session had. That last one is a linkability defect: the whole point of the
# temporary identity is that an observer cannot tie two sessions of one
# subscriber together, and re-issuing the value across a de-registration
# boundary hands them exactly that link.
#
# xp-208 is why this row is P0 rather than a nicety: a detached SUPI-keyed AUSF
# purge that deleted the NEXT registration's auth context cost four agents
# across three waves to find, and it lives precisely in this seam.
#
# WHAT THE CHECKS ASSERT.
#   * "succeeds cleanly" is asserted as the SHAPE of phase 2 — the flow only
#     reaches the pass terminal by walking AUTHENTICATION REQUEST -> SECURITY
#     MODE COMMAND -> INITIAL CONTEXT SETUP REQUEST carrying a REGISTRATION
#     ACCEPT with a non-empty Security Key. A REGISTRATION REJECT has its own
#     explicit transition to `re_registration_rejected`, so a refusal is
#     recorded as a refusal instead of falling through to a timeout.
#   * "a fresh 5G-GUTI" is the `not_contains` against the 5G-TMSI snapshotted
#     from the phase-1 accept.
#
# THE TRAP IN THAT LAST CHECK: `not_contains` PASSES ON A MISSING FIELD
# (evaluateCheck in runner/runner/action_executor.go treats absence as vacuously
# satisfied). An accept with no 5G-GUTI IE at all would slip through it. That is
# why the inequality is preceded by `nas.guti ie_present`, `identity_type equals
# 2` and `nas.guti.tmsi_5g ie_present`, every one of which fails on absence.
#
# MEASURED AGAINST tinycore 2026-08-11: PASS, terminal `re_registered`. The two
# 5G-TMSIs were different in every run. ACCEPTANCE TEST for the inequality:
# flipping it to `contains` (scratchpad only, not committed) FAILED with
# `nas.guti.tmsi_5g contains Ujl5yw== (actual=h6XRtg==)`, so the check reads two
# genuinely different live values and can report the other verdict.
kind: flow
name: registration_after_deregistration
description: Register, de-register, then register again; assert the second registration completes and is assigned a different 5G-GUTI (YAML)
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - re_registered
  - re_registration_rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after this registration — the
            # DEREGISTRATION REQUEST below — so the FOR bit must say so
            # (TS 24.501 §9.11.3.7), or a conformant AMF may release the N1
            # connection the moment registration completes.
            params: { follow_on_request: true }

  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }

  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }

  wait_context_setup:
    on_timeout: { duration: 12s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_dereg_reaction
        actions:
          # Baseline for the phase-2 inequality; also the precondition that
          # phase 1 was itself a conformant initial registration.
          - { type: check, field: nas.guti, op: ie_present }
          - { type: check, field: nas.guti.identity_type, op: equals, expected: 2 }
          - { type: check, field: nas.guti.tmsi_5g, op: ie_present }
          - { type: extract, field: nas.guti.tmsi_5g, store: first_tmsi }
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          # The de-registration whose completion phase 2 must survive.
          - { type: send, message: DeregistrationRequest }

  # The de-registration must actually COMPLETE before phase 2 starts, or this
  # row is testing a re-registration racing a teardown rather than one that
  # follows it. Both orderings the spec permits are handled: some AMFs send
  # DEREGISTRATION ACCEPT then the release, some go straight to the release.
  wait_dereg_reaction:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.DeregistrationAccept
        target: wait_dereg_release
      - event: UEContextReleaseCommand
        target: wait_reg2_auth
        actions:
          - { type: send, message: UEContextReleaseComplete }
          - { type: ngap_realloc }
          - { type: send, message: InitialUEMessage }

  wait_dereg_release:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: UEContextReleaseCommand
        target: wait_reg2_auth
        actions:
          - { type: send, message: UEContextReleaseComplete }
          # New RAN UE NGAP ID: phase 2 is a fresh UE-associated logical
          # NG-connection, exactly as it would be for a UE that had powered
          # its radio down and come back.
          - { type: ngap_realloc }
          # A plain SUCI-identified INITIAL registration — the UE has been
          # de-registered, so it presents itself from scratch.
          - { type: send, message: InitialUEMessage }

  # ---- phase 2: the registration that must succeed cleanly ----------------
  wait_reg2_auth:
    on_timeout: { duration: 12s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_reg2_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }
      # A refusal right after de-registration is the defect this row hunts.
      - { event: NASDownlinkTransport.RegistrationReject, target: re_registration_rejected }

  wait_reg2_security_mode:
    on_timeout: { duration: 12s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_reg2_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
      - { event: NASDownlinkTransport.RegistrationReject, target: re_registration_rejected }

  wait_reg2_context_setup:
    on_timeout: { duration: 12s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: re_registered
        actions:
          - { type: check, field: security_key, op: not_empty }
          # THE row assertions — the presence trio guards the inequality from
          # passing vacuously on an omitted 5G-GUTI IE. See the header.
          - { type: check, field: nas.guti, op: ie_present }
          - { type: check, field: nas.guti.identity_type, op: equals, expected: 2 }
          - { type: check, field: nas.guti.tmsi_5g, op: ie_present }
          - { type: check, field: nas.guti.tmsi_5g, op: not_contains, expected: "{{ue.Params.first_tmsi}}" }
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
      - { event: NASDownlinkTransport.RegistrationReject, target: re_registration_rejected }

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-185 (positive, expected_terminal: re_registered) —
# The second registration reaches RegistrationAccept and its nas.guti differs from the
# one assigned before de-registration
#
# REG-185: "The second registration reaches RegistrationAccept and its nas.guti differs
# from the one assigned before de-registration." The accept is the only route into
# `re_registered` and the "differs" half is a per-step check. `re_registration_rejected`
# is a REGISTRATION REJECT for a subscriber that had just de-registered cleanly.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `re_registered` — the terminal this row claims
    metric: final_state_counts.re_registered
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 12
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
