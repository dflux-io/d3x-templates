# IPv6 PDU session USER PLANE, UDP: a UDP datagram from the UE's
# autoconfigured address to the data network is echoed back through the UPF.
#
# The companion of pdu_session_ipv6_ra_ping6 (which holds the Router
# Advertisement's content to TS 29.061 §11.2.1.3.4): here the address only has
# to have been configured, and the payload is UDP rather than ICMPv6 — so a UPF
# that special-cased ICMPv6 on the IPv6 path, or a datapath that broke the UDP
# checksum (mandatory over IPv6, RFC 8200 §8.1), fails it.
#
# The window asks for UDP itself (uplane_start `protocol: udp`), whatever the
# gNB's configured probe protocol is. The target is gnb.uplane.target_addr6 on
# port 5001 (the d3x lab's `dn` runs `rk server uspace -protocol udp`).
kind: flow
name: pdu_session_ipv6_udp6
description: IPv6 PDU session user plane over UDP — after the Router Advertisement configures the UE's address, UDP over IPv6 to the data network is echoed back through the UPF (YAML)
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - user_plane_verified
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - { type: send, message: InitialUEMessage, params: { follow_on_request: true } }

  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: extract, field: amf_ue_ngap_id, store: pilot_amf_id }
          - { type: send, message: AuthResponse }

  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }

  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - { type: check, field: security_key, op: not_empty }
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          - type: send
            message: PDUSessionEstablishmentRequest
            params:
              # PDU session type IE = "IPv6" (TS 24.501 §9.11.4.11 value 2).
              pdu_session_type: 2

  wait_pdu_session_accept:
    on_timeout: { duration: 15s, target: failed }
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: uplane_window
        actions:
          - { type: check, field: ue.Params.pdu_accept_selected_pdu_session_type, op: equals, expected: 2 }
          # The interface identifier the UE will build both its link-local and
          # its global address from (TS 24.501 §9.11.4.10).
          - { type: check, field: ue.Params.pdu_accept_pdu_address_ipv6_iid_len, op: equals, expected: 8 }
          - { type: check, field: ue.UpfTeid, op: greater_than, expected: 0 }
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              { "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}" }
          # Router Solicitation from fe80::<iid>, then UDP from
          # <RA prefix>::<iid> to gnb.uplane.target_addr6 port 5001.
          - { type: uplane_start, params: { duration: 4s, protocol: udp } }

  uplane_window:
    on_timeout: { duration: 15s, target: failed }
    transitions:
      - event: UplaneComplete
        target: user_plane_verified
        actions:
          - { type: check, field: ue.UplaneReport, op: not_empty }
          # The address was configured from an RA, with the accept's
          # interface identifier (pdu_session_ipv6_ra_ping6 checks the RA).
          - { type: check, field: ue.UplaneReport.ra_rx, op: greater_or_equal, expected: 1 }
          - { type: check, field: ue.UplaneReport.ipv6_addr_iid, op: equals, expected: "{{ue.Params.pdu_accept_pdu_address_ipv6_iid}}" }
          # ---- UDP over IPv6 through the UPF and back. ----
          - { type: check, field: ue.UplaneReport.pkt_tx6, op: greater_than, expected: 0 }
          - { type: check, field: ue.UplaneReport.pkt_rx6, op: greater_than, expected: 0 }
          - { type: check, field: ue.UplaneReport.pkt_tx4, op: equals, expected: 0 }
      - event:
          or:
            - NASDownlinkTransport.PDUSessionEstablishmentReject
            - NASDownlinkTransport.DLNASTransport.PDUSessionEstablishmentReject
        target: failed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `user_plane_verified`
    metric: final_state_counts.user_plane_verified
    op: equals
    value: 1
  - name: the run asserted the address and the UDP echo
    metric: checks_total
    op: greater_or_equal
    value: 12
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
