# Reject an AMF-initiated UEContextModificationRequest with a Failure
# (3GPP TS 38.413 §8.3.4.4 / §9.2.2.7).
#
# Under test: after registration the gNB waits for an AMF-initiated
# UEContextModificationRequest and rejects it with UEContextModificationFailure
# (Cause radioNetwork), modelling a RAN that cannot apply the modification.
#
# TRIGGER DEPENDENCY: same as ue_context_modification_request_rx_handle_and_respond
# — AMF-initiated, not emitted by a bare Open5GS lab, so NOT in a suite; reaches
# `not_triggered` when no request arrives. Success: `modification_rejected` or
# `not_triggered`; `failed` only on transport error.

kind: flow
name: ue_context_modification_failure_rx_reject
description: Wait for AMF UEContextModificationRequest and reply UEContextModificationFailure (YAML)
detail: |
  Registers, then on an AMF-initiated UEContextModificationRequest replies with
  UEContextModificationFailure (Cause radioNetwork) instead of a Response
  (3GPP TS 38.413 §8.3.4.4). AMF-initiated and not produced by a bare Open5GS
  lab, so the flow reaches `not_triggered` on timeout and is for standalone use.
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - modification_rejected
  - not_triggered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_modification_request
        actions:
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

  wait_modification_request:
    on_timeout:
      duration: 20s
      target: not_triggered
    transitions:
      - event: UEContextModificationRequest
        target: modification_rejected
        actions:
          - type: send
            message: UEContextModificationFailure

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM (xp-341): REG-254 — if the AMF sent a UE CONTEXT MODIFICATION
# REQUEST, then after UEContextModificationFailure is sent the NG-connection stays up.
# The harness cannot induce that request; `not_triggered` is the not-applicable outcome
# and is not a failure. Both terminals are pinned via or_metric.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `modification_rejected` or `not_triggered`
    metric: final_state_counts.modification_rejected
    op: equals
    value: 1
    or_metric: final_state_counts.not_triggered
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 3
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
