# AMF-initiated Generic UE Configuration Update (3GPP TS 24.501 §5.4.4).
#
# After a normal registration the AMF MAY send a NAS ConfigurationUpdateCommand
# (carried in an NGAP NASDownlinkTransport) to reallocate the 5G-GUTI, update the
# allowed/configured NSSAI, TAI list, or other UE configuration. When the command
# requests an acknowledgement, the UE replies with ConfigurationUpdateComplete.
#
# THIS FLOW IS REG-190'S, AND REG-190 CLAIMS THE COMMAND: it passes only on
# `complete` (see final_checks). The procedure itself is optional after an initial
# registration — TS 24.501 §5.4.4.1 mandates a GUTI reallocation by it only after a
# paging-triggered service request, and §5.5.1.2.4 lets the AMF hand the new 5G-GUTI
# out in REGISTRATION ACCEPT instead — so an AMF that ends here in `no_update` has not
# misbehaved, but it has not done what REG-190 is about either, and this flow scores
# that red.
#
# This header used to say a timeout was "a valid, successful outcome" while the
# final_checks pinned `complete`, so the flow contradicted itself. The compliance
# suite's view, where either outcome IS a pass, is its own flow:
# configuration_update_optional, which is what gnb-compliance runs. Reporting
# `no_update` here as `unsupported` (as ue_context_suspend does for its refusal)
# would be the honest REG-190 answer, but it needs a registration probe so the
# terminal is message-reached, plus a matching entry in Runik's corpus table
# (runik/engine/verdict_unsupported_test.go in dflux-io/d3x), so it is left for a
# change that lands in both repos together.

kind: flow
name: configuration_update
description: Registration + AMF-initiated Generic UE Configuration Update (YAML)
detail: |
  Performs UE registration, then handles an AMF-initiated Generic UE
  Configuration Update procedure (3GPP TS 24.501 §5.4.4). The AMF uses this
  procedure to reallocate the 5G-GUTI or update NSSAI / TAI list configuration on
  the UE.

  After registration completes, the flow waits for a NAS
  ConfigurationUpdateCommand inside an NGAP NASDownlinkTransport. On receipt it
  replies with ConfigurationUpdateComplete and reaches the `complete` terminal.

  The procedure is OPTIONAL after an initial registration, so an AMF that sends
  no command is spec-compliant. This flow, though, carries REG-190's claim that
  the 5G-GUTI is reallocated by the command, so it passes only on `complete`;
  the wait state's on_timeout reaches `no_update`, which fails the row. The
  either-outcome view is configuration_update_optional.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - complete
  - no_update
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_config_update
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

  wait_config_update:
    # Optional procedure, but REG-190 claims it: no command within the window ends in
    # `no_update`, which this flow's final_checks score as a fail.
    on_timeout:
      duration: 10s
      target: no_update
    transitions:
      - event: NASDownlinkTransport.ConfigurationUpdateCommand
        target: complete
        actions:
          - type: send
            message: ConfigurationUpdateComplete

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — Runik is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-190 (positive, expected_terminal: complete) — A
# ConfigurationUpdateCommand is received; after ConfigurationUpdateComplete is sent no
# retransmission arrives, and a subsequent registration update using the NEW 5G-GUTI is
# accepted
#
# REG-190's first clause — "A ConfigurationUpdateCommand is received" — is the only half
# this FSM observes, and it is the only route into `complete`; `no_update` is the bare
# 10 s timer, i.e. the AMF never reallocated. NOT ASSERTED, AND WHY: the criterion's
# other two clauses ("after ConfigurationUpdateComplete is sent no retransmission
# arrives, and a subsequent registration update using the NEW 5G-GUTI is accepted") are
# unobservable here — the flow terminates on the first command, so nothing after it is
# counted.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `complete` — the terminal this row claims
    metric: final_state_counts.complete
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 4
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
