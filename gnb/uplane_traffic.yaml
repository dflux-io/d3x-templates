# Registration + PDU session + user-plane GTP-U traffic.
#
# YAML mirror of the built-in `uplane_traffic` flow defined in
# runner/flows/gnb/flow_uplane_traffic.go. Composes registrationStates +
# pduSessionStates(uplane_running, uplane_start) + uplaneStates.

kind: flow
name: uplane_traffic
description: Registration + PDU session + user-plane GTP-U traffic generation (YAML)
detail: |
  Performs registration, PDU session establishment, then generates user-plane
  GTP-U traffic through the established tunnel.

  After registration and PDU session setup (which allocates UPF GTP-U tunnel
  endpoints and a UE IP address), the flow starts a non-blocking traffic
  generator. The generator encapsulates ICMP or UDP packets inside GTP-U headers
  using the allocated TEIDs and sends them through the N3 interface to the UPF.

  The traffic phase runs for a configurable duration. When the duration expires,
  the executor reports metrics via an internal UplaneComplete event.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say so
            # (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1 connection
            # as soon as registration completes, and free5GC does.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: uplane_running
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: check
            field: ue.PduAddress
            op: not_empty
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          - type: uplane_start

  uplane_running:
    on_timeout:
      duration: 120s
      target: failed
    transitions:
      - event: UplaneComplete
        target: completed
        actions:
          # REG-900 (uplink traverses the N3 tunnel and reaches N6) and REG-901
          # (downlink is delivered on the DL TEID we signalled).
          #
          # PKT_RX IS THE ONLY REAL GATE HERE. Read that before adding another.
          #
          # `ue.UplaneReport not_empty` — the only user-plane check this flow
          # originally made — asserted that a report OBJECT existed, not that a
          # single packet moved. Measured 2026-08-10: tinycore passed it with
          # pkt_tx=3, pkt_rx=0, because its UPF ran `-datapath stub` and had
          # no user plane at all. The row that exists to prove the user plane
          # worked scored green against a core with none.
          #
          # `pkt_tx > 0` was then added as "REG-900's half", and that claim was
          # WRONG in the same way. UspaceExecutor.startWriter
          # (runner/runner/uplane_uspace.go) increments cumPktTx immediately
          # after WriteToGTP on an UNCONNECTED UDP socket: it counts "we called
          # send", not "a G-PDU crossed N3". Nothing on the far end has to
          # exist. It therefore passed against the stub too, and would pass
          # against no UPF at all. It is kept below ONLY as a liveness check on
          # our own generator — pkt_tx == 0 means the executor never ran, which
          # is a harness fault and not a core verdict — and it can never carry
          # a row on its own because pkt_rx sits beside it.
          #
          # pkt_rx > 0 is the assertion that cannot be faked from this side:
          # the reader increments PktRx only when an inbound G-PDU's TEID
          # matches the localTeid this runner put in the DL GTP Tunnel IE of
          # its setup response, on a socket bound to the gNB N3 address. A
          # non-zero pkt_rx IS "the packet reached N6, something answered, and
          # the core delivered the answer on the DL TEID and address we
          # signalled" — i.e. REG-900 and REG-901 both, end to end.
          - type: check
            field: ue.UplaneReport
            op: not_empty
          # Liveness of OUR generator only. Proves the executor sent; proves
          # NOTHING about the core. See the note above before ever citing it.
          - type: check
            field: ue.UplaneReport.pkt_tx
            op: greater_than
            expected: 0
          # The gate.
          - type: check
            field: ue.UplaneReport.pkt_rx
            op: greater_than
            expected: 0

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-900, REG-901, REG-970, REG-972).
#
# REG-900 — After PDU session establishment, ICMP echo requests encapsulated in GTP-U on
# the UPF-signalled TEID produce ICMP echo replies observed on n3 on the gNB's own DL
# TEID; the runner's UplaneReport shows pkt_rx > 0
#
# REG-901 — Downlink G-PDUs arrive on n3 at the gNB address and UDP port 2152, with the
# GTP-U TEID field equal to the DL TEID the runner put in
# PDUSessionResourceSetupResponse
#
# REG-970 — NUMBER — sustained uplink and downlink bits/s and packets/s at a stated loss
# rate over a stated duration, from the runner's UplaneReport
#
# REG-972 — NUMBER — loss rate and min/avg/max/jitter RTT from the runner's
# UplaneReport, held within a stated band over a stated soak duration
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: four NAS UPLINK TRANSPORT messages went out (AuthResponse, PDUSessionEstablishmentRequest, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 4
  - name: one PDU SESSION RESOURCE SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_PDU_SESSION_RESOURCE_SETUP_RESPONSE
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a PDU SESSION RESOURCE SETUP REQUEST arrived
    metric: rx_events.PDUSessionResourceSetupRequest
    op: greater_or_equal
    value: 1
  # The ten `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all ten declared checks ran
    metric: checks_total
    op: equals
    value: 10
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
