# REG-562 — the next-hop chain has to keep moving, hop after hop.
#
# TS 33.501 §6.9.2.3.2: "Upon reception of the NGAP PATH SWITCH REQUEST, the
# AMF shall increase its locally kept NCC value by one and compute a new fresh
# NH from its stored data using the function defined in Annex A.10." One
# increment is easy to get right by accident — a constant, a value copied from
# the initial context — and TS 33.501 §6.9.2.1.1 fixes what the sequence must
# be: NCC 0 for the initial KgNB, 1 for the first derived NH, and one more per
# hop. So this row does it TWICE and compares the two acknowledgements against
# each other rather than against a constant.
#
# BOTH HALVES MATTER. An AMF that increments the counter while re-sending the
# same NH has advanced nothing: NH is the key material, NCC is only the label
# that says which one it is. Equally, a fresh NH under a repeated NCC leaves
# the gNB unable to tell the two apart. The row asserts NCC == 2 (one more than
# the first switch's 1) AND that the NH octets differ from the first
# acknowledgement's, captured with `extract` at the time.
#
# THE SECOND SWITCH MOVES BACK. After the first path switch the AMF has the UE
# on the first target's leg; the second `xn_move` picks a peer that is not the
# current one, which in a two-gNB lab is the node the UE started on. That is a
# real second Xn hop as far as the 5GC is concerned — the request arrives on an
# association that is not the UE's current leg, which is the condition a path
# switch is defined by (TS 38.413 §8.4.4).
#
# NEEDS TWO gNBs (register preconditions.gnbs: 2).

kind: flow
name: xn_path_switch_two_switches_ncc_increases
description: Two successive Xn path switches; assert the second acknowledge's NCC is one greater than the first's and the NH octets differ
detail: |
  Registration, one PDU session, then two Xn path switches: the UE's RAN leg
  is moved to the peer gNB and a PATH SWITCH REQUEST is sent from there; the
  first PATH SWITCH REQUEST ACKNOWLEDGE's {NH, NCC} are captured; the leg is
  then moved back and a second request sent.

  Asserts the first acknowledge carries NCC 1, and the second carries NCC 2
  with Next Hop octets that differ from the first's.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - ncc_chain_advanced
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say
            # so (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1
            # connection as soon as registration completes.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_first_ack
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: check
            field: ue.PduAddress
            op: not_empty
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          - type: send
            message: PathSwitchRequest
            params:
              xn_move: true

  wait_first_ack:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PathSwitchRequestAcknowledge
        target: wait_second_ack
        actions:
          - type: check
            field: security_context
            op: ie_present
          - type: check
            field: security_context.next_hop_chaining_count
            op: equals
            expected: 1
          - type: check
            field: security_context.next_hop_nh
            op: not_empty
          # Captured from THIS acknowledge, so the comparison below is against
          # what the AMF actually sent rather than against a value re-derived
          # from an assumption.
          - type: extract
            field: security_context.next_hop_nh
            store: first_nh
          - type: send
            message: PathSwitchRequest
            params:
              xn_move: true
      - event: PathSwitchRequestFailure
        target: failed
      - event: ErrorIndication
        target: failed

  wait_second_ack:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PathSwitchRequestAcknowledge
        target: ncc_chain_advanced
        actions:
          - type: check
            field: ue.RxGnb
            op: equals
            expected: "{{ue.Params.xn_target_gnb}}"
          # --- TS 33.501 §6.9.2.3.2, the row's criterion ---
          - type: check
            field: security_context
            op: ie_present
          - type: check
            field: security_context.next_hop_chaining_count
            op: equals
            expected: 2
          # `not_equals` rather than `not_contains`: one base64 NH being a
          # substring of another would make a containment test lie, and a path
          # that does not resolve fails not_equals outright instead of passing
          # as "different from nothing".
          - type: check
            field: security_context.next_hop_nh
            op: not_equals
            expected: "{{ue.Params.first_nh}}"
      - event: PathSwitchRequestFailure
        target: failed
      - event: ErrorIndication
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-562).
#
# REG-562 — The NCC in the second PathSwitchRequestAcknowledge is exactly one greater
# than the NCC in the first, and the NH octets differ between the two acknowledgements.
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `ncc_chain_advanced`
    metric: final_state_counts.ncc_chain_advanced
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: four NAS UPLINK TRANSPORT messages went out (AuthResponse, PDUSessionEstablishmentRequest, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 4
  - name: two PATH SWITCH REQUEST messages went out
    metric: msg_types.tx.ngap.NGAP_PATH_SWITCH_REQUEST
    op: equals
    value: 2
  - name: one PDU SESSION RESOURCE SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_PDU_SESSION_RESOURCE_SETUP_RESPONSE
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a PDU SESSION RESOURCE SETUP REQUEST arrived
    metric: rx_events.PDUSessionResourceSetupRequest
    op: greater_or_equal
    value: 1
  - name: two PATH SWITCH REQUEST ACKNOWLEDGE messages arrived
    metric: rx_events.PathSwitchRequestAcknowledge
    op: greater_or_equal
    value: 2
  # The 14 `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all 14 declared checks ran
    metric: checks_total
    op: equals
    value: 14
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
