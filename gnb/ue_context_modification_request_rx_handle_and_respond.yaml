# Handle an AMF-initiated UEContextModificationRequest and respond
# (3GPP TS 38.413 §8.3.4 / §9.2.2.5-6).
#
# Under test: after registration the gNB waits for an AMF-initiated
# UEContextModificationRequest (e.g. security key change, RRC-inactive
# assistance) and answers UEContextModificationResponse.
#
# TRIGGER DEPENDENCY: UE Context Modification is AMF-initiated. A bare Open5GS
# lab does not emit it spontaneously, so this flow is NOT in a suite — it reaches
# the informative `not_triggered` terminal when no request arrives. Run it
# standalone when a modification can be induced. Success: `modification_handled`
# or `not_triggered` (both non-failure); `failed` only on transport error.

kind: flow
name: ue_context_modification_request_rx_handle_and_respond
description: Wait for AMF UEContextModificationRequest and reply UEContextModificationResponse (YAML)
detail: |
  Registers, then waits for an AMF-initiated UEContextModificationRequest and
  replies with UEContextModificationResponse (3GPP TS 38.413 §8.3.4). Because the
  procedure is AMF-initiated and not emitted by a bare Open5GS lab, the flow
  reaches `not_triggered` on timeout (informative, not a failure) and is intended
  for standalone runs with an external trigger.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - modification_handled
  - not_triggered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_modification_request
        actions:
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

  wait_modification_request:
    on_timeout:
      duration: 20s
      target: not_triggered
    transitions:
      - event: UEContextModificationRequest
        target: modification_handled
        actions:
          - type: send
            message: UEContextModificationResponse

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM (xp-341): REG-253 — if the AMF initiates a UE context
# modification, UEContextModificationRequest is received on N2 and answered. The
# harness cannot induce that request; `not_triggered` is the not-applicable
# outcome and is not a failure. Both terminals are pinned via or_metric.
#
# REG-484 (positive, expected_terminal: modification_handled) — A UE CONTEXT
# MODIFICATION REQUEST containing a Security Key IE different from the one delivered at
# initial context setup is received on N2 and is acknowledged with UE CONTEXT
# MODIFICATION RESPONSE. That row is not must_run and still wants the triggered path.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `modification_handled` or `not_triggered`
    metric: final_state_counts.modification_handled
    op: equals
    value: 1
    or_metric: final_state_counts.not_triggered
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 3
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
