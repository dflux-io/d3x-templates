# UEContextResumeRequest for a UE that was never suspended
# (3GPP TS 38.413 §8.3.6 / §10 abnormal: resume of non-suspended context).
#
# Abnormal input under test: after a normal registration (UE in RRC_CONNECTED,
# never moved to RRC_INACTIVE) the gNB sends a UEContextResumeRequest. There is
# no suspended context to resume, so a correct AMF must NOT resume; it should
# reply UEContextResumeFailure (or an ErrorIndication) and keep state consistent.
#
# This differs from the happy-path `ue_context_resume` flow, which always
# performs the suspend sub-step first.
#
# Verdicts: a UEContextResumeResponse would mean the AMF wrongly resumed a
# non-suspended UE -> `failed`. A UEContextResumeFailure or ErrorIndication is
# the correct rejection -> `rejected`. Per the documented Open5GS suspend/resume
# gap (it logs "Not implemented(proc:57)") the SUT may instead drop silently, so
# a timeout is treated leniently as `rejected` (it did not wrongly resume).

kind: flow
name: ue_context_resume_request_without_prior_suspend
description: Resume a UE that was never suspended; assert AMF rejects (or does not wrongly resume) (YAML)
detail: |
  Performs registration, then sends a UEContextResumeRequest WITHOUT any
  preceding UEContextSuspendRequest (3GPP TS 38.413 §8.3.6 / §10). Correct AMF
  behaviour is to reject with UEContextResumeFailure or ErrorIndication rather
  than resume a context that was never suspended. A UEContextResumeResponse is
  treated as a non-compliant wrong-resume (`failed`); failure/error/timeout land
  on `rejected` (lenient, accommodating the known Open5GS suspend/resume gap).
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_resume_reaction
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          # Resume request with NO preceding suspend.
          - type: send
            message: UEContextResumeRequest

  wait_resume_reaction:
    # Open5GS may not implement resume -> silent drop; treat as correct rejection.
    on_timeout:
      duration: 10s
      target: rejected
    transitions:
      - event: UEContextResumeFailure
        target: rejected
      - event: ErrorIndication
        target: rejected
      # Wrongly resuming a never-suspended UE is non-compliant.
      - event: UEContextResumeResponse
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-265).
#
# REG-265 — UEContextResumeFailure or an ErrorIndication is received on N2, the NG
# association stays up, and a subsequent well-formed procedure succeeds
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  # THE TERMINAL. One route to `rejected` is a timer (the absence window), so the
  # message assertions below are what separate "reached it" from "waited it out".
  - name: the flow reached `rejected`
    metric: final_state_counts.rejected
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  - name: one UE CONTEXT RESUME REQUEST was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RESUME_REQUEST
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  # The four `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all four declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
