# Xn PathSwitchRequest negative — unknown PDU session id (3GPP TS 38.413 §8.4.4 / §10).
# Registers + establishes a PDU session, then sends a PathSwitchRequest with a
# bogus field. Open5GS does not perform real Xn path switch and replies
# ErrorIndication; the assertion is a graceful reaction with no crash.
#
# THE REQUEST GOES OUT ON THE UE'S OWN ASSOCIATION, NOT A TARGET'S, AND THAT
# WEAKENS THIS ROW. A real Xn path switch is sent by the TARGET NG-RAN node after
# the UE has moved to it (TS 38.413 §8.4.4, TS 23.502 §4.9.1.2). Six sibling
# templates carry `xn_move: true` on the send for exactly that reason, and
# path_switch.yaml was fixed to as well. This one cannot: REG-567 declares
# `preconditions.gnbs: 1`, so there is no peer gNB to move to and the send would
# fail outright rather than measuring anything.
#
# WHAT THAT COSTS. A conformant AMF refuses a request to switch a path to where
# the UE already is, so `handled` can be reached by that refusal alone — with the
# bogus PDU Session ID never examined. The terminal is therefore NOT evidence
# about §10.4 handling of an unknown session id; it is evidence that the AMF
# answered. Closing it needs the register row promoted to `gnbs: 2` and the send
# given `xn_move: true`, which is a register change and not this template's to
# make. Recorded rather than pinned, because pinning a terminal whose meaning is
# ambiguous is how a harness defect gets published as a core finding.
kind: flow
name: xn_path_switch_unknown_pdu_session
description: PathSwitchRequest (unknown PDU session id); assert graceful AMF reaction (YAML)
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states: [handled, switched, tolerated, failed]
states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions: [{ type: send, message: InitialUEMessage, params: { follow_on_request: true } }]  # FOR bit: uplink NAS pending (TS 24.501 §9.11.3.7)
  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: extract, field: amf_ue_ngap_id, store: pilot_amf_id }
          - { type: send, message: AuthResponse }
  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          - { type: send, message: PDUSessionEstablishmentRequest }
  wait_pdu_session_accept:
    on_timeout: { duration: 15s, target: failed }
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_ps_reaction
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - { type: check, field: ue.PduSessionId, op: greater_than, expected: 0 }
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              { "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}" }
          - type: send
            message: PathSwitchRequest
            message_body: |
              { "pdu_session_switched_list": [ { "pdu_session_id": 99 } ] }
  wait_ps_reaction:
    on_timeout: { duration: 10s, target: tolerated }
    transitions:
      - { event: ErrorIndication, target: handled }
      - { event: PathSwitchRequestFailure, target: handled }
      - { event: PathSwitchRequestAcknowledge, target: switched }
any_state_transitions:
  - { event: Error, target: failed }

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-567 (abnormal, expected_terminal: null) —
# PathSwitchRequestFailure or ErrorIndication is received; the UE's genuine PDU session
# is unaffected and still carries traffic afterwards.
#
# REG-567 declares `expected_terminal: null`; its criterion names the messages anyway:
# "PathSwitchRequestFailure or ErrorIndication is received". Both are `handled`.
# `switched` is the AMF switching a path for a PDU session it holds no SM context for;
# `tolerated` is the bare 10 s timer, and §10.4 makes this a logical error a class-1
# procedure must report.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `handled` — the terminal this row claims
    metric: final_state_counts.handled
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 3
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
