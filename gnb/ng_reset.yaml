# Registration + gNB-initiated NG Reset (3GPP TS 38.413 §8.7.4).
#
# YAML mirror of the built-in `ng_reset` flow defined in
# runner/flows/gnb/flow_ng_reset.go. Composed via the registrationStates
# helper (registration → bridge with NGReset send) + a single trailing
# wait_ng_reset_ack state.

kind: flow
name: ng_reset
description: Registration + gNB-initiated global NG Reset for error recovery (YAML)
detail: |
  Performs registration to establish a UE context, then initiates a gNB-initiated
  global NG Reset (3GPP TS 38.413 §8.7.4).

  The NG Reset procedure is the primary error recovery mechanism on the NG-C
  interface. When the gNB detects an inconsistency in UE context state with the
  AMF (e.g., after a gNB restart, SCTP association failure, or software error),
  it sends an NGReset to synchronize state. A global reset clears all UE contexts
  on the NG-C association.

  The AMF responds with NGResetAcknowledge confirming the reset was processed.
  After a global reset, all UE contexts on the association are released on both
  sides, and UE-associated signalling must be re-established.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - reset_complete
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_ng_reset_ack
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: NGReset

  wait_ng_reset_ack:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NGResetAcknowledge
        target: reset_complete

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-840).
#
# REG-840 — NGResetAcknowledge received on N2 after a registered UE's association is
# globally reset
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `reset_complete`
    metric: final_state_counts.reset_complete
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  - name: one NG RESET was sent
    metric: msg_types.tx.ngap.NGAP_NG_RESET
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: an NG RESET ACKNOWLEDGE arrived
    metric: rx_events.NGResetAcknowledge
    op: greater_or_equal
    value: 1
  # The four `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all four declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
