# REG-566 — the duplicate-ID abnormal condition.
#
# TS 38.413 §8.4.4.4: "If the AMF receives a PATH SWITCH REQUEST message
# containing several PDU Session ID IEs (in the PDU Session Resource to be
# Switched in Downlink List IE) set to the same value, the AMF shall send the
# PATH SWITCH REQUEST FAILURE message to the NG-RAN node." It is unconditional:
# not "may", and not "if the second one fails".
#
# THE VIOLATION IS ON THE WIRE. The request carries the PDU Session Resource to
# be Switched in Downlink List with TWO items whose PDU Session ID is the same
# value — the session this UE established — each with a valid Path Switch
# Request Transfer. Everything else about the message is well-formed and would
# be accepted on its own; the duplicate is the only difference from the
# acknowledged case, which is what makes the row a test of §8.4.4.4 rather than
# of decoding. Drop `duplicate_session` and the same flow is acknowledged —
# the control that proves it.
#
# THE REQUEST LEAVES ON THE TARGET ASSOCIATION, AND THAT IS THE WHOLE POINT.
# An Xn path switch is by definition sent by the TARGET NG-RAN node after the
# UE has already moved to it over the air (TS 38.413 §8.4.4, TS 23.502
# §4.9.1.2) — the 5GC hears nothing until the request arrives on the target's
# own association. The predecessor of these rows sent PATH SWITCH REQUEST on
# the association the UE was already on; a conformant AMF answers that by
# refusing to switch a path to where the UE already is, and the refusal was
# scored as core behaviour when it was the harness's. So the send carries
# `xn_move: true`, which relocates the UE's RAN leg to the peer gNB with NO
# NG-C signalling at all (a fresh RAN-UE-NGAP-ID allocated there, the
# AMF-UE-NGAP-ID untouched because it is the identity that spans both legs) —
# which is exactly what an Xn handover looks like from the core's side.
#
# NEEDS TWO gNBs (register preconditions.gnbs: 2). With one, there is no peer
# to move to and the send fails outright rather than measuring anything.

kind: flow
name: xn_path_switch_duplicate_pdu_session_id
description: Xn path switch carrying the same PDU Session ID twice; assert PATH SWITCH REQUEST FAILURE rather than an acknowledgement or a partial switch
detail: |
  Registration, one PDU session, then an Xn path switch sent from the peer gNB
  the UE moved to, whose switched list names the same PDU Session ID twice.

  Asserts the AMF answers PATH SWITCH REQUEST FAILURE. An acknowledgement is a
  distinct terminal (`switched_anyway`) so the verdict says which of the two
  §8.4.4.4 outcomes the core chose, and a timeout is a failure — silence is not
  a permitted answer to this abnormal condition.
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - path_switch_duplicate_rejected
  - switched_anyway
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say
            # so (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1
            # connection as soon as registration completes.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_path_switch_response
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: check
            field: ue.PduAddress
            op: not_empty
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          - type: send
            message: PathSwitchRequest
            params:
              xn_move: true
              duplicate_session: true

  wait_path_switch_response:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      # --- TS 38.413 §8.4.4.4, the row's criterion ---
      - event: PathSwitchRequestFailure
        target: path_switch_duplicate_rejected
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: equals
            expected: "{{ue.Params.pilot_amf_id}}"
          - type: check
            field: ue.RxGnb
            op: equals
            expected: "{{ue.Params.xn_target_gnb}}"
      # The AMF acknowledged a request §8.4.4.4 says it shall refuse. Its own
      # terminal: this is the finding, not an absence of one.
      - event: PathSwitchRequestAcknowledge
        target: switched_anyway
      - event: ErrorIndication
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-566 (negative, expected_terminal:
# path_switch_duplicate_rejected) — PathSwitchRequestFailure is received on the target
# association after a PathSwitchRequest carrying the same PDU Session ID twice; no
# acknowledgement and no partial switch occurs.
#
# REG-566: TS 38.413 §8.4.4.4 states it without an alternative — a PATH SWITCH REQUEST
# carrying the same PDU Session ID twice "shall" draw PATH SWITCH REQUEST FAILURE.
# `switched_anyway` is the acknowledgement arriving instead, which is the finding.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `path_switch_duplicate_rejected` — the terminal this row claims
    metric: final_state_counts.path_switch_duplicate_rejected
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 9
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
