# Secured/abnormal NAS probe — Replay a secured uplink NAS at a stale (rewound) NAS COUNT (3GPP TS 33.501 / TS 24.501 abnormal cases).
#
# ---------------------------------------------------------------------------
# READ THIS FIRST: THIS FLOW DOES NOT TEST THE ROW THAT NAMES IT.
# ---------------------------------------------------------------------------
# matrix/register/procedures.yaml REG-445 is `kind: positive`, named "RINMR — an
# initial REGISTRATION REQUEST failing the integrity check is re-authenticated
# and its full text requested in SECURITY MODE COMPLETE", and requires the
# sendables InitialUEMessageGuti + SecurityModeComplete-with-container. Its
# assertion is that the SECURITY MODE COMMAND carries the Additional 5G security
# information IE with the RINMR bit set (TS 24.501 §5.4.2.2, §9.11.3.12).
#
# This file, as inherited, was a byte-for-byte copy of smc_replay_stale_count:
# it registers cleanly and replays one uplink NAS at a rewound COUNT. It never
# sends a REGISTRATION REQUEST the AMF cannot verify, never looks at RINMR, and
# cannot pass or fail REG-445's criterion. Rewriting it into the RINMR
# procedure means new sendables and a success terminal, which contradicts the
# register's own `expected_terminal: rejected` for the row — a register change,
# and the register is not this change's to make. Flagged for the owner of
# matrix/register. What is fixed below is only the part that was reporting
# falsely about what it DOES probe.
# ---------------------------------------------------------------------------
#
# SILENCE IS THE CORE'S ANSWER, NOT ITS ABSENCE (xp-245 negative-probe audit).
#
# The replay it does perform is genuine. After SECURITY MODE COMPLETE at COUNT 0
# and REGISTRATION COMPLETE at COUNT 1, the replay goes out as
#
#     7e 02 04 fe 23 ff 00 | ad e0 c5
#     ^EPD ^hdr ^MAC       ^SN = 0, a COUNT this context has already spent
#
# and tinycore answered `nas: MAC mismatch: received 04fe23ff, expected
# 267d3b89` — it verifies against the COUNT it still expects, per TS 24.501
# §4.4.3.2 and TS 33.501 §6.4.3.2 — and discarded the message. A discard emits
# nothing, the flow had no transition for nothing, so it timed out into
# `tolerated`: correct replay protection recorded as absent.
#
# WHY SILENCE ALONE IS NOT ENOUGH HERE, AND WHAT IS.
# A replayed REGISTRATION COMPLETE draws no downlink whether it is discarded or
# swallowed, so inverting the timer on its own would leave a row that cannot
# fail. The discriminator is the NAS COUNT itself. An AMF that DISCARDED the
# replay still expects COUNT 2; an AMF that ACCEPTED it has moved its expected
# uplink COUNT back to 1. So the window is followed by a legitimate, correctly
# counted DEREGISTRATION REQUEST at COUNT 2:
#
#   DEREGISTRATION ACCEPT comes back  -> the AMF's COUNT was never moved -> rejected
#   nothing comes back                -> the replay poisoned it          -> tolerated
#
# (This needed EnrichSecuredUplinkStaleCount to restore the UE's own COUNT after
# the rewind; before that fix the follow-up was unsendable — see that enricher.)
kind: flow
name: registration_replay_old_security_context
description: Replay a secured uplink NAS at a stale (rewound) NAS COUNT (YAML)
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states: [rejected, tolerated, failed]
states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions: [{ type: send, message: InitialUEMessage, params: { follow_on_request: true } }]  # FOR bit: uplink NAS pending (TS 24.501 §9.11.3.7)
  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }
  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_reaction
        actions:
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          - type: send
            message: SecuredUplinkStaleCount
            params: { force_uplink_count: 0 }
  wait_reaction:
    # The §4.4.3.2 absence window (register absent_after_s: 6). Nothing is
    # expected; what the window buys is the chance for something to arrive
    # before the COUNT-integrity probe muddies the trace.
    on_timeout:
      duration: 6s
      target: prove_count_intact
      actions: [{ type: send, message: DeregistrationRequest }]
    transitions:
      - { event: NASDownlinkTransport.AuthenticationReject, target: rejected }
      - { event: NASDownlinkTransport.SecurityModeReject, target: rejected }
      - { event: NASDownlinkTransport.RegistrationReject, target: rejected }
      - { event: NASDownlinkTransport.5GMMStatus, target: rejected }
      - { event: NASDownlinkTransport.AuthenticationRequest, target: rejected }
      - { event: UEContextReleaseCommand, target: rejected }
      - { event: ErrorIndication, target: rejected }
  prove_count_intact:
    # No answer to a message the AMF *can* verify: its uplink COUNT moved
    # backwards with the replay, so the replay was accepted.
    on_timeout: { duration: 10s, target: tolerated }
    transitions:
      - event:
          or:
            - NASDownlinkTransport.DeregistrationAccept
            - UEContextReleaseCommand
        target: rejected
      - { event: NASDownlinkTransport.RegistrationReject, target: rejected }
      - { event: NASDownlinkTransport.5GMMStatus, target: rejected }
      - { event: ErrorIndication, target: rejected }
any_state_transitions:
  - { event: Error, target: failed }

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-445 (positive, expected_terminal: rejected) —
# After a REGISTRATION REQUEST protected with a security context the AMF cannot verify,
# an AUTHENTICATION REQUEST arrives, then a SECURITY MODE COMMAND containing the
# Additional 5G security information IE with the RINMR bit set; sending the full
# REGISTRATION REQUEST in the NAS message container then yields a REGISTRATION ACCEPT.
#
# THE REGISTER ROW AND THIS FLOW ARE ABOUT DIFFERENT THINGS, and the file says so at the
# top: REG-445 is the RINMR procedure (a REGISTRATION REQUEST that fails its integrity
# check is re-authenticated and its full text requested in SECURITY MODE COMPLETE) and
# this flow replays a secured uplink at a rewound NAS COUNT. Its criterion — an
# AUTHENTICATION REQUEST, then a SECURITY MODE COMMAND carrying the RINMR bit, then an
# accept — cannot be satisfied or refuted by anything this FSM sends, so it is NOT what
# is pinned here. What is pinned is the claim the flow does make, on the terminal the
# register also names: the replay at a spent COUNT is refused, and the context is proved
# intact by a correctly counted DEREGISTRATION REQUEST still drawing its ACCEPT
# (prove_count_intact -> `rejected`). `tolerated` is that follow-up going unanswered,
# i.e. the AMF's COUNT moved backwards with the replay.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `rejected` — the terminal this row claims
    metric: final_state_counts.rejected
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 2
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
