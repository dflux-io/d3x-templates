# CM-IDLE → CM-CONNECTED: a SERVICE REQUEST re-establishes the N1 NAS signalling
# connection after AN Release (REG-202).
#
# Clauses, operative sentences (retrieved with matrix/scripts/spec-clause.py):
#
#   TS 23.501 §5.3.3.2.2 "A UE in CM-IDLE state has no NAS signalling connection established with
#                        the AMF over N1. ... There are no AN signalling connection, N2 connection
#                        and N3 connections for the UE in the CM-IDLE state."
#                        "The transmission of an Initial NAS message (Registration Request,
#                        Service Request or Deregistration Request) initiates the transition from
#                        CM-IDLE to CM-CONNECTED state."
#                        "The AMF shall enter CM-CONNECTED state for the UE whenever an N2
#                        connection is established for this UE between the AN and the AMF. The
#                        reception of initial N2 message (e.g. N2 INITIAL UE MESSAGE) initiates
#                        the transition of AMF from CM-IDLE to CM-CONNECTED."
#
#   TS 23.501 §5.3.3.3.2 "When the UE in CM-IDLE state needs to transmit an NAS message, the UE
#                        shall initiate a Service Request, a Registration or a Deregistration
#                        procedure to establish a NAS signalling connection to the AMF."
#
#   TS 23.502 §4.2.6     AN Release — "This procedure is used to release the logical NG-AP
#                        signalling connection for the UE between the (R)AN and the AMF and the
#                        associated N3 User Plane connections ..."
#
#   TS 24.501 §5.6.1.4.1 "the UE shall treat the reception of the SERVICE ACCEPT message as
#                        successful completion of the procedure."
#
# Phase 1 registration → Phase 2 AN Release (gNB-initiated) → Phase 3 a FRESH INITIAL UE MESSAGE
# carrying a SERVICE REQUEST on a NEWLY ALLOCATED RAN UE NGAP ID.
#
# WHAT WAS ADDED (xp-245). The flow already ended in `failed` on timeout, so it had no
# timeout-to-success path to remove. What it had no assertion for at all was the row's actual
# claim — that the answer arrives on a NEW UE-associated logical NG-connection. That is now
# asserted as VALUES:
#   - `ran_ue_ngap_id` on the AMF's answer equals ue.RanUeNgapId, the id ngap_realloc allocated
#     for the new connection (ue.NGAP.RanUeNgapId is written only at UE creation and by
#     ngap_realloc, never by the RX path, so this compares the received IE against something we
#     set — it is not a field compared with itself);
#   - and is strictly GREATER than pre_release_ran_ue_ngap_id, the id extracted before the AN
#     Release. GnbContext.AllocateUE is a monotonic counter, so "greater" is exactly "not the
#     pre-release connection". This is deliberately an assertion about OUR identifier, not the
#     AMF's: the register's own verification note records that requiring a fresh AMF UE NGAP ID
#     would be unsupported — TS 38.413 §10.6 only NOTEs that nodes "should ensure as far as
#     possible that previously allocated AP ID are not immediately reused".
#
# The two ACCEPT CARRIERS are split into separate transitions rather than one `or`, because they
# need different answers and different assertions (see below). The bare `InitialContextSetupRequest`
# alternative is retained for REG-202 — its pass_criterion explicitly allows
# "InitialContextSetupRequest or SERVICE ACCEPT" — and because
# runner/runner/flows_integration_test.go TestE2E_ServiceRequest_Dispatch dispatches exactly that
# bare event against this FSM.
#
# SERVICE TYPE — ENUM VALUE (svcTypeToWire does the -1 since 2026-08-10, xp-253).
# Historical note, kept because it explains the value: TS 24.501 Table 9.11.3.50.1 codes
# signalling as 0000; §5.6.1.2.1 case f) b) puts a UE with pending uplink signalling and no
# pending user data on "signalling". proto/nas5g's NAS_ServiceType enum is offset by one and
# nas_5gmm.go:encodeServiceRequest writes it to the wire RAW, so the enum name and the wire value
# disagree — see the long note in service_request_signalling.yaml. Before this change the flow
# sent no service_type at all, taking the enricher default SVC_TYPE_DATA=2, which reaches the wire
# as 0010 = "mobile terminated services": a service request claiming to answer a paging that was
# never sent. When encodeServiceRequest is fixed this must become 1.

kind: flow
name: service_request
description: Registration + AN Release + SERVICE REQUEST on a new UE-associated NG-connection (YAML)
detail: |
  Performs registration, transitions to CM-IDLE via gNB-initiated UE context
  release, then sends a Service Request to reconnect (3GPP TS 24.501 §5.6.1,
  TS 38.413 §8.3). This is the most common real-world UE wake-up path.

  Phase 1 — Registration: establishes the UE's security context and obtains a
  5G-GUTI (containing AMF Set ID, AMF Pointer, and 5G-TMSI) from the AMF via
  RegistrationAccept.

  Phase 2 — Go to CM-IDLE: the gNB sends UEContextReleaseRequest (cause: user
  inactivity) to release the NGAP UE context. The AMF responds with
  UEContextReleaseCommand, and the gNB confirms with UEContextReleaseComplete.
  The UE remains RM-REGISTERED on the AMF but transitions to CM-IDLE (no NGAP
  association). This differs from deregistration which removes the registration.

  Phase 3 — Service Request: allocates a new RAN-UE-NGAP-ID and sends a new
  InitialUEMessage carrying an integrity-protected NAS ServiceRequest with the
  UE's 5G-S-TMSI identity. The AMF uses the TMSI to locate the UE's stored
  context, then answers on the new UE-associated logical NG-connection.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - connected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          # The RAN UE NGAP ID of the connection that is about to be released.
          # Captured here because `d3x-run lint` refuses an extract that follows
          # a send, and every later state's first action is a send.
          - type: extract
            field: ue.RanUeNgapId
            store: pre_release_ran_ue_ngap_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_release_cmd
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: UEContextReleaseRequest

  wait_release_cmd:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: UEContextReleaseCommand
        target: wait_service_response
        actions:
          - type: send
            message: UEContextReleaseComplete
          # CM-IDLE reached. A new UE-associated logical NG-connection gets a new
          # RAN UE NGAP ID (TS 38.413 §8.6.1.2).
          - type: ngap_realloc
          - type: send
            message: ServiceRequest
            params:
              # ENUM SVC_TYPE_SIGNALLING=1 -> wire 0000 "signalling". See the header block.
              service_type: 1
      # Open5GS's GUTI reallocation. Absorbed, not answered: the AMF is already
      # releasing this connection and a CONFIGURATION UPDATE COMPLETE landing
      # after the release only earns an ERROR INDICATION for stale AP IDs.
      #
      # UNREVIEWED INTERACTION WITH ccd6864 (#362) — recorded 2026-08-18, NOT acted
      # on. The scoping is deliberate and it still holds where it is written: a
      # declared transition beats fsm.DispatchRx's tail default, so this state stays
      # silent. But the SAME command arriving in any OTHER state of this flow now
      # draws a CONFIGURATION UPDATE COMPLETE from that default — the very uplink
      # this line refuses to send here. Latent rather than live today: the default
      # is gated on the Configuration update indication ACK bit, and open5gs's
      # command carries no such IE at all (decoded off the v1 sweep). Whether the
      # silence should become flow-wide is an owner's call, not a template edit.
      - event: NASDownlinkTransport.ConfigurationUpdateCommand
        target: wait_release_cmd

  wait_service_response:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      # Carrier 1 — the AMF re-establishes the NGAP UE context and the SERVICE
      # ACCEPT rides the INITIAL CONTEXT SETUP REQUEST. tinycore answers this way.
      - event: InitialContextSetupRequest.ServiceAccept
        target: connected
        actions:
          - type: check
            field: nas.header.message_type
            op: equals
            expected: 78
          - type: check
            field: ran_ue_ngap_id
            op: equals
            expected: "{{ue.RanUeNgapId}}"
          - type: check
            field: ran_ue_ngap_id
            op: greater_than
            expected: "{{ue.Params.pre_release_ran_ue_ngap_id}}"
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
      # Carrier 1b — an INITIAL CONTEXT SETUP REQUEST with no NAS payload. Allowed
      # by REG-202's pass_criterion, and the event
      # TestE2E_ServiceRequest_Dispatch drives. No nas.* assertion is possible
      # here: there is no NAS PDU on this message, so ue.NGAP.LastNas would still
      # hold the PREVIOUS message's NAS and any nas.* check would silently be
      # about the wrong message.
      - event: InitialContextSetupRequest
        target: connected
        actions:
          - type: check
            field: ran_ue_ngap_id
            op: equals
            expected: "{{ue.RanUeNgapId}}"
          - type: check
            field: ran_ue_ngap_id
            op: greater_than
            expected: "{{ue.Params.pre_release_ran_ue_ngap_id}}"
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
      # Carrier 2 — nothing to set up, so the accept travels alone in a DOWNLINK
      # NAS TRANSPORT. Open5GS answers this way. No InitialContextSetupResponse:
      # there was no request to respond to, and answering one that never arrived
      # would be our own invention.
      - event: NASDownlinkTransport.ServiceAccept
        target: connected
        actions:
          - type: check
            field: nas.header.message_type
            op: equals
            expected: 78
          - type: check
            field: ran_ue_ngap_id
            op: equals
            expected: "{{ue.RanUeNgapId}}"
          - type: check
            field: ran_ue_ngap_id
            op: greater_than
            expected: "{{ue.Params.pre_release_ran_ue_ngap_id}}"
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
      # An AMF that refuses to re-admit a registered UE has failed this row.
      - event: NASDownlinkTransport.ServiceReject
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-202).
#
# REG-202 — After the previous UE-associated logical NG-connection was released, a fresh
# InitialUEMessage carrying a SERVICE REQUEST is answered on a newly established UE-
# associated logical NG-connection — InitialContextSetupRequest or SERVICE ACCEPT
# received — and the procedure completes
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `connected`
    metric: final_state_counts.connected
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: greater_or_equal
    value: 1
  - name: two INITIAL UE MESSAGE messages went out (InitialUEMessage, ServiceRequest)
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 2
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  # STAYS 1 — AND 1 IS NOT WHAT EVERY CORE PRODUCES. Read this before changing it.
  #
  # Since #364 the runner answers a UE CONTEXT RELEASE COMMAND that no state names
  # (TS 38.413 §8.3.3, unconditional), so this metric is now "the one Complete this
  # flow declares in wait_release_cmd" PLUS one per unnamed command the core chose
  # to send. That second term is a property of the CORE, not of this FSM.
  #
  # Measured, not inferred — three sweeps agree (5ee60cd 2026-08-13, 8a48fa1 and
  # f227f12-v1 2026-08-17), REG-202's own runner.json:
  #     tinycore  rx UEContextReleaseCommand 1 -> 1 Complete
  #     open5gs   rx UEContextReleaseCommand 1 -> 1 Complete
  #     free5gc   rx UEContextReleaseCommand 2 -> 2 Completes
  # free5gc issues a SECOND release command for the same context, and it lands in
  # wait_service_response, which names no transition for it. So this assertion now
  # reports red on free5gc, at actual 2.
  #
  # DO NOT "FIX" THAT BY WRITING 2. Two is free5gc's number; writing it would
  # redden tinycore and open5gs, which walk exactly the path declared above. 1 is
  # what this FSM declares and what the header of this block says these counts are.
  # The free5gc red cell is a real cross-core difference being reported, and a
  # range would delete that signal permanently.
  - name: one UE CONTEXT RELEASE COMPLETE was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RELEASE_COMPLETE
    op: equals
    value: 1
  - name: one UE CONTEXT RELEASE REQUEST was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RELEASE_REQUEST
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a UE CONTEXT RELEASE COMMAND arrived
    metric: rx_events.UEContextReleaseCommand
    op: greater_or_equal
    value: 1
  # Several routes reach `connected` with different numbers of checks
  # (7..8); 7 is the shortest one, so it is the floor that still proves
  # an assertion was made on the messages this run saw.
  - name: at least seven declared checks ran
    metric: checks_total
    op: greater_or_equal
    value: 7
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
