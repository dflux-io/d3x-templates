# REG-530 — the source context is released, and released ON THE SOURCE LEG.
#
# TS 38.413 §8.4.3.2: "The target NG-RAN node shall send the HANDOVER NOTIFY
# message to the AMF when the UE has been identified in the target cell and the
# NG-based handover has been successfully completed." TS 23.502 §4.9.1.3.3 is
# what happens next: the AMF completes the move and releases the resources on
# the SOURCE NG-RAN node with a UE Context Release Command. A core that leaves
# the source context standing leaks a UE association per handover; a core that
# releases it on the wrong leg has torn down the connection the UE is now on.
#
# THIS FLOW OWNS THE TARGET SIDE. Declaring a `HandoverRequest` transition
# suppresses the runner's fire-and-forget target auto-reply and hands the
# decoded HANDOVER REQUEST to this flow, which then answers as the target
# NG-RAN node — on the TARGET association (`peer:`), because that is who a
# HANDOVER REQUEST ACKNOWLEDGE / HANDOVER FAILURE is from (TS 38.413 §8.4.2).
# A reply on the source leg would arrive on the association the AMF already
# has the UE on, and a conformant AMF ignoring it would score as a defect.
#
# NEEDS TWO gNBs (register preconditions.gnbs: 2). With one gNB the HANDOVER
# REQUIRED names a target the AMF has never seen and the row measures "unknown
# target" instead of handover.
#
# WHY `keep_source_binding`. The handover swap normally unbinds the source
# RAN-UE-NGAP-ID the moment the UE moves, which is right for every flow that
# never looks at the source leg again — and fatal for this one: the release
# command arrives on the SOURCE association addressed to the SOURCE
# RAN-UE-NGAP-ID, so an unbound id means the demux drops it as `unknown_ue` and
# the row cannot see the very message it is about. The param keeps the mapping
# so the command routes; the reply goes back out on the source association
# (`peer:`) carrying the source id, because that is the association and the
# identity the AMF is talking about.

kind: flow
name: n2_handover_notify_releases_source_context
description: N2 handover; after HANDOVER NOTIFY assert the AMF releases the SOURCE UE context on the source association and the target association stays usable
detail: |
  Registration, one PDU session, N2 handover with this flow acting as the
  target NG-RAN node. After the HANDOVER COMMAND the UE is swapped onto the
  target leg (keeping the source RAN-UE-NGAP-ID bound so the source leg stays
  observable) and HANDOVER NOTIFY is sent.

  It then asserts a UE CONTEXT RELEASE COMMAND arrives for the same
  AMF-UE-NGAP-ID, on the SOURCE association, addressed to the SOURCE
  RAN-UE-NGAP-ID; answers UE CONTEXT RELEASE COMPLETE on that association; and
  proves the target association is still serving this UE by running an uplink
  NAS PDU session release over it and requiring the answer back on the target
  leg.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - source_released_target_live
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say
            # so (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1
            # connection as soon as registration completes.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_handover_request
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: check
            field: ue.PduAddress
            op: not_empty
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          - type: send
            message: HandoverRequired

  wait_handover_request:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: HandoverRequest
        target: wait_handover_command
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: equals
            expected: "{{ue.Params.pilot_amf_id}}"
          - type: send
            message: HandoverRequestAcknowledge
            peer: "{{ue.Params.target_gnb_name}}"

  wait_handover_command:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: HandoverCommand
        target: wait_source_release
        actions:
          - type: ngap_handover_swap
            params:
              keep_source_binding: true
          - type: send
            message: HandoverNotify

  wait_source_release:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      # --- TS 23.502 §4.9.1.3.3 / TS 38.413 §8.4.3.2 ---
      - event: UEContextReleaseCommand
        target: wait_target_still_serving
        actions:
          # The UE-NGAP-ID pair lives inside the UE NGAP IDs IE of the
          # command (TS 38.413 §9.2.2.5), not at the top level — the top-level
          # ran_ue_ngap_id is the runner's decode convenience.
          - type: check
            field: ue_context_release_command_ies.0.ue_ngap_ids
            op: ie_present
          - type: check
            field: ue_context_release_command_ies.0.ue_ngap_ids.amf_ue_ngap_id
            op: equals
            expected: "{{ue.Params.pilot_amf_id}}"
          # The SOURCE leg, by both of the things that name a leg: the
          # association it arrived on and the RAN-UE-NGAP-ID it addresses.
          - type: check
            field: ue.RxGnb
            op: equals
            expected: "{{ue.Params.ho_source_gnb}}"
          - type: check
            field: ue_context_release_command_ies.0.ue_ngap_ids.ran_ue_ngap_id
            op: equals
            expected: "{{ue.Params.ho_source_ran_ue_id}}"
          - type: send
            message: UEContextReleaseComplete
            peer: "{{ue.Params.ho_source_gnb}}"
            message_body: |
              {
                "ran_ue_ngap_id": "{{ue.Params.ho_source_ran_ue_id}}",
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          # And the UE is still reachable on the target: exercise it.
          - type: send
            message: PDUSessionReleaseRequest

  wait_target_still_serving:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionReleaseCommand.DLNASTransport.PDUSessionReleaseCommand
        target: source_released_target_live
        actions:
          - type: check
            field: ue.RxGnb
            op: equals
            expected: "{{ue.Params.target_gnb_name}}"
          - type: check
            field: ran_ue_ngap_id
            op: equals
            expected: "{{ue.Params.ho_target_ran_ue_id}}"
          - type: send
            message: PDUSessionResourceReleaseResponse

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-530).
#
# REG-530 — After HandoverNotify from the target association, a UEContextReleaseCommand
# for the same AMF-UE-NGAP-ID is received on the SOURCE association; the runner answers
# UEContextReleaseComplete and the target association remains usable for the UE.
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `source_released_target_live`
    metric: final_state_counts.source_released_target_live
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one HANDOVER ACKNOWLEDGE was sent (HandoverRequestAcknowledge)
    metric: msg_types.tx.ngap.NGAP_HANDOVER_ACKNOWLEDGE
    op: equals
    value: 1
  - name: one HANDOVER NOTIFY was sent
    metric: msg_types.tx.ngap.NGAP_HANDOVER_NOTIFY
    op: equals
    value: 1
  - name: one HANDOVER REQUIRED was sent
    metric: msg_types.tx.ngap.NGAP_HANDOVER_REQUIRED
    op: equals
    value: 1
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: five NAS UPLINK TRANSPORT messages went out (AuthResponse, PDUSessionEstablishmentRequest, PDUSessionReleaseRequest, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 5
  - name: one PDU SESSION RESOURCE RELEASE RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_PDU_SESSION_RESOURCE_RELEASE_RESPONSE
    op: equals
    value: 1
  - name: one PDU SESSION RESOURCE SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_PDU_SESSION_RESOURCE_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one UE CONTEXT RELEASE COMPLETE was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RELEASE_COMPLETE
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a HANDOVER COMMAND arrived
    metric: rx_events.HandoverCommand
    op: greater_or_equal
    value: 1
  - name: a HANDOVER REQUEST arrived
    metric: rx_events.HandoverRequest
    op: greater_or_equal
    value: 1
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a PDU SESSION RELEASE COMMAND arrived (the NAS message inside the NGAP PDU SESSION RELEASE COMMAND)
    metric: rx_events.PDUSessionReleaseCommand.DLNASTransport.PDUSessionReleaseCommand
    op: greater_or_equal
    value: 1
  - name: a PDU SESSION RESOURCE SETUP REQUEST arrived
    metric: rx_events.PDUSessionResourceSetupRequest
    op: greater_or_equal
    value: 1
  - name: a UE CONTEXT RELEASE COMMAND arrived
    metric: rx_events.UEContextReleaseCommand
    op: greater_or_equal
    value: 1
  # The 14 `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all 14 declared checks ran
    metric: checks_total
    op: equals
    value: 14
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
