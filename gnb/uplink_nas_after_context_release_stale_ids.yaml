# Plain UL NAS Transport with stale/released UE-NGAP IDs sent AFTER UE context
# release (3GPP TS 38.413 §8.3 / abnormal). The AMF must discard it (no context
# for the released ids) and stay up.
kind: flow
name: uplink_nas_after_context_release_stale_ids
description: UL NAS with stale ids after context release; assert AMF discards/stays up (YAML)
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states: [rejected, tolerated, failed]
states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions: [{ type: send, message: InitialUEMessage }]
  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }
  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_release_cmd
        actions:
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          - { type: send, message: UEContextReleaseRequest }
  wait_release_cmd:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: UEContextReleaseCommand
        target: wait_reaction
        actions:
          - { type: send, message: UEContextReleaseComplete }
          - type: send
            message: PlainUplinkNas
            message_body: |
              { "amf_ue_ngap_id": 8388607 }
  wait_reaction:
    on_timeout: { duration: 8s, target: tolerated }
    transitions:
      - { event: ErrorIndication, target: rejected }
      - { event: NASDownlinkTransport.5GMMStatus, target: rejected }
any_state_transitions:
  - { event: Error, target: failed }

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-249 (robustness, expected_terminal: null) —
# ErrorIndication received on N2 referencing the stale AP IDs, and no NAS response is
# produced for the message sent on them
#
# REG-249 (expected_terminal: null, but the criterion picks one): "ErrorIndication
# received on N2 referencing the stale AP IDs, and no NAS response is produced for the
# message sent on them". `tolerated` is the bare 8 s timer. ONE WIDENING, STATED: the
# flow also routes a 5GMM STATUS to `rejected`. That is a NAS response, which the
# criterion's second clause forbids — but it is also the AMF explicitly refusing the
# message, which is the behaviour §10.6 is about. The divergence is in the template, not
# in this pin.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `rejected` — the terminal this row claims
    metric: final_state_counts.rejected
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 2
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
