# NAS non-delivery indication (gNB → AMF) — TS 38.413 §8.6.5 / TS 24.501.
#
# Registers a UE and stays CM-CONNECTED, then an external MT
# N1N2MessageTransfer (a curl trigger carrying n1n2FailureTxfNotifURI) makes
# the AMF deliver a session-less DL NAS immediately. The gNB simulates an
# undeliverable NAS (lost radio link to the UE) by replying
# NASNonDeliveryIndication that echoes the received NAS PDU byte-exact. The AMF
# correlates the echoed PDU against its pending N1N2 queue (dmf
# failN1N2OneByPdu) and POSTs an N1N2MsgTxfrFailureNotification(UE_NOT_RESPONDING)
# to the failure URI — asserted by the namf/n1n2_failure_receiver listener.
#
# Orchestrated by scripts/e2e-gnb-run.sh step 06-nas-non-delivery: background
# this flow, wait for it to register + reach wait_dl_nas, then fire the curl
# N1N2 trigger with the failure URI → receiver. PASS here = this flow reaches
# `non_delivered` (it received a DL NAS and answered NASNonDeliveryIndication);
# the failure-notification assertion is the receiver's PASS.
#
# Requires the engine NASNonDeliveryIndication TX enricher (d3x-run
# runner/enrichers_gnb_additions.go) which echoes the last DL NAS PDU verbatim.

kind: flow
name: nas_non_delivery
description: Register, receive a DL NAS, reply NASNonDeliveryIndication echoing the PDU byte-exact (YAML)
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - non_delivered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            message_body: |
              {
                "criticality": 1,
                "rrc_establishment_cause": 0,
                "ue_context_request": 1
              }

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_dl_nas
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

  # CM-CONNECTED. Wait for the externally-triggered DL NAS, then declare it
  # undeliverable: NASNonDeliveryIndication echoes the received NAS PDU
  # byte-exact (the enricher pulls it from the last DL NAS). Long timeout so
  # the orchestrator can fire the curl trigger after registration settles.
  # The 06-nas-non-delivery curl trigger ships a session-less DL NAS that
  # decodes to a 5GMM Configuration Update Command (NAS type 0x54), so the
  # resolved event is NASDownlinkTransport.ConfigurationUpdateCommand. The
  # enricher echoes the received PDU verbatim regardless of NAS type.
  wait_dl_nas:
    on_timeout:
      duration: 60s
      target: failed
    transitions:
      - event: NASDownlinkTransport.ConfigurationUpdateCommand
        target: non_delivered
        actions:
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: NASNonDeliveryIndication

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-274, REG-634).
#
# REG-274 — The NG association and the UE-associated connection survive; a subsequent
# uplink NAS message on the same AP IDs is answered
#
# REG-634 — After the NASNonDeliveryIndication no duplicate delivery is claimed on the
# same connection, and on a fresh NAS connection the same SMS-DELIVER is received
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `non_delivered`
    metric: final_state_counts.non_delivered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: one NAS NON DELIVERY INDICATION was sent
    metric: msg_types.tx.ngap.NGAP_NAS_NON_DELIVERY_INDICATION
    op: equals
    value: 1
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a CONFIGURATION UPDATE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.ConfigurationUpdateCommand
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  # The four `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all four declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
