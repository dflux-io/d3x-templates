# REG-403 — the AUTHENTICATION REQUEST names a DIFFERENT ngKSI from the one the
# UE put in its initial NAS message.
#
# TS 24.501 §5.4.1.3.2 (retrieved with matrix/scripts/spec-clause.py against the
# pinned Rel-18 corpus, verbatim):
#
#   "This message shall include the ngKSI that will be used by the UE and AMF to
#    identify the KAMF and the partial native security context that is created
#    if the authentication is successful."
#
#   "IF AN ngKSI IS CONTAINED IN AN INITIAL NAS MESSAGE DURING A 5GMM PROCEDURE,
#    THE NETWORK SHALL INCLUDE A DIFFERENT ngKSI VALUE IN THE AUTHENTICATION
#    REQUEST MESSAGE when it initiates a 5G AKA based primary authentication and
#    key agreement procedure."
#
# TS 24.501 §9.11.3.32: "The NAS key set identifier is allocated by the network.
# … The NAS key set identifier is a type 1 information element." Table
# 9.11.3.32.1 makes it a 3-bit value; the value 111 (7) is "no key is available".
#
# WHY THE ROW NEEDS TWO LEGS, AND WHY THE SECOND ONE IS THE REAL TEST
# -------------------------------------------------------------------
# LEG A — the initial registration. EnrichInitialUEMessage sets
# `Ngksi: {NasKeySetId: 7, Tsc: NATIVE}`, i.e. "no key is available", which is
# correct for a UE with no context. The AUTHENTICATION REQUEST must therefore
# name something other than 7, and it must also be a USABLE identifier: 7 is
# reserved by §9.11.3.32 for "no key is available", so an AMF that allocated 7
# to a live context would be labelling a real KAMF with the value that means
# there is none. Asserted as `<= 6`.
#
#   A purist can argue that a UE sending 7 has not "contained an ngKSI" in the
#   sense the clause means, so this leg alone would be a weak reading of it.
#   Which is why there is a second leg.
#
# LEG B — the mobility registration update. The connection is released, and the
# UE re-registers with its real 5G-GUTI over the native context, carrying
# `Ngksi: {NasKeySetId: 0, Tsc: NATIVE}` — a genuine, in-use key set identifier
# (EnrichRegistrationUpdate, enrichers_gnb_additions.go). There is now no doubt
# that "an ngKSI is contained in an initial NAS message". If the AMF answers by
# initiating a fresh 5G AKA run, the ngKSI in that AUTHENTICATION REQUEST must
# differ from 0. Asserted as `>= 1`.
#
# The value comparisons are one-sided because the check engine has no
# `not_equals` and no way to read back what WE transmitted. That is not a
# weakness here: the transmitted values are fixed in the enrichers named above,
# not negotiated, so "different from what the UE sent" is exactly `<= 6` in leg
# A and `>= 1` in leg B, and each is stated against the constant it is derived
# from.
#
# IF THE AMF DOES NOT RE-AUTHENTICATE ON THE UPDATE
# -------------------------------------------------
# §5.4.1.3.2's obligation is conditional — "WHEN it initiates a 5G AKA based
# primary authentication and key agreement procedure". An AMF that accepts the
# registration update on the existing context has not initiated one and owes
# nothing, so leg B's precondition simply did not arise: the flow terminates on
# `ngksi_distinct` having proved leg A, and the run report shows which legs ran.
# Scoring that as a core failure would invent an obligation the clause does not
# create.
#
# MEASURED (2026-08-11, this lab) — tinycore passes leg A and FAILS leg B.
#
#   LEG A: the UE sent ngKSI 7; the AUTHENTICATION REQUEST carried
#          {nas_key_set_id: 0, tsc: 1}. Different, and usable.        PASS
#
#   LEG B: the mobility REGISTRATION REQUEST, off the wire —
#
#            7e 01 72 76 89 68 02 | 7e 00 41 02 00 0b f2 …
#            ^EPD ^hdr=1 ^MAC     ^SN   ^inner plaintext REGISTRATION REQUEST
#                                       ^^^^^^^^ 7e 00 41 = EPD, plain, 0x41
#                                                ^^ octet 4: low nibble 2 =
#                                                   mobility updating, HIGH
#                                                   NIBBLE 0 = ngKSI 0, native
#
#          so an ngKSI unambiguously IS contained in this initial NAS message,
#          and its value is 0. tinycore initiated a 5G AKA run in response — the
#          exact condition §5.4.1.3.2 attaches its duty to — and its
#          AUTHENTICATION REQUEST carried {nas_key_set_id: 0, tsc: 1}:
#
#            [FAIL] nas.ngksi.nas_key_set_id greater_or_equal 1 (actual=0)
#
#          THE SAME ngKSI THE UE SENT. "The network shall include a different
#          ngKSI value in the AUTHENTICATION REQUEST message" is not satisfied.
#          This matters beyond bookkeeping: the ngKSI is what lets the UE tell
#          the KAMF being replaced from the KAMF replacing it, and reusing the
#          old identifier for a new partial native context is precisely the
#          ambiguity the sentence exists to prevent. Left failing; the assertion
#          is written to the spec, not to the core.

kind: flow
name: auth_request_ngksi_differs
description: Assert the AUTHENTICATION REQUEST carries an ngKSI different from the one the UE sent, both for an initial registration (ngKSI 7) and for a mobility update on an existing context (ngKSI 0)
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - ngksi_distinct
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          # EnrichInitialUEMessage sends ngKSI 7 ("no key is available").
          - type: send
            message: InitialUEMessage
            message_body: |
              {
                "criticality": 1,
                "rrc_establishment_cause": 0,
                "ue_context_request": 1
              }

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          # --- §5.4.1.3.2 "This message shall include the ngKSI…"
          - type: check
            field: nas.ngksi
            op: ie_present
          # --- LEG A: different from the 7 the UE sent, and a usable identifier
          # --- rather than §9.11.3.32's "no key is available" value.
          - type: check
            field: nas.ngksi.nas_key_set_id
            op: less_or_equal
            expected: 6
          # The clause is about the ngKSI that identifies "the KAMF and the
          # partial native security context that is created if the
          # authentication is successful", so the run must be a real 5G AKA one.
          - type: check
            field: nas.authentication_param_rand
            op: ie_present
          - type: check
            field: nas.authentication_param_autn
            op: ie_present
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_release_cmd
        actions:
          # The 5G-GUTI leg B re-registers with.
          - type: check
            field: nas.guti
            op: ie_present
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: UEContextReleaseRequest

  wait_release_cmd:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: UEContextReleaseCommand
        target: wait_second_auth
        actions:
          - type: send
            message: UEContextReleaseComplete
          - type: ngap_realloc
          # LEG B: an initial NAS message that unambiguously CONTAINS an ngKSI —
          # EnrichRegistrationUpdate sends NasKeySetId 0, the identifier of the
          # context this message is protected with.
          - type: send
            message: RegistrationUpdate

  wait_second_auth:
    # §5.4.1.3.2's duty is conditional on the AMF initiating a 5G AKA run. If it
    # accepts the update on the existing context instead, or refuses it, no such
    # run was initiated and there is nothing for the clause to require: leg A
    # stands on its own and the flow terminates on it.
    on_timeout:
      duration: 12s
      target: ngksi_distinct
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: ngksi_distinct
        actions:
          - type: check
            field: nas.ngksi
            op: ie_present
          # --- LEG B: different from the 0 the UE sent in the update.
          - type: check
            field: nas.ngksi.nas_key_set_id
            op: greater_or_equal
            expected: 1
          # …and still a usable identifier, not "no key is available".
          - type: check
            field: nas.ngksi.nas_key_set_id
            op: less_or_equal
            expected: 6
          - type: check
            field: nas.authentication_param_rand
            op: ie_present
      - event:
          or:
            - InitialContextSetupRequest.RegistrationAccept
            - NASDownlinkTransport.RegistrationAccept
            - NASDownlinkTransport.RegistrationReject
            - UEContextReleaseCommand
        target: ngksi_distinct

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-403).
#
# REG-403 — The REGISTRATION REQUEST is sent with a specific ngKSI value; the ngKSI in
# the resulting AUTHENTICATION REQUEST differs from it.
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  # THE TERMINAL. One route to `ngksi_distinct` is a timer (the absence window), so the
  # message assertions below are what separate "reached it" from "waited it out".
  - name: the flow reached `ngksi_distinct`
    metric: final_state_counts.ngksi_distinct
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: two INITIAL UE MESSAGE messages went out (InitialUEMessage, RegistrationUpdate)
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 2
  - name: three NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 3
  - name: one UE CONTEXT RELEASE COMPLETE was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RELEASE_COMPLETE
    op: equals
    value: 1
  - name: one UE CONTEXT RELEASE REQUEST was sent
    metric: msg_types.tx.ngap.NGAP_UE_CONTEXT_RELEASE_REQUEST
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a UE CONTEXT RELEASE COMMAND arrived
    metric: rx_events.UEContextReleaseCommand
    op: greater_or_equal
    value: 1
  # Several routes reach `ngksi_distinct` with different numbers of checks
  # (6..10); 6 is the shortest one, so it is the floor that still proves
  # an assertion was made on the messages this run saw.
  - name: at least six declared checks ran
    metric: checks_total
    op: greater_or_equal
    value: 6
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
