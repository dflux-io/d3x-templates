# REG-450 — an uplink NAS message that fails the integrity check AFTER security
# activation is discarded, and the connection survives.
#
# SILENCE IS THE CORE'S ANSWER, NOT ITS ABSENCE (xp-245 negative-probe audit).
#
# TS 24.501 §4.4.4.3, final paragraph (retrieved with matrix/scripts/spec-clause.py
# against the pinned Rel-18 corpus, verbatim):
#
#   "Once the secure exchange of NAS messages has been established for the NAS
#    signalling connection, the receiving 5GMM entity in the AMF shall not
#    process any NAS signalling messages unless they have been successfully
#    integrity checked by the NAS. If any NAS signalling message, having not
#    successfully passed the integrity check, is received, then the NAS in the
#    AMF shall discard that message."
#
# TS 33.501 §6.4.3.2 is the same requirement stated as replay/integrity
# protection of NAS signalling.
#
# WHY THE §4.4.4.3 "PROCESS EVEN IF THE MAC FAILS" LIST DOES NOT SAVE THE CORE
# ---------------------------------------------------------------------------
# The same clause elsewhere obliges the AMF to process seven message types "even
# if the MAC included in the message fails the integrity check", and
# DEREGISTRATION REQUEST — the message this flow forges — is one of them. That
# list is expressly scoped: "Once a current 5G NAS security context exists,
# UNTIL the secure exchange of NAS messages has been established for the NAS
# signalling connection". This probe fires strictly AFTER a completed SECURITY
# MODE COMMAND / SECURITY MODE COMPLETE exchange and after a REGISTRATION ACCEPT
# that arrived integrity-protected and ciphered, so secure exchange IS
# established and the final paragraph above governs, with no exceptions. The
# flow asserts that precondition rather than assuming it (see the two
# nas.security.* checks in wait_context_setup): if it did not hold, this row
# would be probing the wrong phase and would be measuring nothing.
#
# WHAT IS ACTUALLY ON THE WIRE
# ----------------------------
# The probe is a fully valid, correctly COUNTED secured DEREGISTRATION REQUEST
# whose four MAC octets are then inverted, so the ONLY thing wrong with it is
# the integrity check. MEASURED (2026-08-11, this lab, `-trace` TX #13):
#
#     7e 02 00 8d 04 e7 02 | 9b …
#     ^EPD ^hdr ^MAC       ^SN = 2, the next unused COUNT
#
# and tinycore said so, in its own log, for that exact frame:
#
#   "uplink NAS integrity check failed — message discarded"
#   error: "nas: MAC mismatch: received 008d04e7, expected ff72fb18"
#   supi:  imsi-001010000000450
#
# 0x00 = ~0xFF, 0x8D = ~0x72, 0x04 = ~0xFB, 0xE7 = ~0x18 — the received MAC is
# the byte-for-byte XOR-0xFF complement of the MAC the AMF computed over the
# same COUNT and the same key, which is precisely the corruption the enricher
# applies. The violation is on the wire, not in the YAML, and tinycore
# DISCARDED it exactly as §4.4.4.3 requires.
#
# WHY THE FORGED MESSAGE IS A DEREGISTRATION REQUEST AND NOT A REGISTRATION
# COMPLETE
# ------------------------------------------------------------------------
# A discard emits nothing. A forged REGISTRATION COMPLETE also emits nothing
# when it is PROCESSED, so it cannot separate "discarded" from "swallowed" — and
# that is exactly the shape that made six rows lie for weeks. A DEREGISTRATION
# REQUEST can: an AMF that processed it must answer DEREGISTRATION ACCEPT
# (§5.5.2.3.2) and leave 5GMM-REGISTERED. Acceptance of the forgery is therefore
# a message, not an inference.
#
# THE SECOND HALF OF THE CRITERION IS THE SECOND HALF OF THE FLOW
# ---------------------------------------------------------------
# "…while a correctly protected message sent afterwards on the same connection
# is still answered." After the absence window the flow sends a legitimate,
# correctly protected, correctly counted DEREGISTRATION REQUEST:
#
#   DEREGISTRATION ACCEPT comes back -> the forgery was discarded AND the
#                                       context survived it        -> rejected
#   nothing comes back               -> the AMF acted on the forged message
#                                       and can no longer answer one it CAN
#                                       verify                     -> tolerated
#
# so the pass is never a bare timer: both terminals are reached by an observable.
#
# ACCEPTANCE TEST (mandatory for a negative row) — MEASURED 2026-08-11:
#   bad_mac: true  (as authored)  -> rejected   (silence, then the follow-up
#                                    DEREGISTRATION ACCEPT arrives)
#   bad_mac: false (violation off) -> tolerated (the identical, correctly-MAC'd
#                                    DEREGISTRATION REQUEST is answered inside
#                                    the absence window)
# The row can report both terminals, so it is testing something.

kind: flow
name: post_smc_bad_mac_uplink_discarded
description: After security activation, an uplink NAS with a corrupted MAC must be discarded while a correctly protected message on the same connection is still answered (YAML)
category: negative
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states: [rejected, tolerated, failed]
states:
  idle:
    transitions:
      - event: Start
        # FOR bit: uplink NAS pending (TS 24.501 §9.11.3.7) — the probe and its
        # follow-up both need the N1 connection kept up after registration ends.
        actions: [{ type: send, message: InitialUEMessage, params: { follow_on_request: true } }]
        target: wait_auth_request
  wait_auth_request:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - { type: check, field: amf_ue_ngap_id, op: not_empty }
          - { type: send, message: AuthResponse }
  wait_security_mode:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - { type: check, field: ue.SecCtx, op: not_empty }
          - { type: send, message: SecurityModeComplete }
  wait_context_setup:
    on_timeout: { duration: 10s, target: failed }
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_discard
        actions:
          # THE PRECONDITION OF §4.4.4.3's FINAL PARAGRAPH, ASSERTED.
          # "Once the secure exchange of NAS messages has been established" —
          # established is not assumed here, it is read off the outer header of
          # the REGISTRATION ACCEPT the AMF just sent under the new context.
          # nas.security.* and NOT nas.header.security_header_type: DecodeSecure
          # strips the outer header, so the inner one is always the plain value
          # and would pass against a core answering entirely in the clear.
          - { type: check, field: nas.security.protected, op: equals, expected: true }
          - { type: check, field: nas.security.mac_verified, op: equals, expected: true }
          - { type: send, message: InitialContextSetupResponse }
          - { type: send, message: RegistrationComplete }
          # The forgery. bad_mac:false is the acceptance-test switch.
          - type: send
            message: SecuredUplinkBadMac
            params: { inner: deregistration_request, bad_mac: true }
  wait_discard:
    # The §4.4.4.3 absence window. A discard emits nothing and that is the
    # spec-mandated behaviour, so the window does NOT resolve on its own — it
    # hands over to the follow-up leg, which has an observable either way.
    on_timeout:
      duration: 6s
      target: prove_context_intact
      actions: [{ type: send, message: DeregistrationRequest }]
    transitions:
      # The AMF answered the de-registration it could not verify: it processed a
      # NAS message that failed the integrity check. That is the finding.
      - { event: NASDownlinkTransport.DeregistrationAccept, target: tolerated }
      # Tearing the UE context down is acting on the forged message just as
      # much as answering it: the forged DEREGISTRATION REQUEST is the only
      # stimulus this connection has received since REGISTRATION COMPLETE.
      - { event: UEContextReleaseCommand, target: tolerated }
      # An explicit refusal is a refusal — §4.4.4.3's discard is a floor, not a
      # ceiling, and none of these completes the procedure the forgery asked for.
      - { event: NASDownlinkTransport.AuthenticationRequest, target: rejected }
      - { event: NASDownlinkTransport.SecurityModeCommand, target: rejected }
      - { event: NASDownlinkTransport.RegistrationReject, target: rejected }
      - { event: NASDownlinkTransport.5GMMStatus, target: rejected }
      - { event: ErrorIndication, target: rejected }
  prove_context_intact:
    # No answer to a message the AMF *can* verify: the forgery moved its state.
    on_timeout: { duration: 10s, target: tolerated }
    transitions:
      - event: NASDownlinkTransport.DeregistrationAccept
        target: rejected
        actions:
          # The answer came back under the SAME security context the forgery
          # failed to verify against — "kept the 5GMM-context and 5G NAS
          # security context unchanged", read off the wire.
          - { type: check, field: nas.security.protected, op: equals, expected: true }
          - { type: check, field: nas.security.mac_verified, op: equals, expected: true }
      - { event: UEContextReleaseCommand, target: rejected }
      - { event: NASDownlinkTransport.5GMMStatus, target: rejected }
      - { event: ErrorIndication, target: rejected }
any_state_transitions:
  - { event: Error, target: failed }

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM, VERBATIM: REG-450 (negative, expected_terminal: rejected) —
# After security activation, an uplink NAS message with a corrupted MAC draws no
# downlink NAS response, while a correctly protected message sent afterwards on the same
# connection is still answered.
#
# REG-450: "an uplink NAS message with a corrupted MAC draws no downlink NAS response,
# while a correctly protected message sent afterwards on the same connection is still
# answered." The second half is the whole discriminator and it is a message:
# prove_context_intact -> `rejected`. `tolerated` is the AMF ANSWERING (or releasing on)
# the forgery — a message it may not process at all once secure exchange is established.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `rejected` — the terminal this row claims
    metric: final_state_counts.rejected
    op: equals
    value: 1
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 4
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
