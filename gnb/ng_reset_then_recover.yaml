# Registration -> global NG Reset -> fresh registration (reset-and-recover).
# (3GPP TS 38.413 §8.7.4 NG Reset + §8.7.1 / re-establish UE service.)
#
# Goes beyond the standalone `ng_reset` flow: after the gNB resets the NG-C
# association it drives a brand-new UE registration to verify the AMF actually
# released all contexts and accepts new UEs (no stale-context rejection, no
# leaked RAN/AMF-UE-NGAP-ID state). End-to-end recovery assertion.
#
# Phase 1: register a UE. Phase 2: global NGReset, await NGResetAcknowledge.
# Phase 3: allocate a fresh RAN-UE-NGAP-ID (ngap_realloc) and run a second full
# 5G-AKA registration. Reaching `recovered` proves the association is usable
# again after a reset.

kind: flow
name: ng_reset_then_recover
description: Register, global NG Reset, then re-register a fresh UE to prove post-reset recovery (YAML)
detail: |
  Registers a UE, performs a gNB-initiated global NG Reset (3GPP TS 38.413
  §8.7.4), waits for NGResetAcknowledge, then allocates a new RAN-UE-NGAP-ID and
  runs a second full registration (5G-AKA + security + context setup). The second
  registration succeeding demonstrates the AMF cleared all UE contexts on the
  reset and accepts new UE-associated signalling — the recovery half of the reset
  procedure that standalone `ng_reset` does not cover. Success terminal:
  `recovered`.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - recovered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_ng_reset_ack
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: NGReset

  wait_ng_reset_ack:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NGResetAcknowledge
        target: wait_reauth
        actions:
          # Fresh RAN-UE-NGAP-ID so the next InitialUEMessage is a new UE.
          - type: ngap_realloc
          - type: send
            message: InitialUEMessage

  wait_reauth:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_resecurity
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: send
            message: AuthResponse

  wait_resecurity:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_recontext
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_recontext:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: recovered
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-843).
#
# REG-843 — After NGResetAcknowledge, a new InitialUEMessage on a freshly allocated RAN
# UE NGAP ID completes a full registration ending in RegistrationAccept
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `recovered`
    metric: final_state_counts.recovered
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: two INITIAL CONTEXT SETUP RESPONSE messages went out
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 2
  - name: two INITIAL UE MESSAGE messages went out
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 2
  - name: six NAS UPLINK TRANSPORT messages went out (AuthResponse, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 6
  - name: one NG RESET was sent
    metric: msg_types.tx.ngap.NGAP_NG_RESET
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: two REGISTRATION ACCEPT messages arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 2
  - name: two AUTHENTICATION REQUEST messages arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 2
  - name: two SECURITY MODE COMMAND messages arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 2
  - name: an NG RESET ACKNOWLEDGE arrived
    metric: rx_events.NGResetAcknowledge
    op: greater_or_equal
    value: 1
  # The seven `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all seven declared checks ran
    metric: checks_total
    op: equals
    value: 7
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
