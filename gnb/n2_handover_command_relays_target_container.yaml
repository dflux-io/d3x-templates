# REG-502 — the AMF relays the target's transparent container, it does not
# author one.
#
# TS 38.413 §8.4.1.2: "If the Target to Source Transparent Container IE has been
# received by the AMF from the handover target then the transparent container
# shall be included in the HANDOVER COMMAND message." TS 23.502 §4.9.1.3.2 step
# 8 makes the same point end-to-end: the container is RAN-to-RAN state and the
# 5GC is a pipe for it.
#
# THIS FLOW OWNS THE TARGET SIDE. Declaring a `HandoverRequest` transition
# suppresses the runner's fire-and-forget target auto-reply and hands the
# decoded HANDOVER REQUEST to this flow, which then answers as the target
# NG-RAN node — on the TARGET association (`peer:`), because that is who a
# HANDOVER REQUEST ACKNOWLEDGE / HANDOVER FAILURE is from (TS 38.413 §8.4.2).
# A reply on the source leg would arrive on the association the AMF already
# has the UE on, and a conformant AMF ignoring it would score as a defect.
#
# NEEDS TWO gNBs (register preconditions.gnbs: 2). With one gNB the HANDOVER
# REQUIRED names a target the AMF has never seen and the row measures "unknown
# target" instead of handover.
#
# HOW THIS ROW AVOIDS ASSERTING A CONSTANT. The target-side enricher builds a
# container that is DISTINCTIVE PER UE — 0xC0DE, the AMF-UE-NGAP-ID, the
# target's RAN-UE-NGAP-ID, 0xA55A — and publishes it as
# ue.Params.ho_t2s_container in the same base64 form a check against the
# inbound HANDOVER COMMAND resolves to. A fixed stub would still compare equal
# if the AMF had substituted some other UE's container, which is exactly the
# relay failure worth catching.

kind: flow
name: n2_handover_command_relays_target_container
description: N2 handover; assert the Target to Source Transparent Container in the HANDOVER COMMAND is byte-for-byte the one the target gNB sent
detail: |
  Registration, one PDU session, HANDOVER REQUIRED. The flow acts as the
  target NG-RAN node and puts a per-UE Target to Source Transparent Container
  in its HANDOVER REQUEST ACKNOWLEDGE, then asserts the HANDOVER COMMAND that
  comes back on the source association carries those same octets.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - container_relayed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say
            # so (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1
            # connection as soon as registration completes.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: check
            field: security_key
            op: not_empty
          - type: check
            field: ue.AmfUeNgapId
            op: not_empty
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_handover_request
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: check
            field: ue.PduAddress
            op: not_empty
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }
          - type: send
            message: HandoverRequired

  wait_handover_request:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: HandoverRequest
        target: wait_handover_command
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: equals
            expected: "{{ue.Params.pilot_amf_id}}"
          - type: send
            message: HandoverRequestAcknowledge
            peer: "{{ue.Params.target_gnb_name}}"

  wait_handover_command:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: HandoverCommand
        target: container_relayed
        actions:
          # ie_present FIRST: `equals` on an absent field would compare
          # "<missing>" against the expected string and fail loudly, but the
          # explicit presence assertion is what names the defect if the IE is
          # dropped entirely rather than corrupted.
          - type: check
            field: target_to_source_transparent_container
            op: ie_present
          - type: check
            field: target_to_source_transparent_container.rrc_container.rrc_information
            op: ie_present
          # --- TS 38.413 §8.4.1.2, the row's criterion ---
          - type: check
            field: target_to_source_transparent_container.rrc_container.rrc_information
            op: equals
            expected: "{{ue.Params.ho_t2s_container}}"
      - event: HandoverPreparationFailure
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-502).
#
# REG-502 — The octets of the Target to Source Transparent Container in the received
# HandoverCommand equal the octets the target gNB put in its HandoverRequestAcknowledge.
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `container_relayed`
    metric: final_state_counts.container_relayed
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one HANDOVER ACKNOWLEDGE was sent (HandoverRequestAcknowledge)
    metric: msg_types.tx.ngap.NGAP_HANDOVER_ACKNOWLEDGE
    op: equals
    value: 1
  - name: one HANDOVER REQUIRED was sent
    metric: msg_types.tx.ngap.NGAP_HANDOVER_REQUIRED
    op: equals
    value: 1
  - name: one INITIAL CONTEXT SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_CONTEXT_SETUP_RESPONSE
    op: equals
    value: 1
  - name: one INITIAL UE MESSAGE was sent
    metric: msg_types.tx.ngap.NGAP_INITIAL_UE_MESSAGE
    op: equals
    value: 1
  - name: four NAS UPLINK TRANSPORT messages went out (AuthResponse, PDUSessionEstablishmentRequest, RegistrationComplete, SecurityModeComplete)
    metric: msg_types.tx.ngap.NGAP_NAS_UPLINK_TRANSPORT
    op: equals
    value: 4
  - name: one PDU SESSION RESOURCE SETUP RESPONSE was sent
    metric: msg_types.tx.ngap.NGAP_PDU_SESSION_RESOURCE_SETUP_RESPONSE
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: a HANDOVER COMMAND arrived
    metric: rx_events.HandoverCommand
    op: greater_or_equal
    value: 1
  - name: a HANDOVER REQUEST arrived
    metric: rx_events.HandoverRequest
    op: greater_or_equal
    value: 1
  - name: a REGISTRATION ACCEPT arrived (in an INITIAL CONTEXT SETUP REQUEST)
    metric: rx_events.InitialContextSetupRequest.RegistrationAccept
    op: greater_or_equal
    value: 1
  - name: an AUTHENTICATION REQUEST arrived
    metric: rx_events.NASDownlinkTransport.AuthenticationRequest
    op: greater_or_equal
    value: 1
  - name: a SECURITY MODE COMMAND arrived
    metric: rx_events.NASDownlinkTransport.SecurityModeCommand
    op: greater_or_equal
    value: 1
  - name: a PDU SESSION RESOURCE SETUP REQUEST arrived
    metric: rx_events.PDUSessionResourceSetupRequest
    op: greater_or_equal
    value: 1
  # The 11 `check` actions on the path above. A template that stops
  # asserting — a check deleted, a branch taken that skips them — moves this
  # number, and nothing else in the report would have said so.
  - name: all 11 declared checks ran
    metric: checks_total
    op: equals
    value: 11
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
