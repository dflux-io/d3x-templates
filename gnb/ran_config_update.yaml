# RAN Configuration Update procedure (3GPP TS 38.413 §8.7.3).
#
# YAML mirror of the built-in `ran_config_update` flow defined in
# runner/flows/gnb/flow_ran_config_update.go. Run with:
#
#   ./bin/d3x-run run -flow template/gnb/ran_config_update.yaml \
#       -c config/lab.yaml -s config/subscribers.yaml -trace
#
# Non-UE-associated procedure. Performs NG Setup first, then sends a
# gNB-initiated RANConfigurationUpdate.

kind: flow
name: ran_config_update
description: NGSetup + gNB-initiated RAN Configuration Update procedure (YAML)
detail: |
  Performs NG Setup to establish the NG-C interface, then sends a gNB-initiated
  RANConfigurationUpdate to update the AMF with the gNB's current configuration
  (3GPP TS 38.413 §8.7.3).

  After the NG Setup exchange completes, the gNB sends a RANConfigurationUpdate
  containing the RAN node name and default paging DRX value. This procedure is
  used when the gNB's operational parameters change (e.g., supported tracking
  areas, paging configuration, node name).

  The AMF responds with either:
  - RANConfigurationUpdateAcknowledge: confirms the update was accepted
  - RANConfigurationUpdateFailure: rejects the update, typically with a cause
    code and optional TimeToWait before retry

  This is a non-UE-associated procedure — it operates at the NG-C interface level
  and does not require a UE context. The flow validates correct gNB configuration
  update signalling and AMF acceptance/rejection handling.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - updated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_ngsetup_response
        actions:
          - type: send
            message: NGSetupRequest

  wait_ngsetup_response:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NGSetupResponse
        target: wait_config_ack
        actions:
          # REG-820 wants the ACKNOWLEDGE "after a SUCCESSFUL NG Setup", and
          # nothing here looked at the response at all: one that decoded to an
          # empty struct drove the flow onward exactly like a conformant one.
          # TS 38.413 §9.2.6.2 marks AMF Name, Served GUAMI List and PLMN
          # Support List mandatory, so a response missing any of them did not
          # set up the NG-C interface this procedure goes on to update.
          # Asserted BEFORE the send: a failed check bails out of the action
          # list, so the update is not put on an interface never established.
          - { type: check, field: amf_name, op: not_empty }
          - { type: check, field: served_guami_list.length, op: greater_or_equal, expected: 1 }
          - { type: check, field: plmn_support_list.length, op: greater_or_equal, expected: 1 }
          - type: send
            message: RANConfigurationUpdate

  wait_config_ack:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: RANConfigurationUpdateAcknowledge
        target: updated
        actions:
          # TS 38.413 §9.2.6.5: the ACKNOWLEDGE carries Message Type and,
          # optionally, Criticality Diagnostics. Criticality Diagnostics on a
          # SUCCESSFUL outcome is the AMF reporting IEs of the update it could
          # not comprehend and ignored — acknowledged, but not wholly taken
          # into use, which is not REG-820's expected_outcome ("the AMF takes
          # the updated configuration into use"). `equals null` is the
          # runner's absent-field form: the IE carries `omitempty`, so an
          # omitted one misses the path and the check passes on absence.
          - { type: check, field: criticality_diagnostics, op: equals, expected: null }
      - event: RANConfigurationUpdateFailure
        target: failed

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — what this flow CLAIMS, said by the flow (REG-820).
#
# REG-820 — RANConfigurationUpdateAcknowledge received on N2 after a successful NG Setup
#
# `final_states` lists every way this flow can END; only this block says which one it
# claims. The counts below are derived from the FSM and the register row — NOT measured
# against a core; the first live run is what confirms them.
#
# Ours are asserted exactly (every send is one this flow declares); the core's with a
# floor, because a retransmission the spec permits must not fail a run that otherwise
# did what it claimed.
final_checks:
  - name: the flow reached `updated`
    metric: final_state_counts.updated
    op: equals
    value: 1
  # What this flow sent. Exact: each of these is a `send` action on the
  # path to the terminal above, so a count that moved means the flow did
  # not walk the path it claims to have walked.
  - name: one NG SETUP REQUEST was sent
    metric: msg_types.tx.ngap.NGAP_NG_SETUP_REQUEST
    op: equals
    value: 1
  - name: one RAN CONFIGURATION UPDATE was sent
    metric: msg_types.tx.ngap.NGAP_RAN_CONFIGURATION_UPDATE
    op: equals
    value: 1
  # What the core sent, by the identity of the message rather than its outer
  # wire type — `msg_types.rx` cannot tell two NAS downlinks apart. Floors:
  # a permitted retransmission must not fail a run that got where it claims.
  - name: an NG SETUP RESPONSE arrived
    metric: rx_events.NGSetupResponse
    op: greater_or_equal
    value: 1
  - name: a RAN CONFIGURATION UPDATE ACKNOWLEDGE arrived
    metric: rx_events.RANConfigurationUpdateAcknowledge
    op: greater_or_equal
    value: 1
  # THE CHECK FLOOR. `checks_total` counts `check` ACTIONS the FSM executed — it is
  # incremented in exactly one place (execCheck, runner/runner/action_executor.go) — and a
  # flow's own `final_checks` never touch it: they are evaluated after the run by
  # Metrics.EvaluateFinalChecks and reported separately. So while this flow declared no
  # `check` action anywhere, it reported `checks_total: 0` on every path, `checks_failed: 0`
  # could only ever be true, and REG-820 passed on all three cores having asserted nothing
  # about the CONTENT of either message it received. The four checks in the FSM above are
  # that content; this is the floor that stops them being quietly deleted again.
  - name: all four declared checks ran
    metric: checks_total
    op: equals
    value: 4
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
