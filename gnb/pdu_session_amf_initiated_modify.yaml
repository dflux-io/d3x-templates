# Handle an AMF/SMF-initiated PDUSessionResourceModifyRequest and respond
# (3GPP TS 38.413 §8.2.4 / §9.2.1.3-4).
#
# Under test: after a PDU session is established, the gNB waits for a network-
# initiated PDUSessionResourceModifyRequest (e.g. a PCF QoS change) and answers
# PDUSessionResourceModifyResponse.
#
# TRIGGER DEPENDENCY: PDU Session Modify is network-initiated (PCF/SMF). A bare
# Open5GS lab does not emit it without a policy change, so this flow is NOT in a
# suite — it reaches `not_triggered` when no request arrives. Run standalone with
# an induced QoS modification. Success: `modified` or `not_triggered`.

kind: flow
name: pdu_session_amf_initiated_modify
description: Establish a PDU session, wait for PDUSessionModifyRequest, reply ModifyResponse (YAML)
detail: |
  Registers, establishes a PDU session, then waits for a network-initiated
  PDUSessionResourceModifyRequest and replies PDUSessionResourceModifyResponse
  (3GPP TS 38.413 §8.2.4). Network-initiated and not produced by a bare Open5GS
  lab, so the flow reaches `not_triggered` on timeout and is for standalone use.
category: functional
type: client
protocol: ngap
nf: gnb
initial_state: idle
final_states:
  - modified
  - not_triggered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_auth_request
        actions:
          - type: send
            message: InitialUEMessage
            # Uplink NAS is pending after registration, so the FOR bit must say so
            # (TS 24.501 §9.11.3.7) — otherwise the AMF may release the N1 connection
            # as soon as registration completes, and free5GC does.
            params:
              follow_on_request: true

  wait_auth_request:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.AuthenticationRequest
        target: wait_security_mode
        actions:
          - type: check
            field: amf_ue_ngap_id
            op: not_empty
          - type: extract
            field: amf_ue_ngap_id
            store: pilot_amf_id
          - type: send
            message: AuthResponse

  wait_security_mode:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: NASDownlinkTransport.SecurityModeCommand
        target: wait_context_setup
        actions:
          - type: check
            field: ue.SecCtx
            op: not_empty
          - type: send
            message: SecurityModeComplete

  wait_context_setup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: InitialContextSetupRequest.RegistrationAccept
        target: wait_pdu_session_accept
        actions:
          - type: send
            message: InitialContextSetupResponse
          - type: send
            message: RegistrationComplete
          - type: send
            message: PDUSessionEstablishmentRequest

  wait_pdu_session_accept:
    on_timeout:
      duration: 15s
      target: failed
    transitions:
      - event: PDUSessionResourceSetupRequest
        target: wait_modify_request
        actions:
          # `greater_than 0`, NOT `not_empty`. ue.UpfTeid / ue.PduSessionId /
          # ue.Params.ps_ul_teid resolve to a RAW uint32 (resolveUEField returns the Go
          # value; only the NGAP/NAS/REST/SBI namespaces go through the JSON projection).
          # `not_empty` is `value != nil && value != "" && value != 0.0`, and in Go
          # `any(uint32(0)) != any(float64(0.0))` — the types differ — so it passed on a
          # ZERO TEID and an UNALLOCATED session id, i.e. on exactly what it existed to
          # catch. Pinned by runner/runner/uplane_assertion_ops_test.go.
          - type: check
            field: ue.PduSessionId
            op: greater_than
            expected: 0
          # N2 tunnel fidelity: UPF uplink GTP-U F-TEID present (non-zero)
          # at establishment — proves the tunnel was allocated (T2 item 5).
          - type: check
            field: ue.UpfTeid
            op: greater_than
            expected: 0
          - type: send
            message: PDUSessionResourceSetupResponse
            message_body: |
              {
                "amf_ue_ngap_id": "{{ue.Params.pilot_amf_id}}"
              }

  wait_modify_request:
    on_timeout:
      duration: 20s
      target: not_triggered
    transitions:
      - event: PDUSessionModifyRequest
        target: modified
        actions:
          - type: send
            message: PDUSessionResourceModifyResponse

any_state_transitions:
  - event: Error
    target: failed

# END-OF-FLOW ASSERTIONS — the runner is the only thing that decides whether this flow
# ran correctly, so the row's claim is stated here rather than reassembled downstream.
#
# THE REGISTER'S CLAIM (xp-341): REG-340 — if policy changed so the SMF initiates,
# PDUSessionResourceModifyRequest is received on N2 and answered. The harness cannot
# induce a policy change; `not_triggered` is the not-applicable outcome and is not a
# failure. Both terminals are pinned via or_metric.
#
# Counts below are derived from this FSM's own transitions and from the clauses named
# above; no core was contacted. checks_total is a FLOOR, not an equality: several of
# these flows can loop through a waiting state, and a floor cannot manufacture a failure
# the way an equality can.
final_checks:
  - name: the flow reached `modified` or `not_triggered`
    metric: final_state_counts.modified
    op: equals
    value: 1
    or_metric: final_state_counts.not_triggered
  - name: the run asserted something on the messages it saw
    metric: checks_total
    op: greater_or_equal
    value: 4
  - name: and no assertion failed
    metric: checks_failed
    op: equals
    value: 0
