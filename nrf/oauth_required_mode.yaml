# OAUTH-ENF-01 — OAuth2 enforcement on protected endpoints (full). See
# d3x-core docs/nrf/sanity-tests.md §4.7.10 (OAUTH-ENF-01).
#
# Proves the -oauth2 middleware both REJECTS unauthenticated calls to
# protected services AND ACCEPTS a valid bearer token, while leaving
# bootstrap + the token endpoint public:
#
#   1. GET /nnrf-nfm/v1/nf-instances     (no auth)  → 401 + ProblemDetails
#   2. GET /nnrf-bstr/v1/bootstrapping    (no auth)  → 200  (bstr public)
#   3. POST /nnrf-oauth/v1/oauth2/token   (no auth)  → 200 + access_token
#      (token endpoint public; requester is a PRE-REGISTERED consumer —
#      see below — so issuance succeeds)
#   4. GET /nnrf-nfm/v1/nf-instances  Bearer <token> → 200  (token accepted)
#
# The chicken-and-egg (under -oauth2 the NFM register endpoint is itself
# gated, so a consumer can't self-register to get its first token) is
# resolved WITHOUT any SUT change: scripts/nrf-oauth-enforced.sh registers
# the consumer against a sqlite-backed NRF *without* -oauth2, then restarts
# it *with* -oauth2 against the same DB (the profile survives — same
# mechanism as the persistence class). This flow then runs against the
# -oauth2 NRF with the consumer already present.
#
# REQUIRES: NRF restarted with -oauth2 -jwt-key, consumer
# cccc0009-0000-4000-8000-000000000009 pre-registered. Run via
# scripts/nrf-oauth-enforced.sh.

kind: flow
name: nrf_oauth_required_mode
description: Under -oauth2 — NFM 401 (no auth), bstr 200, token issued, NFM 200 with bearer (OAUTH-ENF-01).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: probing_nfm
        actions:
          - type: send
            message: NfmNoAuth
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-nfm/v1/nf-instances",
                "query": {"nf-type": "AMF"}
              }

  probing_nfm:
    transitions:
      - event: rest.NfmNoAuth_Answer
        target: probing_bstr
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 401
          - type: check
            field: rest.headers.Content-Type
            op: contains
            expected: "application/problem+json"
          - type: send
            message: BstrNoAuth
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-bstr/v1/bootstrapping"
              }

  probing_bstr:
    transitions:
      - event: rest.BstrNoAuth_Answer
        target: requesting_token
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          # Token endpoint is public; the consumer is pre-registered
          # (harness-seeded) so issuance succeeds. Form params go in query
          # (the handler reads r.FormValue; runner serializes body as JSON).
          - type: send
            message: GetToken
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "cccc0009-0000-4000-8000-000000000009",
                  "nfType": "AMF",
                  "scope": "nnrf-nfm",
                  "targetNfType": "NRF"
                }
              }

  requesting_token:
    transitions:
      - event: rest.GetToken_Answer
        target: probing_with_bearer
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body.token_type
            op: equals
            expected: Bearer
          - type: check
            field: rest.body.access_token
            op: not_empty
          - type: extract
            field: rest.body.access_token
            store: token
          # The positive path: the same protected GET that 401'd without
          # auth must now return 200 with a valid bearer token.
          - type: send
            message: NfmWithBearer
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-nfm/v1/nf-instances",
                "query": {"nf-type": "AMF"},
                "headers": {"Authorization": "Bearer {{ue.Params.token}}"}
              }

  probing_with_bearer:
    transitions:
      - event: rest.NfmWithBearer_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200

  done: {}
  failed: {}
