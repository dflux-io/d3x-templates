# DISC-08 — discovery by routing-indicator. See d3x-core
# docs/nrf/sanity-tests.md §4.7.3 (DISC-08) / §3.5.
#
# Registers three UDMs advertising distinct SUCI routing indicators in
# udmInfo.routingIndicators, then discovers with `routing-indicator=002`
# and asserts exactly the matching UDM is returned (TS 29.510 §6.2.3.2.2 —
# AMF/SEAF use this to pick the UDM/AUSF/AANF for a SUCI). A no-match
# routing indicator returns an empty set. Cleans up the three UDMs.
#
# Requires the NRF to support the `routing-indicator` discovery filter
# (d3x-core handler_disc.go / store) — added alongside this flow.
# Discovery query params go in `query` (runner serializes body as JSON; the
# handler reads r.URL.Query()).

kind: flow
name: nrf_disc_routing_indicator
description: Register 3 UDMs with distinct routingIndicators; discover by routing-indicator returns the matching one (DISC-08).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: reg2
        actions:
          - type: send
            message: Reg1
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000001",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "UDM", "nfStatus": "REGISTERED", "udmInfo": {"routingIndicators": ["001"]}}
              }

  reg2:
    transitions:
      - event: rest.Reg1_Answer
        target: reg3
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg2
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000002",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "UDM", "nfStatus": "REGISTERED", "udmInfo": {"routingIndicators": ["002"]}}
              }

  reg3:
    transitions:
      - event: rest.Reg2_Answer
        target: discovering_match
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg3
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000003",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "UDM", "nfStatus": "REGISTERED", "udmInfo": {"routingIndicators": ["003"]}}
              }

  discovering_match:
    transitions:
      - event: rest.Reg3_Answer
        target: checking_match
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: DiscMatch
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-disc/v1/nf-instances",
                "query": {"target-nf-type": "UDM", "requester-nf-type": "AMF", "routing-indicator": "002"}
              }

  checking_match:
    transitions:
      - event: rest.DiscMatch_Answer
        target: discovering_nomatch
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body.nfInstances.length
            op: equals
            expected: 1
          - type: check
            field: rest.body.nfInstances.0.nfType
            op: equals
            expected: UDM
          - type: check
            field: rest.body.nfInstances.0.udmInfo.routingIndicators.0
            op: equals
            expected: "002"
          - type: send
            message: DiscNoMatch
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-disc/v1/nf-instances",
                "query": {"target-nf-type": "UDM", "requester-nf-type": "AMF", "routing-indicator": "999"}
              }

  discovering_nomatch:
    transitions:
      - event: rest.DiscNoMatch_Answer
        target: cleanup1
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body.nfInstances.length
            op: equals
            expected: 0
          - type: send
            message: Del1
            peer: nrf-peer
            message_body: |
              {"method": "DELETE", "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000001"}

  cleanup1:
    transitions:
      - event: rest.Del1_Answer
        target: cleanup2
        actions:
          - type: send
            message: Del2
            peer: nrf-peer
            message_body: |
              {"method": "DELETE", "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000002"}

  cleanup2:
    transitions:
      - event: rest.Del2_Answer
        target: cleanup3
        actions:
          - type: send
            message: Del3
            peer: nrf-peer
            message_body: |
              {"method": "DELETE", "url": "/nnrf-nfm/v1/nf-instances/eeee0008-0000-4000-8000-000000000003"}

  cleanup3:
    transitions:
      - event: rest.Del3_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
