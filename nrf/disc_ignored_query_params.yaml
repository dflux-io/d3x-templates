# DISC-03 — unknown query params echoed back in body.ignoredQueryParams.
#
# Per TS 29.510 §5.3.2.2.2, NRF must echo unrecognised query params in
# the SearchResult's `ignoredQueryParams` array so consumers can detect
# typos and silently-dropped filters. A handler that just ignores them
# silently masks a consumer-side bug ("my filter didn't apply, but the
# server returned 200 — looks fine").
#
# We send target-nf-type=SMF (supported) plus bogus=1 and unknown=2
# (unsupported) and assert the response body contains both unknown
# names but does NOT contain target-nf-type.
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.3 DISC-03.

kind: flow
name: nrf_disc_ignored_query_params
description: Unknown query params returned in body.ignoredQueryParams.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering_fixture
        actions:
          - type: send
            message: RegisterFixtureSmf
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-ignored-params-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering_fixture:
    transitions:
      - event: rest.RegisterFixtureSmf_Answer
        target: probing
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: fixtureId
          - type: send
            message: DiscoverWithIgnored
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-disc/v1/nf-instances",
                "query": {
                  "target-nf-type": "SMF",
                  "requester-nf-type": "AMF",
                  "bogus": "1",
                  "unknown": "2"
                }
              }

  probing:
    transitions:
      - event: rest.DiscoverWithIgnored_Answer
        target: cleaning_up
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          # body.ignoredQueryParams must contain both bogus and unknown,
          # but NOT target-nf-type (which is recognised).
          - type: check
            field: rest.body
            op: contains
            expected: "ignoredQueryParams"
          - type: check
            field: rest.body
            op: contains
            expected: "bogus"
          - type: check
            field: rest.body
            op: contains
            expected: "unknown"
          # The "target-nf-type" string itself does not appear in the
          # response body — neither in nfInstances nor in ignoredQueryParams
          # (the value "SMF" goes back via nfInstance.nfType, not the key).
          - type: check
            field: rest.body
            op: not_contains
            expected: "target-nf-type"
          - type: send
            message: DeregisterFixture
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.fixtureId}}"
              }

  cleaning_up:
    transitions:
      - event: rest.DeregisterFixture_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
