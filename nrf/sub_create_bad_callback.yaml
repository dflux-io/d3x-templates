# SUB-03 — POST subscription with malformed nfStatusNotificationUri.
#
# nfStatusNotificationUri="not-a-url" → 400 + ProblemDetails. The NRF
# uses url.ParseRequestURI for validation (nrf/handler_sub.go), which
# rejects strings without a scheme + absolute form.

kind: flow
name: nrf_sub_create_bad_callback
description: POST subscription with malformed callback URI → 400 + ProblemDetails.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: creating
        actions:
          - type: send
            message: CreateSub
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-nfm/v1/subscriptions",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfStatusNotificationUri": "not-a-url"
                }
              }

  creating:
    transitions:
      - event: rest.CreateSub_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.headers.Content-Type
            op: contains
            expected: "application/problem+json"
          - type: check
            field: rest.body.status
            op: equals
            expected: 400

  done: {}
  failed: {}
