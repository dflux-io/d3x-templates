# OAUTH-04 — scope validation.
#
# scope=BOGUS → 400 invalid_scope. Catches a server that issues a token
# with a vendor-typo scope, which downstream producer NFs would then
# refuse to honour (or worse, honour with implicit "any" semantics).
#
# Multi-scope ("nnrf-disc nausf-auth") is in the spec but requires the
# consumer profile to advertise allowedNfTypes; that's left for a future
# flow once the SUT models allow-scope policy (see §3.5 SUT roadmap).
#
# Form-urlencoded body workaround: see comment in oauth_token.yaml.
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.4 OAUTH-04.

kind: flow
name: nrf_oauth_invalid_scope
description: scope=BOGUS → 400 invalid_scope.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: RegisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-oauth-scope-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: rest.RegisterNF_Answer
        target: probing_bogus_scope
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: nfInstanceId
          - type: send
            message: GetTokenBogusScope
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{ue.Params.nfInstanceId}}",
                  "nfType": "SMF",
                  "scope": "BOGUS",
                  "targetNfType": "NRF"
                }
              }

  probing_bogus_scope:
    transitions:
      - event: rest.GetTokenBogusScope_Answer
        target: cleaning_up
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.body.error
            op: equals
            expected: invalid_scope
          - type: send
            message: DeregisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.nfInstanceId}}"
              }

  cleaning_up:
    transitions:
      - event: rest.DeregisterNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
