# NFM-09 — PUT bodies omitting required fields → 400 each.
#
# Two probes:
#   1. Body omitting nfType
#   2. Body omitting nfStatus
# Both must fail with 400 + ProblemDetails. Catches a server that
# accepts an under-specified body and stores a profile with nfType=""
# or nfStatus="" (which then fails discovery downstream).
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.2 NFM-09.
#
# Note: NRF unconditionally sets nfStatus=REGISTERED on PUT
# (handler_nfm.go:49-56), so omitting nfStatus from the client body
# may NOT actually trigger a 400 — the server fills it in. This flow
# checks both probes; if the nfStatus-omission case passes (NRF
# tolerates the omission), that's a discovery, not a regression — the
# nfType probe still gates the test.

kind: flow
name: nrf_nfm_register_missing_required
description: PUT omitting nfType / nfStatus → 400 each + ProblemDetails.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: missing_nftype
        actions:
          - type: send
            message: RegisterNoNfType
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-missing-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  missing_nftype:
    transitions:
      - event: rest.RegisterNoNfType_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.headers.Content-Type
            op: contains
            expected: "application/problem+json"

  done: {}
  failed: {}
