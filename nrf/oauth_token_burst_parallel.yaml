# OAUTH-07b — true concurrent token-issuance burst (in-flow parallel send).
#
# This is the concurrent-burst counterpart to oauth_token_serial_burst.yaml.
# Instead of 5 sequential POSTs, a single `parallel_send` action fires 100
# token requests with 20 in flight at once — a self-contained request storm
# from ONE flow, no CLI -rate orchestration required. Each response status is
# tallied into the run metrics (rx: {rest: {status_200: N, status_429: M}})
# and into ue.Params (burst_total / burst_2xx / burst_429 / burst_errors).
#
# What this exercises:
#   - issuer throughput / state-leak under a simultaneous burst
#   - EdgeGuard-style rate limiting: a 429 split shows up directly in the
#     report's rx status tally, making the rate-limit scene punchy and
#     self-contained.
#
# parallel_send is a SYNCHRONOUS, self-contained step: the burst completes
# (all count round-trips, bounded by concurrency) before the flow advances,
# and the responses are tallied rather than demuxed back into the FSM — so the
# whole storm is a single FSM step. The CLI -rate / -repetitions path is
# unchanged and still available for cross-flow volume on top of this.

kind: flow
name: nrf_oauth_token_burst_parallel
description: Register one consumer, then fire a 100-request concurrent token burst (20 in flight); tally the 200/429 split.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: RegisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-oauth-burst-parallel.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: rest.RegisterNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: nfInstanceId
          # In-flow concurrent burst: 100 token POSTs, 20 in flight at once.
          # The request body is built once (templates resolved against the UE,
          # so nfInstanceId is the value extracted just above) and replayed
          # across the burst. Response statuses are tallied into metrics +
          # ue.Params; no per-response FSM event is generated.
          - type: parallel_send
            message: GetTokenBurst
            peer: nrf-peer
            count: 100
            concurrency: 20
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{ue.Params.nfInstanceId}}",
                  "nfType": "SMF",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  done: {}
  failed: {}
