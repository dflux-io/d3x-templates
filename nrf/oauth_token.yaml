# OAuth2 client-credentials token request.
#
# The NRF's token endpoint requires the requester nfInstanceId to be a
# registered NF (nrf/handler_token.go:71 "requester NF not registered" →
# 400), so the flow registers an SMF profile first, requests the token
# against that nfInstanceId, then deregisters as cleanup.
#
# Form-urlencoded body workaround: runner's REST enricher serializes the
# `body` field as JSON (RESTMessageProto.Body json.RawMessage), so raw
# application/x-www-form-urlencoded payloads cannot be authored. The NRF
# handler uses r.FormValue, which reads both URL query and form body, so
# the POST carries the grant_type / nfInstanceId / scope / targetNfType
# parameters in the URL query string with no request body. The wire
# behaviour is identical for r.FormValue's purposes.

kind: flow
name: nrf_oauth_token
description: Register SMF, issue OAuth2 client_credentials token, cleanup.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: RegisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-oauth-test.local",
                  "ipv4Addresses": ["10.0.0.20"],
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: rest.RegisterNF_Answer
        target: requesting_token
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: nfInstanceId
          - type: send
            message: GetToken
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{ue.Params.nfInstanceId}}",
                  "nfType": "SMF",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  requesting_token:
    transitions:
      - event: rest.GetToken_Answer
        target: cleaning_up
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body.token_type
            op: equals
            expected: Bearer
          - type: check
            field: rest.body.access_token
            op: not_empty
          - type: check
            field: rest.body.expires_in
            op: not_empty
          - type: send
            message: DeregisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.nfInstanceId}}"
              }

  cleaning_up:
    transitions:
      - event: rest.DeregisterNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
