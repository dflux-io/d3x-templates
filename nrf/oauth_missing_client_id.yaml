# OAUTH-05 — required form-parameter validation.
#
# Two negative sub-cases over the same registered consumer:
#   1. Omit nfInstanceId → 400 invalid_request
#   2. Omit nfType       → 400 invalid_request
#
# Catches a server that issues tokens with empty subject/audience
# claims, which downstream NFs would either reject or treat as
# wildcard (both are bad).
#
# Form-urlencoded body workaround: see comment in oauth_token.yaml.
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.4 OAUTH-05.

kind: flow
name: nrf_oauth_missing_client_id
description: Omit nfInstanceId → 400; omit nfType → 400 (both invalid_request).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: RegisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-oauth-missing-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: rest.RegisterNF_Answer
        target: probing_missing_instance_id
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: nfInstanceId
          - type: send
            message: GetTokenNoInstanceId
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfType": "SMF",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  probing_missing_instance_id:
    transitions:
      - event: rest.GetTokenNoInstanceId_Answer
        target: probing_missing_nf_type
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.body.error
            op: equals
            expected: invalid_request
          - type: send
            message: GetTokenNoNfType
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{ue.Params.nfInstanceId}}",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  probing_missing_nf_type:
    transitions:
      - event: rest.GetTokenNoNfType_Answer
        target: cleaning_up
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.body.error
            op: equals
            expected: invalid_request
          - type: send
            message: DeregisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.nfInstanceId}}"
              }

  cleaning_up:
    transitions:
      - event: rest.DeregisterNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
