# MTLS-04 — expired server cert rejected. See d3x-core
# docs/nrf/sanity-tests.md §4.7.7 (MTLS-04).
#
# The NRF is launched with a server cert whose validity window is in the
# past (CA-signed, SAN correct — only expiry is wrong). The client trusts
# the CA, so the sole failure is expiry. Asserted via the `Error` cause.

kind: flow
name: nrf_tls_handshake_expired_cert
description: Expired server cert → x509 expiry error (MTLS-04).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: getting
        actions:
          - type: send
            message: GetBstr
            peer: nrf-tls
            message_body: |
              {"method": "GET", "url": "/nnrf-bstr/v1/bootstrapping"}

  getting:
    transitions:
      - event: Error
        target: done
        actions:
          - type: check
            field: ue.LastError.Cause
            op: contains
            expected: "certificate has expired or is not yet valid"

  done: {}
  failed: {}
