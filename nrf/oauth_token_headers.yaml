# OAuth2 token response headers + unregistered-NF negative case.
#
# Asserts the two security headers RFC 6749 §5.1 / TS 29.510 mandate on
# every successful token response:
#   - Cache-Control: no-store
#   - Pragma:        no-cache
#
# Then exercises the negative path: an unregistered nfInstanceId must
# yield 400 + body.error == "invalid_client" (nrf/handler_token.go:71).
#
# Sequence: register SMF → token request (assert 200 + headers) → token
# request with a fresh unregistered UUID (assert 400 + error) →
# deregister SMF (cleanup).
#
# Form-urlencoded body workaround: see comment in oauth_token.yaml.

kind: flow
name: nrf_oauth_token_headers
description: Token positive (headers) + negative (unregistered NF).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: RegisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-oauth-hdr-test.local",
                  "ipv4Addresses": ["10.0.0.21"],
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: rest.RegisterNF_Answer
        target: token_positive
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: nfInstanceId
          - type: send
            message: GetTokenGood
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{ue.Params.nfInstanceId}}",
                  "nfType": "SMF",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  token_positive:
    transitions:
      - event: rest.GetTokenGood_Answer
        target: token_negative
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.headers.Cache-Control
            op: contains
            expected: "no-store"
          - type: check
            field: rest.headers.Pragma
            op: contains
            expected: "no-cache"
          - type: check
            field: rest.body.token_type
            op: equals
            expected: Bearer
          - type: send
            message: GetTokenBad
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-oauth/v1/oauth2/token",
                "query": {
                  "grant_type": "client_credentials",
                  "nfInstanceId": "{{$uuid}}",
                  "nfType": "SMF",
                  "scope": "nnrf-disc",
                  "targetNfType": "NRF"
                }
              }

  token_negative:
    transitions:
      - event: rest.GetTokenBad_Answer
        target: cleaning_up
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 400
          - type: check
            field: rest.body.error
            op: equals
            expected: invalid_client
          - type: send
            message: DeregisterNF
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.nfInstanceId}}"
              }

  cleaning_up:
    transitions:
      - event: rest.DeregisterNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
