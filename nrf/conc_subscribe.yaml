# CONC-06 — 100 concurrent subscription POSTs (Layer B burst).
#
# Subscriptions are the one NRF resource whose ID is SERVER-assigned (POST
# returns it in the Location header + body). Firing N=100 concurrent POSTs
# stresses whatever the NRF uses to mint those IDs: the invariant is that
# all 100 subscriptionIds are DISTINCT (a collision / counter race would
# hand two subscribers the same ID).
#
# Per-UE invariant checked here: 201 + Location + a non-empty
# subscriptionId. There is no GET-collection endpoint for subscriptions
# (only GET /subscriptions/{id}), so DISTINCTNESS is verified by the
# runner, which scrapes every subscriptions/<uuid> out of the burst's
# -trace output and asserts `sort -u | wc -l == 100`.
#
# Layer A counterpart: TestConcurrency_CONC06_DistinctSubscriptionIDs.

kind: flow
name: nrf_conc_subscribe
description: One subscription POST; burst N=100 for CONC-06 (distinct IDs).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: subscribing
        actions:
          - type: send
            message: Subscribe
            peer: nrf-peer
            message_body: |
              {
                "method": "POST",
                "url": "/nnrf-nfm/v1/subscriptions",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfStatusNotificationUri": "http://callback.conc.example.com/notify",
                  "validityTime": "2099-01-01T00:00:00Z"
                }
              }

  subscribing:
    transitions:
      - event: rest.Subscribe_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: check
            field: rest.headers.Location
            op: contains
            expected: "/nnrf-nfm/v1/subscriptions/"
          - type: check
            field: rest.body.subscriptionId
            op: not_empty

  done: {}
  failed: {}
