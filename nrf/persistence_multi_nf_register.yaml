# PERSIST-04 (flow A — register 5 NFs). See d3x-core
# docs/nrf/sanity-tests.md §2.14 and §4.7.6.
#
# Registers 5 distinct NFs with mixed nfTypes under fixed UUIDs, to catch
# truncation / partial-write bugs that only show at multi-row scale (a
# transaction that commits rows 1-3 but loses 4-5). The harness gives
# this pair its OWN fresh -db-dsn so the post-restart list count is
# exactly 5. Fixed UUIDs MUST match persistence_multi_nf_list.yaml.

kind: flow
name: nrf_persistence_multi_nf_register
description: Register 5 mixed-type NFs under fixed UUIDs (PERSIST-04 pre-restart).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [finished, failed]

states:
  start:
    transitions:
      - event: Start
        target: reg2
        actions:
          - type: send
            message: Reg1
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/aaaa0004-0000-4000-8000-000000000001",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "SMF", "nfStatus": "REGISTERED", "heartBeatTimer": 30, "fqdn": "smf-multi.local", "ipv4Addresses": ["10.0.4.1"], "plmnList": [{"mcc": "001", "mnc": "01"}]}
              }

  reg2:
    transitions:
      - event: rest.Reg1_Answer
        target: reg3
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg2
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/aaaa0004-0000-4000-8000-000000000002",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "AMF", "nfStatus": "REGISTERED", "heartBeatTimer": 30, "fqdn": "amf-multi.local", "ipv4Addresses": ["10.0.4.2"], "plmnList": [{"mcc": "001", "mnc": "01"}]}
              }

  reg3:
    transitions:
      - event: rest.Reg2_Answer
        target: reg4
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg3
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/aaaa0004-0000-4000-8000-000000000003",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "UPF", "nfStatus": "REGISTERED", "heartBeatTimer": 30, "fqdn": "upf-multi.local", "ipv4Addresses": ["10.0.4.3"], "plmnList": [{"mcc": "001", "mnc": "01"}]}
              }

  reg4:
    transitions:
      - event: rest.Reg3_Answer
        target: reg5
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg4
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/aaaa0004-0000-4000-8000-000000000004",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "PCF", "nfStatus": "REGISTERED", "heartBeatTimer": 30, "fqdn": "pcf-multi.local", "ipv4Addresses": ["10.0.4.4"], "plmnList": [{"mcc": "001", "mnc": "01"}]}
              }

  reg5:
    transitions:
      - event: rest.Reg4_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: send
            message: Reg5
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/aaaa0004-0000-4000-8000-000000000005",
                "headers": {"Content-Type": "application/json"},
                "body": {"nfType": "UDM", "nfStatus": "REGISTERED", "heartBeatTimer": 30, "fqdn": "udm-multi.local", "ipv4Addresses": ["10.0.4.5"], "plmnList": [{"mcc": "001", "mnc": "01"}]}
              }

  done:
    transitions:
      - event: rest.Reg5_Answer
        target: finished
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201

  finished: {}
  failed: {}
