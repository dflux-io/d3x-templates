# NFM-07 — DELETE on never-registered nfInstanceId returns 404 + ProblemDetails.
#
# Many implementations bug out and return 204 (success) for DELETE of a
# non-existent resource. That masks a class of bugs where the wrong UUID
# is being deleted in the field, because the caller sees success either
# way. Per d3x-core docs/nrf/sanity-tests.md §4.7.2 NFM-07.
#
# Uses an inline {{$uuid}} that has never been PUT. Same pattern as
# NFM-06; no setup, no cleanup.

kind: flow
name: nrf_nfm_delete_unknown
description: DELETE non-existent nfInstanceId → 404 + ProblemDetails (NOT 204).
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: probing
        actions:
          - type: send
            message: DeleteUnknownNF
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}"
              }

  probing:
    transitions:
      - event: rest.DeleteUnknownNF_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 404
          - type: check
            field: rest.headers.Content-Type
            op: contains
            expected: "application/problem+json"
          - type: check
            field: rest.body.status
            op: equals
            expected: 404
          - type: check
            field: rest.body.title
            op: not_empty

  done: {}
  failed: {}
