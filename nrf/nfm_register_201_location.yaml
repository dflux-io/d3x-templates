# 201-vs-200 distinction on register, plus Location header check.
#
# First PUT to a fresh UUID must return:
#   - status: 201 Created
#   - Location: …/nnrf-nfm/v1/nf-instances/<nfInstanceId>
#
# Second PUT to the SAME UUID (re-registration) must return:
#   - status: 200 OK (no Location)
#
# Cleanup deregisters the profile.
#
# Typed SBI: the RegisterNFInstance enricher mints a UUID on the first
# send and stores it on the UE, so the second PUT and the DELETE reuse
# the same path without a URL template.

kind: flow
name: nrf_nfm_register_201_location
description: Verify 201+Location on first PUT, 200 on second PUT same UUID.
type: client
protocol: sbi
nf: nrf
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: first_put
        actions:
          - type: send
            message: Nnrf_NFManagement_RegisterNFInstance
            peer: nrf-peer
            message_body: |
              {
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-201-test.local",
                  "ipv4Addresses": ["10.0.0.30"],
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  first_put:
    transitions:
      - event: sbi.Nnrf_NFManagement_RegisterNFInstance_Answer
        target: second_put
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: check
            field: sbi.headers.Location
            op: contains
            expected: "/nnrf-nfm/v1/nf-instances/"
          - type: extract
            field: sbi.body.nfInstanceId
            store: nfInstanceId
          - type: check
            field: ue.Params.nfInstanceId
            op: not_empty
          - type: send
            message: Nnrf_NFManagement_RegisterNFInstance
            peer: nrf-peer
            message_body: |
              {
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-201-test.local",
                  "ipv4Addresses": ["10.0.0.30"],
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  second_put:
    transitions:
      - event: sbi.Nnrf_NFManagement_RegisterNFInstance_Answer
        target: cleaning_up
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: send
            message: Nnrf_NFManagement_DeregisterNFInstance
            peer: nrf-peer

  cleaning_up:
    transitions:
      - event: sbi.Nnrf_NFManagement_DeregisterNFInstance_Answer
        target: done
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204

  done: {}
  failed: {}

final_checks:
  - name: the flow ended in done
    metric: final_state_counts.done
    op: greater_or_equal
    value: 1
  - name: it did not fail
    metric: final_state_counts.failed
    op: equals
    value: 0
  - name: two RegisterNFInstance PUTs went out (create then replace)
    metric: msg_types.tx.sbi.Nnrf_NFManagement_RegisterNFInstance
    op: equals
    value: 2
  - name: one DeregisterNFInstance DELETE went out
    metric: msg_types.tx.sbi.Nnrf_NFManagement_DeregisterNFInstance
    op: equals
    value: 1
  - name: two Register answers arrived
    metric: rx_events.sbi.Nnrf_NFManagement_RegisterNFInstance_Answer
    op: greater_or_equal
    value: 2
  - name: a Deregister answer arrived
    metric: rx_events.sbi.Nnrf_NFManagement_DeregisterNFInstance_Answer
    op: greater_or_equal
    value: 1
  - name: all five declared checks ran
    metric: checks_total
    op: equals
    value: 5
  - name: none of them failed
    metric: checks_failed
    op: equals
    value: 0
