# Full NFM lifecycle: PUT (register) → GET (fetch) → PATCH (heartbeat) → DELETE.
#
# The RegisterNFInstance enricher mints a fresh UUID on the first PUT and
# stores it on the UE, so GET / PATCH / DELETE reuse the same instance id
# without a URL template. Each transition asserts the HTTP status and then
# dispatches the next request, so the FSM only ever waits on a response event.
#
# Producer profile is the "minimal SMF" fixture from
# docs/nrf/sanity-tests.md §2.6.0 (d3x-core).

kind: flow
name: nrf_nfm_register_then_deregister
description: Register → fetch → heartbeat → deregister an SMF profile.
type: client
protocol: sbi
nf: nrf
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering
        actions:
          - type: send
            message: Nnrf_NFManagement_RegisterNFInstance
            peer: nrf-peer
            message_body: |
              {
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-test.local",
                  "ipv4Addresses": ["10.0.0.10"],
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering:
    transitions:
      - event: sbi.Nnrf_NFManagement_RegisterNFInstance_Answer
        target: fetching
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.body.nfInstanceId
            store: nfInstanceId
          - type: send
            message: Nnrf_NFManagement_GetNFInstance
            peer: nrf-peer

  fetching:
    transitions:
      - event: sbi.Nnrf_NFManagement_GetNFInstance_Answer
        target: heartbeating
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body.nfStatus
            op: equals
            expected: REGISTERED
          - type: check
            field: sbi.body.nfType
            op: equals
            expected: SMF
          - type: send
            message: Nnrf_NFManagement_UpdateNFInstance
            peer: nrf-peer
            message_body: |
              {
                "headers": {"Content-Type": "application/json-patch+json"},
                "body": [
                  {"op": "replace", "path": "/nfStatus", "value": "REGISTERED"}
                ]
              }

  heartbeating:
    transitions:
      - event: sbi.Nnrf_NFManagement_UpdateNFInstance_Answer
        target: deregistering
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: send
            message: Nnrf_NFManagement_DeregisterNFInstance
            peer: nrf-peer

  deregistering:
    transitions:
      - event: sbi.Nnrf_NFManagement_DeregisterNFInstance_Answer
        target: done
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204

  done: {}
  failed: {}

final_checks:
  - name: the flow ended in done
    metric: final_state_counts.done
    op: greater_or_equal
    value: 1
  - name: it did not fail
    metric: final_state_counts.failed
    op: equals
    value: 0
  - name: one RegisterNFInstance PUT went out
    metric: msg_types.tx.sbi.Nnrf_NFManagement_RegisterNFInstance
    op: equals
    value: 1
  - name: one GetNFInstance GET went out
    metric: msg_types.tx.sbi.Nnrf_NFManagement_GetNFInstance
    op: equals
    value: 1
  - name: one UpdateNFInstance PATCH went out
    metric: msg_types.tx.sbi.Nnrf_NFManagement_UpdateNFInstance
    op: equals
    value: 1
  - name: one DeregisterNFInstance DELETE went out
    metric: msg_types.tx.sbi.Nnrf_NFManagement_DeregisterNFInstance
    op: equals
    value: 1
  - name: a Register answer arrived
    metric: rx_events.sbi.Nnrf_NFManagement_RegisterNFInstance_Answer
    op: greater_or_equal
    value: 1
  - name: a Get answer arrived
    metric: rx_events.sbi.Nnrf_NFManagement_GetNFInstance_Answer
    op: greater_or_equal
    value: 1
  - name: an Update answer arrived
    metric: rx_events.sbi.Nnrf_NFManagement_UpdateNFInstance_Answer
    op: greater_or_equal
    value: 1
  - name: a Deregister answer arrived
    metric: rx_events.sbi.Nnrf_NFManagement_DeregisterNFInstance_Answer
    op: greater_or_equal
    value: 1
  - name: all six declared checks ran
    metric: checks_total
    op: equals
    value: 6
  - name: none of them failed
    metric: checks_failed
    op: equals
    value: 0
