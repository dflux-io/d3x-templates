# DISC-01 — core discovery filter matrix; monotonic narrowing demonstrated.
#
# Register fixtures (4 distinct profiles):
#   SMF_A — fqdn smf-alpha-disc-test.local, nfServices [nsmf-pdusession]
#   SMF_B — fqdn smf-beta-disc-test.local,  no nfServices
#   SMF_C — fqdn smf-gamma-disc-test.local, no nfServices
#   UDM_A — fqdn udm-alpha-disc-test.local
#
# Then probe two axes of narrowing:
#   1. target-nf-type=SMF → body contains SMF_A,B,C fqdns; NOT UDM_A
#   2. target-nf-type=SMF + service-names=nsmf-pdusession → contains
#      only SMF_A; NOT SMF_B, SMF_C, UDM_A (narrower filter excludes
#      profiles that lack the requested service).
#
# Catches a handler that ORs filters instead of ANDing them (would
# return more results, not fewer, when filters are added) or that
# silently drops the service-names filter (would return all 3 SMFs).
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.3 DISC-01.

kind: flow
name: nrf_disc_filter_matrix
description: target-nf-type + service-names filter matrix; monotonic narrowing.
type: client
protocol: rest
nf: external
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: registering_smf_a
        actions:
          - type: send
            message: RegisterSmfA
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-alpha-disc-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}],
                  "nfServices": [
                    {
                      "serviceInstanceId": "smf-alpha-svc-1",
                      "serviceName": "nsmf-pdusession",
                      "versions": [{"apiVersionInUri": "v1", "apiFullVersion": "1.0.0"}],
                      "scheme": "http",
                      "nfServiceStatus": "REGISTERED"
                    }
                  ]
                }
              }

  registering_smf_a:
    transitions:
      - event: rest.RegisterSmfA_Answer
        target: registering_smf_b
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: smfA
          - type: send
            message: RegisterSmfB
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-beta-disc-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering_smf_b:
    transitions:
      - event: rest.RegisterSmfB_Answer
        target: registering_smf_c
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: smfB
          - type: send
            message: RegisterSmfC
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "SMF",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "smf-gamma-disc-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering_smf_c:
    transitions:
      - event: rest.RegisterSmfC_Answer
        target: registering_udm_a
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: smfC
          - type: send
            message: RegisterUdmA
            peer: nrf-peer
            message_body: |
              {
                "method": "PUT",
                "url": "/nnrf-nfm/v1/nf-instances/{{$uuid}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "nfType": "UDM",
                  "nfStatus": "REGISTERED",
                  "heartBeatTimer": 30,
                  "fqdn": "udm-alpha-disc-test.local",
                  "plmnList": [{"mcc": "001", "mnc": "01"}],
                  "sNssais": [{"sst": 1, "sd": "010203"}]
                }
              }

  registering_udm_a:
    transitions:
      - event: rest.RegisterUdmA_Answer
        target: filtering_by_type
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: extract
            field: rest.body.nfInstanceId
            store: udmA
          - type: send
            message: DiscoverByType
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-disc/v1/nf-instances",
                "query": {"target-nf-type": "SMF", "requester-nf-type": "AMF"}
              }

  filtering_by_type:
    transitions:
      - event: rest.DiscoverByType_Answer
        target: filtering_by_service_name
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          # All 3 SMFs visible; UDM excluded by nf-type filter.
          - type: check
            field: rest.body
            op: contains
            expected: "smf-alpha-disc-test.local"
          - type: check
            field: rest.body
            op: contains
            expected: "smf-beta-disc-test.local"
          - type: check
            field: rest.body
            op: contains
            expected: "smf-gamma-disc-test.local"
          - type: check
            field: rest.body
            op: not_contains
            expected: "udm-alpha-disc-test.local"
          - type: send
            message: DiscoverByService
            peer: nrf-peer
            message_body: |
              {
                "method": "GET",
                "url": "/nnrf-disc/v1/nf-instances",
                "query": {
                  "target-nf-type": "SMF",
                  "requester-nf-type": "AMF",
                  "service-names": "nsmf-pdusession"
                }
              }

  filtering_by_service_name:
    transitions:
      - event: rest.DiscoverByService_Answer
        target: cleaning_up_smf_a
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          # Adding service-names narrows to SMF_A only (only it has the
          # service registered). Monotonic narrowing — fewer results, not
          # more, when an extra AND-filter is added.
          - type: check
            field: rest.body
            op: contains
            expected: "smf-alpha-disc-test.local"
          - type: check
            field: rest.body
            op: not_contains
            expected: "smf-beta-disc-test.local"
          - type: check
            field: rest.body
            op: not_contains
            expected: "smf-gamma-disc-test.local"
          - type: send
            message: DeregisterSmfA
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.smfA}}"
              }

  cleaning_up_smf_a:
    transitions:
      - event: rest.DeregisterSmfA_Answer
        target: cleaning_up_smf_b
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204
          - type: send
            message: DeregisterSmfB
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.smfB}}"
              }

  cleaning_up_smf_b:
    transitions:
      - event: rest.DeregisterSmfB_Answer
        target: cleaning_up_smf_c
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204
          - type: send
            message: DeregisterSmfC
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.smfC}}"
              }

  cleaning_up_smf_c:
    transitions:
      - event: rest.DeregisterSmfC_Answer
        target: cleaning_up_udm_a
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204
          - type: send
            message: DeregisterUdmA
            peer: nrf-peer
            message_body: |
              {
                "method": "DELETE",
                "url": "/nnrf-nfm/v1/nf-instances/{{ue.Params.udmA}}"
              }

  cleaning_up_udm_a:
    transitions:
      - event: rest.DeregisterUdmA_Answer
        target: done
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 204

  done: {}
  failed: {}
