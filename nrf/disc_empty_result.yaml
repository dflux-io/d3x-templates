# DISC-06 — empty collection on no-match → 200 + nfInstances: [].
#
# Catches the common mistake of returning 404 Not Found when no
# producer matches. Per REST conventions and TS 29.510, "no NWDAFs
# matched my filter" is a successful query with an empty result set;
# 404 means the endpoint itself doesn't exist.
#
# Query target type is NWDAF (no NWDAF is ever registered by this
# suite or its peers, so the result is reliably empty).
#
# Per d3x-core docs/nrf/sanity-tests.md §4.7.3 DISC-06.

kind: flow
name: nrf_disc_empty_result
description: "Filter matches zero producers → 200 + nfInstances:[]."
type: client
protocol: sbi
nf: nrf
initial_state: start
final_states: [done, failed]

states:
  start:
    transitions:
      - event: Start
        target: probing
        actions:
          - type: send
            message: Nnrf_NFDiscovery_SearchNFInstances
            peer: nrf-peer
            message_body: |
              {
                "query": {"target-nf-type": "NWDAF", "requester-nf-type": "AMF"}
              }

  probing:
    transitions:
      - event: sbi.Nnrf_NFDiscovery_SearchNFInstances_Answer
        target: done
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          # Body MUST contain an nfInstances array, even when empty.
          # exists (not contains-on-raw-body) is the typed-SBI equivalent of
          # the old rest.body substring guard: a handler that omits the key
          # when the slice is nil fails this check.
          - type: check
            field: sbi.body.nfInstances
            op: exists

  done: {}
  failed: {}

final_checks:
  - name: the flow ended in done
    metric: final_state_counts.done
    op: greater_or_equal
    value: 1
  - name: it did not fail
    metric: final_state_counts.failed
    op: equals
    value: 0
  - name: one SearchNFInstances GET went out
    metric: msg_types.tx.sbi.Nnrf_NFDiscovery_SearchNFInstances
    op: equals
    value: 1
  - name: a Search answer arrived
    metric: rx_events.sbi.Nnrf_NFDiscovery_SearchNFInstances_Answer
    op: greater_or_equal
    value: 1
  - name: both declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: none of them failed
    metric: checks_failed
    op: equals
    value: 0
