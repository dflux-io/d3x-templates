# Nausf_UEAuthentication — UE Authentication initiation, 5G-AKA (compliance).
# 3GPP TS 29.509 §5.2.2.2 / §6.1.3.2.3.1 (POST /nausf-auth/v1/ue-authentications).
# runner (consumer, acting as the AMF) drives a real Open5GS AUSF and asserts the
# spec-correct positive outcome: 201 Created, authType 5G_AKA, a confirmation
# link, and a Location header pointing at the created authentication context.

kind: flow
name: ausf_ueauth_5g_aka_initiate_success
description: POST ue-authentications for a provisioned SUPI returns 201 with a 5G-AKA auth context
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: check
            field: sbi.body.authType
            op: equals
            expected: 5G_AKA
          - type: check
            field: sbi.body._links.5g-aka.href
            op: exists
          - type: check
            field: sbi.headers.Location
            op: not_empty
