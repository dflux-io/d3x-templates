# Nausf_UEAuthentication — confirmation on an unknown authCtxId (security / negative).
# 3GPP TS 29.509 §6.1.3.3 / §6.1.7.3 (404 CONTEXT_NOT_FOUND).
# runner PUTs a 5g-aka-confirmation to a fabricated authCtxId that the AUSF never
# created. The AUSF must REJECT with 404 + ProblemDetails and STAY UP. No prior
# initiate needed — the whole point is that the context does not exist.

kind: flow
name: ausf_ueauth_confirmation_unknown_ctx_rejected
description: 5g-aka-confirmation PUT against a non-existent authCtxId is rejected 404
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf
            message_body: |
              {
                "method": "PUT",
                "path": "/nausf-auth/v1/ue-authentications/00000000-0000-0000-0000-000000000000/5g-aka-confirmation",
                "body": {
                  "resStar": "00112233445566778899aabbccddeeff"
                }
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
