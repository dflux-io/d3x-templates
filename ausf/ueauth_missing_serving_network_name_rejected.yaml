# Nausf_UEAuthentication — missing mandatory IE servingNetworkName (security / negative).
# 3GPP TS 29.509 §6.1.6.2.2; §6.1.7.3 (400, MANDATORY_IE_MISSING).
# runner sends an initiate body that OMITS the mandatory servingNetworkName entirely.
# Sent via the generic SBI_Request raw body so the field is genuinely absent on
# the wire (not coerced to a zero-value by the typed model). The AUSF must REJECT
# with 400 + ProblemDetails and STAY UP.

kind: flow
name: ausf_ueauth_missing_serving_network_name_rejected
description: POST ue-authentications omitting servingNetworkName is rejected 400
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf
            message_body: |
              {
                "method": "POST",
                "path": "/nausf-auth/v1/ue-authentications",
                "raw_body": "{\"supiOrSuci\":\"imsi-001010000000001\"}"
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
          - type: check
            field: sbi.body.cause
            op: exists
