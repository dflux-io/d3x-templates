# Nausf_UEAuthentication — wrong RES* on confirmation (security / negative).
# 3GPP TS 29.509 §6.1.3.3.3.1; TS 33.501 §6.1.3.2 (RES* verification fails).
# Chained: initiate (POST) -> extract context Location -> PUT a deliberately
# wrong RES* to the 5g-aka-confirmation resource via the generic SBI_Request.
# The AUSF must report authResult AUTHENTICATION_FAILURE (200 with the failure
# result, per 29.509) and STAY UP — never report SUCCESS.

kind: flow
name: ausf_ueauth_wrong_res_star_failure
description: Confirmation with a wrong RES* yields AUTHENTICATION_FAILURE, AUSF stays up
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_initiate
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_initiate:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: wait_confirmation
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: authCtxLocation
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "PUT",
                "path": "{{ue.Params.authCtxLocation}}/5g-aka-confirmation",
                "body": {
                  "resStar": "ffffffffffffffffffffffffffffffff"
                }
              }

  wait_confirmation:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          # AUSF answers the confirmation but must NOT report success: either a
          # 200 with authResult=AUTHENTICATION_FAILURE or a 4xx.
          - type: check
            field: sbi.body.authResult
            op: not_contains
            expected: AUTHENTICATION_SUCCESS
