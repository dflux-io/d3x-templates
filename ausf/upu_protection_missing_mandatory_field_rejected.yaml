# Nausf_UPUProtection — missing mandatory field (security / negative).
# 3GPP TS 29.509 §6.3.6.2.2; §6.3.7.3 (400 MANDATORY_IE_MISSING).
# runner POSTs ue-upu with a body that OMITS the mandatory upuDataList (raw_body so
# it is genuinely absent). The AUSF must REJECT with 400 + ProblemDetails and
# STAY UP.

kind: flow
name: ausf_upu_protection_missing_mandatory_field_rejected
description: POST ue-upu omitting upuDataList is rejected 400
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf
            message_body: |
              {
                "method": "POST",
                "path": "/nausf-upuprotection/v1/imsi-001010000000001/ue-upu",
                "raw_body": "{\"upuAckInd\":false}"
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
