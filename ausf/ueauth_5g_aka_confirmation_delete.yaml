# Nausf_UEAuthentication — DELETE the authentication result (compliance, runtime-risk).
# 3GPP TS 29.509 §5.2.2.5 / §6.1.3.3
#   (DELETE /nausf-auth/v1/ue-authentications/{authCtxId}/5g-aka-confirmation).
# Chained: initiate (POST) -> extract context Location -> DELETE the
# confirmation sub-resource. DELETE is now issuable via the generic SBI_Request.
# The AUSF removes the stored authentication result and answers 204 No Content.
#
# RUNTIME RISK: Open5GS may not implement the optional DELETE on this resource
# (it is OM/operator-facing and frequently unsupported). The flow is structurally
# correct; terminal `released` means the AUSF answered the DELETE (204 expected,
# but 404/405 against a real core is a core gap, not a flow bug — sorted live).

kind: flow
name: ausf_ueauth_5g_aka_confirmation_delete
description: Initiate 5G-AKA then DELETE the 5g-aka-confirmation resource (expect 204)
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - released
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_initiate
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_initiate:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: wait_delete
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: authCtxLocation
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "DELETE",
                "path": "{{ue.Params.authCtxLocation}}/5g-aka-confirmation"
              }

  wait_delete:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: released
        actions:
          - type: check
            field: sbi.status
            op: exists
