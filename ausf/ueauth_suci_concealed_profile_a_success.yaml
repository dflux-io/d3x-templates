# Nausf_UEAuthentication — initiation with a concealed SUCI (Profile A) (compliance).
# 3GPP TS 29.509 §6.1.3.2.3.1; TS 33.501 §6.12 / Annex C (SUCI / ECIES Profile A).
# runner supplies a pre-formed concealed SUCI string verbatim (runner does NOT conceal /
# de-conceal — the AUSF + UDM/SIDF do that on the wire). The AUSF must accept it
# and return a 5G-AKA auth context (201). Requires the matching home-network key /
# subscriber provisioned in the Open5GS UDM for de-conceal to succeed (lab
# provisioning, not an runner gap) — terminal kept to completed.

kind: flow
name: ausf_ueauth_suci_concealed_profile_a_success
description: POST ue-authentications with a Profile-A concealed SUCI returns 201 5G-AKA
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "suci-0-001-01-0000-0-0-0000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: check
            field: sbi.body.authType
            op: equals
            expected: 5G_AKA
