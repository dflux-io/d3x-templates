# Nausf_UEAuthentication — 5G-AKA confirmation (compliance, runtime-risk).
# 3GPP TS 29.509 §5.2.2.3 / §6.1.3.3.3.1
#   (PUT /nausf-auth/v1/ue-authentications/{authCtxId}/5g-aka-confirmation).
# Chained: initiate (POST) -> extract the created context Location -> PUT the
# ConfirmationData{resStar} to that resource. Now sendable end-to-end via the
# generic SBI_Request (arbitrary method PUT + templated path).
#
# RES*: Runik derives it as the UE would (TS 33.501 Annex A.4) from the
# 5gAuthData RAND/AUTN of the initiate answer and the UE subscriber K/OPc
# (-s, or the subscriber seed), into ue.Params.auth_res_star (d3x#1636). The
# subscriber must be the SUPI the flow names, with the keys the UDR holds;
# otherwise AUTN fails its MAC check, no RES* is set and the flow fails.
# A successful run leaves K_AUSF live in the AUSF for the SoR/UPU flows.

kind: flow
name: ausf_ueauth_5g_aka_confirmation
description: Initiate 5G-AKA, derive RES* from the answer and PUT the 5g-aka-confirmation; AUTHENTICATION_SUCCESS
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_initiate
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_initiate:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: wait_confirmation
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          # Location points at .../ue-authentications/{authCtxId}; the
          # confirmation resource is that path + /5g-aka-confirmation.
          - type: extract
            field: sbi.headers.Location
            store: authCtxLocation
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "PUT",
                "path": "{{ue.Params.authCtxLocation}}/5g-aka-confirmation",
                "body": {
                  "resStar": "{{ue.Params.auth_res_star}}"
                }
              }

  wait_confirmation:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body.authResult
            op: equals
            expected: AUTHENTICATION_SUCCESS
