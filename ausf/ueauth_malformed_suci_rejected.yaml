# Nausf_UEAuthentication — malformed SUCI (security / negative).
# 3GPP TS 29.509 §6.1.3.2 / §6.1.7.3 (400); TS 23.003 §2.2B (SUCI format).
# runner sends a structurally-invalid supiOrSuci. The AUSF must REJECT with 400 +
# ProblemDetails and STAY UP. Sent via the generic SBI_Request so the on-wire
# value is fully controlled (no typed-model coercion).

kind: flow
name: ausf_ueauth_malformed_suci_rejected
description: POST ue-authentications with a malformed SUCI string is rejected 400
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf
            message_body: |
              {
                "method": "POST",
                "path": "/nausf-auth/v1/ue-authentications",
                "body": {
                  "supiOrSuci": "suci-not-a-valid-suci-@@@",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
          - type: check
            field: sbi.body.cause
            op: exists
