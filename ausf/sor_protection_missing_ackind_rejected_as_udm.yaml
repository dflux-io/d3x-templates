# Nausf_SoRProtection — missing mandatory ackInd (security / negative).
# 3GPP TS 29.509 §6.2.6.2.2; §6.2.7.3 (400 MANDATORY_IE_MISSING).
# Runik POSTs ue-sor with a body that OMITS the mandatory ackInd (raw_body so it is
# genuinely absent). The AUSF must REJECT with 400 + ProblemDetails and STAY UP.
#
# THE UDM VARIANT. TS 29.509 §4.1 makes the UDM the consumer of
# Nausf_SoRProtection, so an AUSF that checks the caller's NF type answers any
# other consumer 403 before it reads the body. This copy sends through the
# `ausf_udm` binding, which a config gives a UDM credential
# (tinycore/deploy/lab/config/lab-pentest-sbi.yaml). pentest-sbi runs this
# variant so the probe reaches the body check. The plain flow (peer `ausf`)
# stays in ausf-security and ausf-compliance, which also run against cores with
# no OAuth2. Keep the two in step.

kind: flow
name: ausf_sor_protection_missing_ackind_rejected_as_udm
description: POST ue-sor omitting ackInd is rejected 400 (sent as the UDM)
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf_udm
            message_body: |
              {
                "method": "POST",
                "path": "/nausf-sorprotection/v1/imsi-001010000000001/ue-sor",
                "raw_body": "{\"steeringInfoList\":[{\"plmnId\":{\"mcc\":\"001\",\"mnc\":\"01\"}}]}"
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
