# Nausf_UEAuthentication — confirmation on a stale (deleted) context (security / negative).
# 3GPP TS 29.509 §6.1.3.3; TS 33.501 §6.1.3.2.
# Chained: initiate (POST) -> extract context Location -> DELETE the confirmation
# resource -> PUT a confirmation to the now-stale authCtxId. The AUSF must REJECT
# the late confirmation (404 / 403) and STAY UP — it must not resurrect a deleted
# authentication context. Liveness is the cross-cutting signal (terminal
# `tolerated`): any well-formed answer to the stale PUT proves the AUSF survived.
#
# RUNTIME RISK: Open5GS may not implement the optional DELETE on this resource;
# if the DELETE answers 404/405 the stale PUT still exercises the late-confirm
# path. Both arms are sorted by the live run.

kind: flow
name: ausf_ueauth_stale_ctx_liveness_rejected
description: Confirmation after the context was deleted is rejected; AUSF stays up
category: negative
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_initiate
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            peer: ausf
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_initiate:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: wait_delete
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: authCtxLocation
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "DELETE",
                "path": "{{ue.Params.authCtxLocation}}/5g-aka-confirmation"
              }

  wait_delete:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_stale_confirm
        actions:
          # Whatever the DELETE returns, now confirm against the stale context.
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "PUT",
                "path": "{{ue.Params.authCtxLocation}}/5g-aka-confirmation",
                "body": {
                  "resStar": "00112233445566778899aabbccddeeff"
                }
              }

  wait_stale_confirm:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: tolerated
        actions:
          # AUSF must not report success on a stale context; an answer at all
          # (4xx, or a non-success authResult) proves liveness.
          - type: check
            field: sbi.status
            op: exists
          - type: check
            field: sbi.body.authResult
            op: not_contains
            expected: AUTHENTICATION_SUCCESS
