# Nausf_SoRProtection — Steering of Roaming information protection (compliance, runtime-risk).
# 3GPP TS 29.509 §5.3.2.2 / §6.2.3.2 (POST /nausf-sorprotection/v1/{supi}/ue-sor);
# TS 33.501 §6.14. runner (consumer, acting as the UDM) drives a real Open5GS AUSF
# via the generic SBI_Request and asserts a 200 SorSecurityInfo (sorMacIausf).
#
# RUNTIME RISK: this needs the K_AUSF for {supi} present in the AUSF's state — in
# 33.501 the AUSF derives sorMacIausf from K_AUSF established during a prior
# successful primary authentication. Issuing SoR for a SUPI with no live K_AUSF
# yields a 403/404 from a real core. Terminal `protected` = the AUSF answered the
# SoR request; the live run sorts a genuine core/provisioning gap from a flow bug.

kind: flow
name: ausf_sor_protection_success
description: POST ue-sor returns 200 with protected Steering-of-Roaming security info
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - protected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: ausf
            message_body: |
              {
                "method": "POST",
                "path": "/nausf-sorprotection/v1/imsi-001010000000001/ue-sor",
                "body": {
                  "steeringInfoList": [
                    {"plmnId": {"mcc": "001", "mnc": "01"}}
                  ],
                  "ackInd": false
                }
              }

  wait_response:
    on_timeout:
      duration: 8s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: protected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body.sorMacIausf
            op: exists
