# Nudm_UEAU GenerateAuthData without servingNetworkName — security/negative.
# 3GPP TS 29.503 §6.3.6.2; TS 29.500 MANDATORY_IE_MISSING (400).
# The body marshals fine but omits a mandatory IE; UDM must reject with 400 and stay live.

kind: flow
name: udm_ueau_generate_auth_data_missing_serving_network
description: POST generate-auth-data without servingNetworkName is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_UEAuthentication_GetAuthData
            peer: udm
            message_body: |
              {
                "path": "/nudm-ueau/v1/imsi-001010000000001/security-information/generate-auth-data",
                "body": {
                  "ausfInstanceId": "11111111-2222-3333-4444-555555555555"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nudm_UEAuthentication_GetAuthData_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
