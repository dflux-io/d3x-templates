# Nudm_UEAU GenerateAuthData for an unknown SUPI — security/negative.
# 3GPP TS 29.503 §6.3.7.3 (USER_NOT_FOUND; 404).
# UDM must reject auth-data generation for an unprovisioned subscriber and stay live.

kind: flow
name: udm_ueau_generate_auth_data_unknown_supi
description: POST generate-auth-data for an unprovisioned SUPI is rejected with 4xx
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_UEAuthentication_GetAuthData
            peer: udm
            message_body: |
              {
                "path": "/nudm-ueau/v1/imsi-999999999999999/security-information/generate-auth-data",
                "body": {
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org",
                  "ausfInstanceId": "11111111-2222-3333-4444-555555555555"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nudm_UEAuthentication_GetAuthData_Answer
        target: rejected
        actions:
          # 404 USER_NOT_FOUND (or 403 family) — any 4xx rejection.
          - type: check
            field: sbi.status
            op: greater_than
            expected: 399
          # No auth material is leaked in the error body.
          - type: check
            field: sbi.body
            op: not_contains
            expected: authenticationVector
