# Nudm_UECM AMF 3GPP-access Get with no stored registration — security/negative.
# 3GPP TS 29.503 §6.2.7.3 (CONTEXT_NOT_FOUND / 404).
# GET amf-3gpp-access for a SUPI with no AMF registration — UDM must return 404
# and stay live. Uses SBI_Request GET — unlocked by the new generic SBI message.

kind: flow
name: udm_uecm_amf_3gpp_get_no_context
description: GET amf-3gpp-access with no registered context is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-uecm/v1/imsi-001019999999999/registrations/amf-3gpp-access"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
