# Nudm_PP Update with a malformed/invalid-JSON patch body — security/negative.
# 3GPP TS 29.503 §6.5.6.2; TS 29.500 INVALID_MSG_FORMAT (400).
# Uses SBI_Request raw_body (verbatim, unparsed) so genuinely malformed JSON
# reaches the wire — unlocked by the new generic SBI message.
# UDM must reject the malformed patch and stay live.

kind: flow
name: udm_pp_update_malformed_patch
description: PATCH pp-data with non-JSON raw_body is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PATCH",
                "path": "/nudm-pp/v1/imsi-001010000000001/pp-data",
                "headers": {"Content-Type": "application/json-patch+json"},
                "raw_body": "[{ \"op\": \"replace\", broken json here"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
