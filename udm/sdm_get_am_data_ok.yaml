# Nudm_SDM Get AccessAndMobility subscription data — compliance.
# 3GPP TS 29.503 §6.1.3.2.3 / §5.2.2.2 (GET /nudm-sdm/v2/{supi}/am-data).
# runner (consumer) drives a real Open5GS UDM; expects 200 + AM subscription data.

kind: flow
name: udm_sdm_get_am_data_ok
description: GET am-data for a provisioned SUPI returns 200 with AccessAndMobilitySubscriptionData
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_SDM_GetSubscriptionData
            peer: udm
            message_body: |
              {
                "path": "/nudm-sdm/v2/imsi-001010000000001/am-data",
                "query": {"plmn-id": "{\"mcc\":\"001\",\"mnc\":\"01\"}"}
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nudm_SDM_GetSubscriptionData_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
