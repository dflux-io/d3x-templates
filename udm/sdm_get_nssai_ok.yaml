# Nudm_SDM Get slice selection (NSSAI) subscription data — compliance.
# 3GPP TS 29.503 §6.1.3.7 (GET /nudm-sdm/v2/{supi}/nssai).
# runner drives a real UDM; expects 200 with Nssai (defaultSingleNssais).

kind: flow
name: udm_sdm_get_nssai_ok
description: GET nssai for a provisioned SUPI returns 200
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-sdm/v2/imsi-001010000000001/nssai",
                "query": {"plmn-id": "{\"mcc\":\"001\",\"mnc\":\"01\"}"}
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
