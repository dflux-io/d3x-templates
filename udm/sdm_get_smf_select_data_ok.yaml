# Nudm_SDM Get SMF Selection subscription data — compliance.
# 3GPP TS 29.503 §6.1.3.4 (GET /nudm-sdm/v2/{supi}/smf-select-data).
# runner drives a real UDM; expects 200 with SmfSelectionSubscriptionData.

kind: flow
name: udm_sdm_get_smf_select_data_ok
description: GET smf-select-data for a provisioned SUPI returns 200
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-sdm/v2/imsi-001010000000001/smf-select-data",
                "query": {"plmn-id": "{\"mcc\":\"001\",\"mnc\":\"01\"}"}
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
