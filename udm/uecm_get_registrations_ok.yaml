# Nudm_UECM Get all registrations for a UE — compliance.
# 3GPP TS 29.503 §6.2.3.20 (GET /nudm-uecm/v1/{ueId}/registrations).
# Uses SBI_Request GET — unlocked by the new generic SBI message.

kind: flow
name: udm_uecm_get_registrations_ok
description: GET {ueId}/registrations returns 200 with the UE's registration context
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
