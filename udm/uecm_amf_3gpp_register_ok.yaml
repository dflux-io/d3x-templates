# Nudm_UECM AMF 3GPP-access Registration — compliance.
# 3GPP TS 29.503 §6.2.3.2 / §5.3.2.2
#   (PUT /nudm-uecm/v1/{ueId}/registrations/amf-3gpp-access, Amf3GppAccessRegistration).
# Uses SBI_Request PUT — unlocked by the new generic SBI message (PUT and the
# UECM operations were previously unavailable from YAML).

kind: flow
name: udm_uecm_amf_3gpp_register_ok
description: PUT amf-3gpp-access registration returns 201/200/204
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - registered
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations/amf-3gpp-access",
                "body": {
                  "amfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "deregCallbackUri": "http://127.0.0.1:7777/dereg",
                  "guami": {
                    "plmnId": {"mcc": "001", "mnc": "01"},
                    "amfId": "020040"
                  },
                  "ratType": "NR"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: registered
        actions:
          # PUT create/replace returns 201 (created) or 200/204 (replaced).
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
