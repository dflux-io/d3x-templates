# Nudm_PP Update for an unprovisioned UE — security/negative.
# 3GPP TS 29.503 §6.5.7.3 (USER_NOT_FOUND; 404).
# UDM must reject pp-data update for an unknown subscriber and stay live.
# Uses SBI_Request PATCH — unlocked by the new generic SBI message.

kind: flow
name: udm_pp_update_unknown_ue
description: PATCH pp-data for an unprovisioned UE is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PATCH",
                "path": "/nudm-pp/v1/imsi-999999999999999/pp-data",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "communicationCharacteristics": {
                    "ppSubsRegTimer": {"subsRegTimer": 3600, "afInstanceId": "af1", "referenceId": 1}
                  }
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
