# Nudm_UECM SMF Deregistration (register-then-deregister) — compliance (multi-step).
# 3GPP TS 29.503 §6.2.3.8
#   (DELETE /nudm-uecm/v1/{ueId}/registrations/smf-registrations/{pduSessionId}).
# PUT to establish the SMF registration, then DELETE it. Both legs via
# SBI_Request — unlocked by the new generic SBI message (PUT/DELETE + UECM op).

kind: flow
name: udm_uecm_smf_dereg_ok
description: PUT smf-registrations/{id} then DELETE returns 204
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_register
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations/smf-registrations/1",
                "body": {
                  "smfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "pduSessionId": 1,
                  "singleNssai": {"sst": 1, "sd": "010203"},
                  "dnn": "internet",
                  "plmnId": {"mcc": "001", "mnc": "01"}
                }
              }

  wait_register:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_dereg
        actions:
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "DELETE",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations/smf-registrations/1"
              }

  wait_dereg:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
