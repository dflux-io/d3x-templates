# Nudm_UEAU ConfirmAuth with mandatory AuthEvent fields omitted — security/negative.
# 3GPP TS 29.503 §6.3.6.2; TS 29.500 MANDATORY_IE_MISSING (400).
# AuthEvent missing nfInstanceId/success/timeStamp/authType; UDM must reject with 400 and stay live.

kind: flow
name: udm_ueau_confirm_auth_missing_fields
description: POST auth-events with an incomplete AuthEvent is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-ueau/v1/imsi-001010000000001/auth-events",
                "body": {
                  "success": true
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
