# Nudm_EE Create subscription with an invalid eventType — security/negative.
# 3GPP TS 29.503 §6.4.6.x; TS 29.500 MANDATORY_IE_INCORRECT (400).
# UDM must reject an EeSubscription with an out-of-enum eventType and stay live.
# Uses SBI_Request POST — unlocked by the new generic SBI message.

kind: flow
name: udm_ee_create_subscription_invalid_event_type
description: POST ee-subscriptions with an invalid eventType is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-ee/v1/imsi-001010000000001/ee-subscriptions",
                "body": {
                  "callbackReference": "http://127.0.0.1:7777/ee-notify",
                  "monitoringConfigurations": {
                    "0": {"eventType": "NOT_A_REAL_EVENT_TYPE"}
                  }
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
