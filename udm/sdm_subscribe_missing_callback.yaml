# Nudm_SDM Subscribe with the mandatory callbackReference omitted — security/negative.
# 3GPP TS 29.503 §6.1.6.2; TS 29.500 MANDATORY_IE_MISSING.
# UDM must reject an SdmSubscription lacking callbackReference with 400 and stay live.

kind: flow
name: udm_sdm_subscribe_missing_callback
description: POST sdm-subscriptions without callbackReference is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-sdm/v2/imsi-001010000000001/sdm-subscriptions",
                "body": {
                  "nfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "monitoredResourceUris": ["http://example/am-data"]
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
