# Nudm_SDM Modify (PATCH) an existing sdm-subscription — compliance (multi-step).
# 3GPP TS 29.503 §6.1.3.10 (PATCH {ueId}/sdm-subscriptions/{id} with SdmSubsModification).
# Subscribe -> extract Location -> PATCH. Uses SBI_Request (POST then PATCH with
# JSON-merge SdmSubsModification body) — unlocked by the new generic SBI message.

kind: flow
name: udm_sdm_modify_subscription_ok
description: POST sdm-subscriptions (201) then PATCH the subscription (200/204)
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_subscribe
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-sdm/v2/imsi-001010000000001/sdm-subscriptions",
                "body": {
                  "nfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "callbackReference": "http://127.0.0.1:7777/sdm-notify",
                  "monitoredResourceUris": ["http://example/am-data"]
                }
              }

  wait_subscribe:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_modify
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: sdmSubRef
          - type: send
            message: SBI_Request
            message_body: |
              {
                "method": "PATCH",
                "path": "{{ue.Params.sdmSubRef}}",
                "headers": {"Content-Type": "application/json"},
                "body": {
                  "expiry": "2030-01-01T00:00:00Z"
                }
              }

  wait_modify:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          # PATCH returns 200 (with body) or 204 (no content) on success.
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
