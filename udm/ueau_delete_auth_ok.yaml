# Nudm_UEAU DeleteAuth — compliance.
# 3GPP TS 29.503 §6.3.3.4 (PUT /nudm-ueau/v1/{supi}/auth-events/{authEventId}).
# The DeleteAuth operation is modelled in TS 29.503 as a PUT that removes the
# stored auth status. Uses SBI_Request PUT with an AuthEvent body — unlocked by
# the new generic SBI message (PUT was previously unsupported from YAML).

kind: flow
name: udm_ueau_delete_auth_ok
description: PUT auth-events/{id} clearing the stored auth status returns 2xx
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-ueau/v1/imsi-001010000000001/auth-events/5G_AKA",
                "body": {
                  "nfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "success": false,
                  "timeStamp": "2026-06-05T00:00:00Z",
                  "authType": "5G_AKA",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org",
                  "authRemovalInd": true
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
