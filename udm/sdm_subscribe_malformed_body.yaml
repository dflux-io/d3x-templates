# Nudm_SDM Subscribe with a truncated/invalid-JSON body — security/negative.
# 3GPP TS 29.500 §5.2.7.2 (INVALID_MSG_FORMAT for unparseable payloads).
# Uses SBI_Request raw_body (verbatim, unparsed) so genuinely malformed JSON
# reaches the wire — unlocked by the new generic SBI message.
# UDM must reject the malformed body with 400 and stay live.

kind: flow
name: udm_sdm_subscribe_malformed_body
description: POST sdm-subscriptions with non-JSON raw_body is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-sdm/v2/imsi-001010000000001/sdm-subscriptions",
                "raw_body": "{ this is : not valid json"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
