# Nudm_SDM Get am-data with a malformed SUPI path segment — security/negative.
# 3GPP TS 29.503 §6.1.3.2.3; TS 29.571 Supi pattern (INVALID_MSG_FORMAT).
# UDM must reject a syntactically invalid SUPI with 4xx and remain live.

kind: flow
name: udm_sdm_get_am_data_malformed_supi
description: GET am-data with a malformed SUPI segment is rejected with 4xx
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_SDM_GetSubscriptionData
            peer: udm
            message_body: |
              {
                "path": "/nudm-sdm/v2/imsi-XYZ-not-a-supi/am-data"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      # Spec-correct: a 4xx (400 INVALID_MSG_FORMAT / 404) rejection.
      - event: sbi.Nudm_SDM_GetSubscriptionData_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: greater_than
            expected: 399
