# Nudm_UECM AMF Registration with the mandatory guami omitted — security/negative.
# 3GPP TS 29.503 §6.2.6.2; TS 29.500 MANDATORY_IE_MISSING (400).
# UDM must reject an Amf3GppAccessRegistration lacking guami with 400 and stay live.

kind: flow
name: udm_uecm_amf_3gpp_register_missing_guami
description: PUT amf-3gpp-access without guami is rejected with 400
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations/amf-3gpp-access",
                "body": {
                  "amfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "deregCallbackUri": "http://127.0.0.1:7777/dereg",
                  "ratType": "NR"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
