# Nudm_UEAU GenerateAuthData with a malformed SUCI in the path — security/negative.
# 3GPP TS 29.503 §6.3.3.2; TS 29.571 Suci pattern (400 / 403).
# A bad protection-scheme/HNPKI SUCI is injected via the path; body stays valid.
# UDM must reject the malformed SUCI and stay live.

kind: flow
name: udm_ueau_generate_auth_data_malformed_suci
description: POST generate-auth-data with a malformed SUCI path is rejected with 4xx
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_UEAuthentication_GetAuthData
            peer: udm
            message_body: |
              {
                "path": "/nudm-ueau/v1/suci-0-001-01-0-99-0-deadbeefnotvalid/security-information/generate-auth-data",
                "body": {
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org",
                  "ausfInstanceId": "11111111-2222-3333-4444-555555555555"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nudm_UEAuthentication_GetAuthData_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: greater_than
            expected: 399
