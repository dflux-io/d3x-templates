# Nudm_EE Delete an unknown event-exposure subscription — security/negative.
# 3GPP TS 29.503 §6.4.7.3 (SUBSCRIPTION_NOT_FOUND; 404).
# DELETE ee-subscriptions/{id} for a non-existent id — UDM must return 404 and
# stay live. Uses SBI_Request DELETE — unlocked by the new generic SBI message.

kind: flow
name: udm_ee_delete_subscription_unknown
description: DELETE an unknown ee-subscription id is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "DELETE",
                "path": "/nudm-ee/v1/imsi-001010000000001/ee-subscriptions/does-not-exist-0000"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
