# Nudm_UEAU ConfirmAuth (auth result) — compliance.
# 3GPP TS 29.503 §6.3.3.3 / §5.4.2.3 (POST /nudm-ueau/v1/{supi}/auth-events).
# Uses SBI_Request POST with a typed AuthEvent body — unlocked by the new
# generic SBI message (the typed UEAU enricher carries AuthenticationInfoRequest
# only, so AuthEvent must travel via SBI_Request.body).

kind: flow
name: udm_ueau_confirm_auth_ok
description: POST auth-events recording a successful authentication returns 201
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "POST",
                "path": "/nudm-ueau/v1/imsi-001010000000001/auth-events",
                "body": {
                  "nfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "success": true,
                  "timeStamp": "2026-06-05T00:00:00Z",
                  "authType": "5G_AKA",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          # ConfirmationData creates an auth-event resource (201) — accept 2xx.
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
