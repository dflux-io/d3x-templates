# Nudm_UECM SMF Registration for an unprovisioned SUPI — security/negative.
# 3GPP TS 29.503 §6.2.7.3 (USER_NOT_FOUND; 404/403).
# PUT smf-registrations/{id} for an unknown subscriber — UDM must reject the
# registration (SubscriberExists gate) and stay live, mirroring the AMF
# 3GPP-access register-unknown-supi negative.

kind: flow
name: udm_uecm_smf_register_unknown_supi
description: PUT smf-registrations for an unprovisioned SUPI is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-uecm/v1/imsi-999999999999999/registrations/smf-registrations/1",
                "body": {
                  "smfInstanceId": "11111111-2222-3333-4444-555555555555",
                  "pduSessionId": 1,
                  "singleNssai": {"sst": 1, "sd": "010203"},
                  "dnn": "internet",
                  "plmnId": {"mcc": "001", "mnc": "01"}
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
