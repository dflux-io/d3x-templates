# Nudm_UECM SMF Deregistration of an unknown PDU session — security/negative.
# 3GPP TS 29.503 §6.2.7.3 (CONTEXT_NOT_FOUND / 404).
# DELETE smf-registrations/{id} for a session with no registration — UDM must
# return 404 and stay live. Uses SBI_Request DELETE — unlocked by the new
# generic SBI message.

kind: flow
name: udm_uecm_smf_dereg_unknown_session
description: DELETE smf-registrations for an unregistered PDU session is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "DELETE",
                "path": "/nudm-uecm/v1/imsi-001010000000001/registrations/smf-registrations/99"
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
