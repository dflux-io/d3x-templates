# Nudm_PP Create a 5G-VN-group / AF data entry — compliance.
# 3GPP TS 29.503 §6.5.3.x
#   (PUT /nudm-pp/v1/{ueId}/pp-data-store/{afInstanceId} with PpDataEntry).
# Uses SBI_Request PUT — unlocked by the new generic SBI message.

kind: flow
name: udm_pp_create_data_entry_ok
description: PUT pp-data-store/{afInstanceId} returns 201/200/204
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "PUT",
                "path": "/nudm-pp/v1/imsi-001010000000001/pp-data-store/af1",
                "body": {
                  "communicationCharacteristics": {
                    "ppSubsRegTimer": {"subsRegTimer": 3600, "afInstanceId": "af1", "referenceId": 1}
                  }
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: less_than
            expected: 300
