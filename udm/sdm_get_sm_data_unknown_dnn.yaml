# Nudm_SDM Get sm-data for an unsubscribed DNN — security/negative.
# 3GPP TS 29.503 §6.1.7.3 (DATA_NOT_FOUND ProblemDetails).
# UDM must reject an unknown DNN with 404 and stay live.

kind: flow
name: udm_sdm_get_sm_data_unknown_dnn
description: GET sm-data with an unsubscribed DNN is rejected with 404
category: negative
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: SBI_Request
            peer: udm
            message_body: |
              {
                "method": "GET",
                "path": "/nudm-sdm/v2/imsi-001010000000001/sm-data",
                "query": {
                  "single-nssai": "{\"sst\":1,\"sd\":\"010203\"}",
                  "dnn": "no-such-dnn-deadbeef"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: rejected
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
