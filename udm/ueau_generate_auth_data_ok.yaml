# Nudm_UEAU GenerateAuthData — compliance.
# 3GPP TS 29.503 §6.3.3.2 / §5.4.2.2
#   (POST /nudm-ueau/v1/{supi}/security-information/generate-auth-data).
# runner drives a real UDM; expects 200 with an AuthenticationVector / authType.

kind: flow
name: udm_ueau_generate_auth_data_ok
description: POST generate-auth-data for a provisioned SUPI returns 200 with a vector
category: functional
type: client
protocol: sbi
nf: udm

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nudm_UEAuthentication_GetAuthData
            peer: udm
            message_body: |
              {
                "path": "/nudm-ueau/v1/imsi-001010000000001/security-information/generate-auth-data",
                "body": {
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org",
                  "ausfInstanceId": "11111111-2222-3333-4444-555555555555"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nudm_UEAuthentication_GetAuthData_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body.authType
            op: exists
