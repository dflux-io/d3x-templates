# Npcf_SMPolicyControl — Create then GET the SM policy (storage round-trip).
# 3GPP TS 29.512 §4.2.2 / §4.2.5 (GET /sm-policies/{smPolicyId}).
#
# Create as in npcf_smpolicy_create_dynamic_ok, extract Location, then GET it.
# GET returns the TS 29.512 SmPolicyControl{context, policy} envelope (ruling
# R5 / E6), so every decision assertion takes the `sbi.body.policy.` prefix —
# unlike the create response, which is the bare decision. Confirms A1's
# versioned store round-trips the dynamic decision intact.

kind: flow
name: npcf_smpolicy_get_roundtrip_ok
description: POST sm-policies → extract Location → GET → assert SmPolicyControl.policy decision
category: functional
type: client
protocol: sbi
nf: pcf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "/npcf-smpolicycontrol/v1/sm-policies",
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 1,
                  "dnn": "internet",
                  "pduSessionType": "IPV4",
                  "sliceInfo": {"sst": 1, "sd": "000001"},
                  "notificationUri": "http://127.0.0.1:1/unused",
                  "ratType": "NR",
                  "accessType": "3GPP_ACCESS"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_get
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: sm_policy_loc
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "GET",
                "path": "{{ue.Params.sm_policy_loc}}"
              }

  wait_get:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_cleanup
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          # GET shape is SmPolicyControl{context, policy} — decision under policy.
          - type: check
            field: sbi.body.policy.sessRules.sess-rule-default.authSessAmbr.uplink
            op: equals
            expected: "200 Mbps"
          - type: check
            field: sbi.body.policy.sessRules.sess-rule-default.authSessAmbr.downlink
            op: equals
            expected: "400 Mbps"
          - type: check
            field: sbi.body.policy.sessRules.sess-rule-default.authDefQos.5qi
            op: equals
            expected: 9
          - type: check
            field: sbi.body.policy.pccRules.rule-default
            op: exists
          - type: check
            field: sbi.body.policy.qosDecs.qos-default.5qi
            op: equals
            expected: 9
          # Suite-isolation cleanup: release this (supi,dnn) association so a
          # later N5 app-session install binds unambiguously (ruling R6). Reuses
          # the sm_policy_loc extracted on create.
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.sm_policy_loc}}/delete",
                "body": {}
              }

  wait_cleanup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
