# Npcf_SMPolicyControl — Usage monitoring: report accumulate → threshold → revoke.
# 3GPP TS 29.512 §5.6.2.12 (UsageMonitoringData / US_RE). The "metered" DNN is
# seeded with a usage-monitoring limit (dpf/seed.go: limit-metered, total 1000
# bytes), so CreateSMPolicy emits a session-level umDec ("um-default"), a
# monitored PCC rule ("rule-metered") referencing it, and arms US_RE.
#
# The SMF role is stubbed here — the runner POSTs the accuUsageReports directly:
#   1. create (metered) → 201, extract Location
#   2. update with accuUsageReports volUsage=400 (below 1000) → 200, monitored
#      rule still present (quota not yet exhausted)
#   3. update with accuUsageReports volUsage=700 (cumulative 1100 ≥ 1000) → 200,
#      monitored rule revoked (absent from decision), default rule survives
#   4. delete → 204

kind: flow
name: npcf_smpolicy_usage_report_revoke
description: POST sm-policies (metered) → US_RE accuUsageReports accumulate past threshold → monitored rule revoked
category: functional
type: client
protocol: sbi
nf: pcf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "/npcf-smpolicycontrol/v1/sm-policies",
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 1,
                  "dnn": "metered",
                  "pduSessionType": "IPV4",
                  "sliceInfo": {"sst": 1, "sd": "000001"},
                  "notificationUri": "http://127.0.0.1:1/unused",
                  "ratType": "NR",
                  "accessType": "3GPP_ACCESS"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_update_below
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: check
            field: sbi.body.umDecs
            op: contains
            expected: "um-default"
          - type: extract
            field: sbi.headers.Location
            store: sm_policy_loc
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.sm_policy_loc}}/update",
                "body": {
                  "repPolicyCtrlReqTriggers": ["US_RE"],
                  "accuUsageReports": [{"refUmIds": "um-default", "volUsage": 400}]
                }
              }

  wait_update_below:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_update_over
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          # Below the 1000-byte quota — the monitored rule is still installed.
          - type: check
            field: sbi.body.pccRules
            op: contains
            expected: "rule-metered"
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.sm_policy_loc}}/update",
                "body": {
                  "repPolicyCtrlReqTriggers": ["US_RE"],
                  "accuUsageReports": [{"refUmIds": "um-default", "volUsage": 700}]
                }
              }

  wait_update_over:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_cleanup
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          # Cumulative 1100 ≥ 1000 — the monitored rule is revoked (absent)…
          - type: check
            field: sbi.body.pccRules
            op: not_contains
            expected: "rule-metered"
          # …but the reserved default rule survives.
          - type: check
            field: sbi.body.pccRules
            op: contains
            expected: "rule-default"
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.sm_policy_loc}}/delete",
                "body": {}
              }

  wait_cleanup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
