# Npcf_AMPolicyControl — Create AM Policy Association (compliance).
# 3GPP TS 29.507 §4.2.2 (POST /npcf-am-policy-control/v1/policies → 201 +
# Location + PolicyAssociation).
#
# Drives the AMF role: POST a PolicyAssociationRequest for the seeded
# subscriber imsi-001010000000001. Asserts the completeness surface (PCF-7):
#   ueAmbr.{uplink,downlink}  derived from AmData.subscribedUeAmbr (1/2 Gbps seed)
#   triggers                  armed at create (RFSP_CH / SERV_AREA_CH / UE_AMBR_CH)
#   suppFeat                  NEGOTIATED to empty, NOT echoed — this PCF gates no
#                             optional AM feature (TS 29.500 6.6.2)
# Then releases the association (DELETE → 204) so the suite stays self-contained.

kind: flow
name: npcf_ampolicy_create_ok
description: POST policies for a provisioned subscriber → 201 + PolicyAssociation (ueAmbr/triggers/suppFeat)
category: functional
type: client
protocol: sbi
nf: pcf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "/npcf-am-policy-control/v1/policies",
                "body": {
                  "supi": "imsi-001010000000001",
                  "notificationUri": "http://127.0.0.1:1/unused",
                  "suppFeat": "1"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_cleanup
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: check
            field: sbi.headers.Location
            op: not_empty
          # Completeness pins (PCF-7) — the fields main previously omitted.
          - type: check
            field: sbi.body.ueAmbr.uplink
            op: equals
            expected: "1 Gbps"
          - type: check
            field: sbi.body.ueAmbr.downlink
            op: equals
            expected: "2 Gbps"
          # `.length greater_or_equal 1`, NOT `not_empty`: `triggers` is a JSON
          # ARRAY, and `not_empty` is `value != nil && value != "" && value != 0.0`
          # — an EMPTY array satisfies all three, so `not_empty` passed on
          # `"triggers": []`, i.e. on a PCF that armed nothing. The claim in this
          # row's header is that triggers are ARMED at create, so count them.
          - type: check
            field: sbi.body.triggers.length
            op: greater_or_equal
            expected: 1
          # suppFeat must be NEGOTIATED, not echoed (TS 29.500 6.6.2). This
          # step used to assert `equals "1"` — i.e. it pinned the ECHO as the
          # expected behaviour, so the defect had an acceptance test defending
          # it. An echo is an affirmative claim of support: a consumer that
          # asks for bit N and is given bit N back will USE feature N against a
          # PCF that implements nothing, and every response on the wire is a
          # 200. This PCF gates no optional AM feature, so the negotiated value
          # is the empty bitmask.
          #
          # Asserted as exists + not_contains rather than equals "": `exists`
          # proves the attribute is still on the wire (the field has no
          # omitempty, and silently dropping it would be a different change),
          # and `not_contains "1"` is the assertion that actually discriminates
          # — it is red for exactly the value the consumer asked for.
          - type: check
            field: sbi.body.suppFeat
            op: exists
          - type: check
            field: sbi.body.suppFeat
            op: not_contains
            expected: "1"
          # Suite-isolation cleanup: release this association. The polAssoId
          # comes verbatim from the create Location header.
          - type: extract
            field: sbi.headers.Location
            store: am_policy_loc
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "DELETE",
                "path": "{{ue.Params.am_policy_loc}}",
                "body": {}
              }

  wait_cleanup:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
