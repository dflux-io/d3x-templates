# Npcf_SMPolicyControl — Delete SM policy, then confirm it is gone.
# 3GPP TS 29.512 §4.2.6 (POST /sm-policies/{id}/delete + SmPolicyDeleteData
# → 204) followed by GET /sm-policies/{id} → 404.
#
# Create → extract Location → POST .../delete (204) → GET (404). Exercises the
# full SMF release path and the store eviction.

kind: flow
name: npcf_smpolicy_delete_ok
description: POST sm-policies → POST .../delete (204) → GET (404)
category: functional
type: client
protocol: sbi
nf: pcf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_create
        actions:
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "/npcf-smpolicycontrol/v1/sm-policies",
                "body": {
                  "supi": "imsi-001010000000001",
                  "pduSessionId": 1,
                  "dnn": "internet",
                  "pduSessionType": "IPV4",
                  "sliceInfo": {"sst": 1, "sd": "000001"},
                  "notificationUri": "http://127.0.0.1:1/unused",
                  "ratType": "NR",
                  "accessType": "3GPP_ACCESS"
                }
              }

  wait_create:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_delete
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: sm_policy_loc
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "POST",
                "path": "{{ue.Params.sm_policy_loc}}/delete",
                "body": {}
              }

  wait_delete:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_get_gone
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
          - type: send
            message: SBI_Request
            peer: pcf
            message_body: |
              {
                "method": "GET",
                "path": "{{ue.Params.sm_policy_loc}}"
              }

  wait_get_gone:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 404
