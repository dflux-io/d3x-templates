# UPF metrics scrape (F-20) — the reusable Ⓜ assertion vehicle.
#
# GETs the standalone UPF's Prometheus /metrics endpoint and asserts the
# response is 200 and carries the UPF gauge family. A follow-up REST flow
# like this is how N4/N3/N6 sanity flows observe externally-visible UPF
# state (session/association counts, datapath counters) that PFCP/GTP-U
# check actions can't reach directly.
#
# protocol: rest, nf: external — a separate flow from the PFCP lifecycle
# (Runik flows are single-protocol; a pfcp flow cannot send a REST message).
# Requires the `http1` REST binding option (the endpoint is HTTP/1.1).

kind: flow
name: upf_metrics_scrape
description: GET the UPF /metrics endpoint and assert the gauge family is present (Ⓜ vehicle)
category: functional
type: client
protocol: rest
nf: external

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: ScrapeMetrics
            peer: metrics
            message_body: |
              { "method": "GET", "url": "/metrics" }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: rest.ScrapeMetrics_Answer
        target: settle
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body
            op: contains
            expected: "upf_sessions_active"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `completed` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `completed`.
final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: ScrapeMetrics sent 1x
    metric: msg_types.tx.rest.ScrapeMetrics
    op: equals
    value: 1
  - name: a ScrapeMetrics_Answer arrived
    metric: rx_events.rest.ScrapeMetrics_Answer
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
