# UPF metrics scrape — assert upf_qers_active == 0 (QER-leg baseline).
#
# Baseline for the upf_metrics suite's QER leg: before any QER is installed the
# gauge must read 0, so the subsequent 0 → 1 increment (after
# pfcp_session_establish_qer) is meaningful. The suite's earlier
# session_establish step installs a QER-less session, so qers stay 0 here.
#
# upf_qers_active is unlabelled → exposition line `upf_qers_active 0`; assert
# via substring `contains`. Requires Runik http1 REST option (#309).

kind: flow
name: upf_metrics_qers_active_zero
description: Assert the UPF reports upf_qers_active 0 (QER-leg baseline)
category: functional
type: client
protocol: rest
nf: external

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: ScrapeMetrics
            peer: metrics
            message_body: |
              { "method": "GET", "url": "/metrics" }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: rest.ScrapeMetrics_Answer
        target: settle
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body
            op: contains
            expected: "upf_qers_active 0"

  # The checks above sit one transition before the terminal. A UE whose check
  # fails stops in the transition's TARGET state, so with the check on the way
  # into `completed` a failed run would still count as having ended there — and a
  # suite step that asks only for that final state would pass it.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

# END-OF-FLOW ASSERTIONS — what this flow claims, said by the flow.
# `final_states` lists every way it can end; it claims `completed`.
final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: ScrapeMetrics sent 1x
    metric: msg_types.tx.rest.ScrapeMetrics
    op: equals
    value: 1
  - name: a ScrapeMetrics_Answer arrived
    metric: rx_events.rest.ScrapeMetrics_Answer
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
