# Nbsf_Management — register a PDU-session→serving-PCF binding, discover it by
# UE IP, then deregister it. TS 29.521 §5.3.2.2.2 (POST /pcfBindings → 201 +
# Location), §5.3.3.3.3 (GET /pcfBindings?ipv4Addr= → 200), §5.3.3.2.2 (DELETE
# /pcfBindings/{bindingId} → 204). Uses a UE IP outside the seeded SM-policy
# set so the discover matches exactly the binding registered here. Query params
# go in the structured `query` field (runner url-encodes them).
kind: flow
name: nbsf_binding_register_discover_deregister_ok
description: POST /pcfBindings (201) -> GET ?ipv4Addr (200) -> DELETE (204)
category: functional
type: client
protocol: sbi
nf: bsf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_register
        actions:
          - type: send
            message: SBI_Request
            peer: bsf
            message_body: |
              {
                "method": "POST",
                "path": "/nbsf-management/v1/pcfBindings",
                "body": {
                  "supi": "imsi-001010000000001",
                  "dnn": "internet",
                  "snssai": {"sst": 1, "sd": "000001"},
                  "ipv4Addr": "10.9.9.9",
                  "pcfFqdn": "dpf.lab"
                }
              }

  wait_register:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_discover
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 201
          - type: extract
            field: sbi.headers.Location
            store: binding_loc
          - type: send
            message: SBI_Request
            peer: bsf
            message_body: |
              {
                "method": "GET",
                "path": "/nbsf-management/v1/pcfBindings",
                "query": {"ipv4Addr": "10.9.9.9"}
              }

  wait_discover:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_deregister
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body
            op: contains
            expected: "dpf.lab"
          - type: send
            message: SBI_Request
            peer: bsf
            message_body: |
              {
                "method": "DELETE",
                "path": "{{ue.Params.binding_loc}}"
              }

  wait_deregister:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 204
