# Nbsf_Management — register a binding with the mandatory `snssai` absent →
# 400 Bad Request. TS 29.521 §5.3.2.2.2 / Table 5.6.2.2-1 (PcfBinding: snssai
# is a mandatory IE for POST /pcfBindings). Uses test-range values (RFC 5737
# 203.0.113.90, supi …090) that no other flow registers, so nothing persists
# on failure paths.
kind: flow
name: nbsf_binding_create_missing_snssai_400
description: POST /pcfBindings without snssai -> 400
category: functional
type: client
protocol: sbi
nf: bsf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_register
        actions:
          - type: send
            message: SBI_Request
            peer: bsf
            message_body: |
              {
                "method": "POST",
                "path": "/nbsf-management/v1/pcfBindings",
                "body": {
                  "supi": "imsi-001010000000090",
                  "dnn": "internet",
                  "ipv4Addr": "203.0.113.90",
                  "pcfFqdn": "dpf.lab"
                }
              }

  wait_register:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
