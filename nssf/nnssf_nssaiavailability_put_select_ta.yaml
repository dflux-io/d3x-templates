# Nnssf_NSSAIAvailability PUT → Nnssf_NSSelection GET round-trip (TA-aware).
# TS 29.531 §6.2 (PUT /nssai-availability/{nfId}) + §6.1 (GET network-slice-
# information with tai). AMF reports only sd 000001 available in TAC 000001;
# selection requests 000001+000002 (both subscribed+configured) and expects
# allowed 000001 and rejectedNssaiInTa 000002.
#
# Assertions pin allowedNssaiList / rejectedNssaiInTa structure so a bare
# configuredNssai echo (which also contains 000001/000002) cannot false-pass.
#
# Subscriptions (POST /nssai-availability/subscriptions) are out of scope for
# this v1 and are not exercised.
kind: flow
name: nnssf_nssaiavailability_put_select_ta
description: PUT nssai-availability per TA then GET selection → rejectedNssaiInTa
category: functional
type: client
protocol: sbi
nf: nssf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_put
        actions:
          - type: send
            message: SBI_Request
            peer: nssf
            message_body: |
              {
                "method": "PUT",
                "path": "/nnssf-nssaiavailability/v1/nssai-availability/amf-lab-1",
                "body": {
                  "supportedNssaiAvailabilityData": [
                    {
                      "tai": {"plmnId": {"mcc": "001", "mnc": "01"}, "tac": "000001"},
                      "supportedSnssaiList": [{"sst": 1, "sd": "000001"}]
                    }
                  ]
                }
              }

  wait_put:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: wait_select
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body.authorizedNssaiAvailabilityData
            op: exists
          - type: check
            field: sbi.body.authorizedNssaiAvailabilityData.0.supportedSnssaiList.0.sd
            op: equals
            expected: "000001"
          - type: send
            message: SBI_Request
            peer: nssf
            message_body: |
              {
                "method": "GET",
                "path": "/nnssf-nsselection/v1/network-slice-information",
                "query": {
                  "nf-type": "AMF",
                  "tai": "{\"plmnId\":{\"mcc\":\"001\",\"mnc\":\"01\"},\"tac\":\"000001\"}",
                  "slice-info-request-for-registration": "{\"requestedNssai\":[{\"sst\":1,\"sd\":\"000001\"},{\"sst\":1,\"sd\":\"000002\"}],\"subscribedNssai\":[{\"subscribedSnssai\":{\"sst\":1,\"sd\":\"000001\"}},{\"subscribedSnssai\":{\"sst\":1,\"sd\":\"000002\"}}]}"
                }
              }

  wait_select:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          # Fail if producer only echoes configuredNssai (always has 000001/000002)
          # without TA-aware allowed/rejected split.
          - type: check
            field: sbi.body.allowedNssaiList
            op: exists
          - type: check
            field: sbi.body.allowedNssaiList.0.allowedSnssaiList.0.allowedSnssai.sd
            op: equals
            expected: "000001"
          - type: check
            field: sbi.body.rejectedNssaiInTa
            op: exists
          - type: check
            field: sbi.body.rejectedNssaiInTa.0.sd
            op: equals
            expected: "000002"
