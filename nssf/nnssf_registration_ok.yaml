# Nnssf_NSSelection — registration-mode slice selection. TS 29.531 §6.1.3.2
# (GET /network-slice-information, nf-type + slice-info-request-for-registration
# → 200 AuthorizedNetworkSliceInfo). slice-info-request-for-registration is a
# JSON object passed as a query value (runner url-encodes it). Asserts the allowed
# list carries the requested+subscribed+configured slice (sd 000001).
kind: flow
name: nnssf_registration_ok
description: GET network-slice-information (registration) -> 200 allowedNssai contains 000001
category: functional
type: client
protocol: sbi
nf: nssf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_select
        actions:
          - type: send
            message: SBI_Request
            peer: nssf
            message_body: |
              {
                "method": "GET",
                "path": "/nnssf-nsselection/v1/network-slice-information",
                "query": {
                  "nf-type": "AMF",
                  "slice-info-request-for-registration": "{\"requestedNssai\":[{\"sst\":1,\"sd\":\"000001\"}]}"
                }
              }

  wait_select:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 200
          - type: check
            field: sbi.body
            op: contains
            expected: "000001"
