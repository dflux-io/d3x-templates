# Nnssf_NSSelection — required-param enforcement: no nf-type → 400. TS 29.531
# §6.1.3.2.3.1 (nf-type is mandatory).
kind: flow
name: nnssf_missing_nftype_400
description: GET network-slice-information without nf-type -> 400
category: functional
type: client
protocol: sbi
nf: nssf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_resp
        actions:
          - type: send
            message: SBI_Request
            peer: nssf
            message_body: |
              {
                "method": "GET",
                "path": "/nnssf-nsselection/v1/network-slice-information"
              }

  wait_resp:
    on_timeout:
      duration: 10s
      target: failed
    transitions:
      - event: sbi.SBI_Request_Answer
        target: completed
        actions:
          - type: check
            field: sbi.status
            op: equals
            expected: 400
