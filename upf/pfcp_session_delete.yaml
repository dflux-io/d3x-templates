# PFCP Session Deletion (3GPP TS 29.244 §7.5.6 / §7.5.7).
#
# runner (SMF) brings up an association + session then tears the session down with
# a PFCPSessionDeletionRequest. The deletion enricher reuses the RemoteSEID
# learned from the establishment response, so deletion must follow establishment
# in the same UE execution. The UPF removes the session context and answers
# PFCPSessionDeletionResponse (optionally with final usage reports) carrying
# Cause "Request accepted".
#
# Spec-correct success = a SessionDeletionResponse with Cause
# "Request accepted" (TS 29.244 §8.2.1).

kind: flow
name: upf_pfcp_session_delete
description: SMF establishes then deletes a PFCP session against a real UPF (N4)
category: functional
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - deleted
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_delete
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionDeletionRequest

  wait_delete:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionDeletionResponse
        target: deleted
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
