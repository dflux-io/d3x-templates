# N4/PFCP — Association Setup started by the UPF and refused.
# 3GPP TS 29.244 §6.2.6.3, §7.4.4.2, §8.2.1 (Cause).
#
# Runik is the UPF. The SMF does not want this UPF (unknown node, not
# configured) and answers Cause "Request rejected". The flow claims exactly
# that: a refusal with that cause. An SMF that accepts fails it.
#
# Pair: smf_pfcp_reject_association_responder. Env: the UPF dials, the SMF
# listens (runik/config/lab-pfcp-upf-dials.yaml).
#
kind: flow
name: upf_pfcp_association_setup_rejected
description: UPF tries to set up the association and is refused by the SMF
category: functional
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            message_body: |
              { "up_function_features": {"flags": 285278208} }

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request rejected"
          - type: check
            field: pfcp.node_id
            op: not_empty

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: rejected

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `rejected`
    metric: final_state_counts.rejected
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: all 2 declared checks ran
    metric: checks_total
    op: equals
    value: 2
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
