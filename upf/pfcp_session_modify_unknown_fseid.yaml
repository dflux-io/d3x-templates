# PFCP Session Modification against an unknown SEID
# (3GPP TS 29.244 §7.2.2.4.2 / §7.6 / §8.2.1).
#
# Security/negative: after establishing the association, runner sends a
# PFCPSessionModificationRequest whose PFCP header SEID is a bogus value
# (0xDEADBEEF) that the UPF has never allocated. A spec-correct UPF must REJECT
# with Cause "Session context not found" (TS 29.244 §8.2.1, value 65) and stay
# up. We supply a full header in message_body (seid_flag + bogus seid + a fixed
# sequence number) so the enricher does not overwrite it.
#
# Spec-correct success = a SessionModificationResponse whose Cause is
# "Session context not found".

kind: flow
name: upf_pfcp_session_modify_unknown_fseid
description: Session Modification with an unknown SEID; UPF must reject (Cause 65)
category: negative
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - rejected
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_modify
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          # Bogus header SEID -> no session context on the UPF.
          - type: send
            message: PFCPSessionModificationRequest
            message_body: |
              {
                "header": {
                  "seid_flag": true,
                  "seid": 3735928559,
                  "sequence_number": 4097
                },
                "update_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2}
                  }
                ]
              }

  wait_modify:
    on_timeout:
      duration: 5s
      target: tolerated
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: rejected
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Session context not found"
