# N4/PFCP — Association Setup started by the UPF.
# 3GPP TS 29.244 §6.2.6.3, §7.4.4.1 / §7.4.4.2.
#
# Runik is the UPF and it is the one that dials: it sends the PFCP Association
# Setup Request with its Node ID, Recovery Time Stamp and UP Function Features,
# and the SMF answers with its own Node ID and Cause "Request accepted".
#
# UP Function Features 0x11010000 (octets 5-8 of the IE, big-endian): BUCP
# (downlink buffering in the UP function), FTUP (F-TEID allocation in the UP
# function) and EMPU (end markers) — the set a UPF needs for the session flows
# in this directory.
#
# Pair: smf_pfcp_responder.
# Env: the UPF dials, the SMF listens (runik/config/lab-pfcp-upf-dials.yaml).
kind: flow
name: upf_pfcp_association_setup
description: UPF sets up the PFCP association — expects the SMF's Node ID and Cause Request accepted
category: functional
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - associated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            message_body: |
              { "up_function_features": {"flags": 285278208} }

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: checked
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.node_id
            op: not_empty
          - type: check
            field: pfcp.recovery_timestamp
            op: greater_than
            expected: 0
          - type: send
            message: PFCPHeartbeatRequest

  # The checks above sit one transition before the terminal: a UE whose check
  # fails stops in the transition's target, so with the checks on the way into
  # `associated` a failed run would still count as having ended there.
  checked:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPHeartbeatResponse
        target: associated

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the UPF ended associated
    metric: final_state_counts.associated
    op: equals
    value: 1
  - name: one PFCP ASSOCIATION SETUP REQUEST was sent
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: a PFCP ASSOCIATION SETUP RESPONSE arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: the SMF still answers N4 after the setup
    metric: rx_events.pfcp.PFCPHeartbeatResponse
    op: greater_or_equal
    value: 1
  - name: all three declared checks ran
    metric: checks_total
    op: equals
    value: 3
  - name: and none of them failed
    metric: checks_failed
    op: equals
    value: 0
