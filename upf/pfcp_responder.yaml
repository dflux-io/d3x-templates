# N4/PFCP — generic UPF responder.
# 3GPP TS 29.244 §7.4 (node messages), §7.5 (session messages).
#
# Runik is the UPF. It listens, and answers every request an SMF may send with
# the default answer: Cause "Request accepted", its own Node ID, and for a
# Session Establishment a UP F-SEID it allocates. The association answer also
# advertises UP Function Features 0x11010000 (BUCP, FTUP, EMPU). It never sends
# a request of its own.
#
# Use it as the far end for an SMF flow that only needs "a UPF that says yes":
# list it under `background_flows:` of the step. A flow that needs the UPF to
# check what it was sent, to return a specific value, to refuse, or to start a
# procedure has its own UPF flow.
#
# One session at a time: a server flow instance keeps one pair of SEIDs, so a
# second Session Establishment reuses the first session's UP F-SEID.
#
# It never leaves `serving` (`stopped` is never reached; a flow must name a
# final state) and runs until the suite step that started it ends.
#
# Env: the SMF dials, the UPF listens (runik/config/lab-pfcp.yaml).
#
kind: flow
name: upf_pfcp_responder
description: Runik is the UPF and accepts every request an SMF can send on N4
category: functional
type: server
protocol: pfcp
nf: upf

initial_state: serving
final_states:
  - stopped

states:
  serving:
    transitions:
      - event: pfcp.PFCPHeartbeatRequest
        target: serving
        actions:
          - type: send
            message: PFCPHeartbeatResponse
      - event: pfcp.PFCPAssociationSetupRequest
        target: serving
        actions:
          - type: send
            message: PFCPAssociationSetupResponse
            message_body: |
              { "up_function_features": {"flags": 285278208} }
      - event: pfcp.PFCPAssociationUpdateRequest
        target: serving
        actions:
          - type: send
            message: PFCPAssociationUpdateResponse
      - event: pfcp.PFCPAssociationReleaseRequest
        target: serving
        actions:
          - type: send
            message: PFCPAssociationReleaseResponse
      - event: pfcp.PFCPPFDManagementRequest
        target: serving
        actions:
          - type: send
            message: PFCPPFDManagementResponse
      - event: pfcp.PFCPSessionSetDeletionRequest
        target: serving
        actions:
          - type: send
            message: PFCPSessionSetDeletionResponse
      - event: pfcp.PFCPSessionSetModificationRequest
        target: serving
        actions:
          - type: send
            message: PFCPSessionSetModificationResponse
      - event: pfcp.PFCPSessionEstablishmentRequest
        target: serving
        actions:
          - type: send
            message: PFCPSessionEstablishmentResponse
      - event: pfcp.PFCPSessionModificationRequest
        target: serving
        actions:
          - type: send
            message: PFCPSessionModificationResponse
      - event: pfcp.PFCPSessionDeletionRequest
        target: serving
        actions:
          - type: send
            message: PFCPSessionDeletionResponse
