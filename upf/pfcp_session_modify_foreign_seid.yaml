# NEGATIVE — PFCP Session Modification whose header SEID is NOT the learned
# RemoteSEID (foreign / stolen SEID).
#
# 3GPP TS 29.244 §7.2.2.4.2 / §7.5.4 / §8.2.1.
#
# WHAT IS ON THE WIRE
# -------------------
# Association + Session Establishment (so a real session exists and the
# enricher has learned RemoteSEID), then PFCPSessionModificationRequest with
# send-param `seid: "0xdeadbeefcafebabe"` so the PFCP header SEID is a foreign
# value, not the learned one. Distinct from upf_pfcp_session_modify_unknown_fseid,
# which never establishes a session and stuffs a bogus SEID in message_body.header.
#
# Requires runner send-param `seid` on PFCP session messages
# (d3x PR feat/pentest-send-params).
#
# EXPECTED TERMINAL
# -----------------
#   rejected  — Cause "Session context not found" (65). Spec-correct.
#   tolerated — silent drop (no response). UPF stayed up.
#   failed    — crash / hang / unexpected Cause.
#
# category: negative.

kind: flow
name: upf_pfcp_session_modify_foreign_seid
description: Session Modification with a foreign header SEID after a real establish; UPF must reject (Cause 65)
category: negative
finding:
  class: session-hijack
  attacker: rogue-smf
  clause: "TS 29.244 §7.2.2.4.2 — Session Modification with a SEID the UPF did not allocate"
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - rejected
  - tolerated
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: wait_modify
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          # Header SEID is NOT the learned RemoteSEID.
          # Requires runner param seid (d3x PR feat/pentest-send-params).
          # Decimal equivalent of 0xdeadbeefcafebabe = 16045690984503098046.
          - type: send
            message: PFCPSessionModificationRequest
            params:
              seid: "0xdeadbeefcafebabe"
            message_body: |
              {
                "update_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "update_forwarding_parameters": {
                      "destination_interface": 1
                    }
                  }
                ]
              }

  wait_modify:
    on_timeout:
      duration: 5s
      target: tolerated
    transitions:
      - event: pfcp.PFCPSessionModificationResponse
        target: rejected
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Session context not found"
