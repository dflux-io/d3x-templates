# N4/PFCP — Association Update started by the UPF.
# 3GPP TS 29.244 §6.2.7.3, §7.4.4.3 / §7.4.4.4.
#
# Runik is the UPF. After the setup it gains a capability — PDIU, sending more
# than one Created PDR per traffic endpoint — and tells the SMF by sending its
# whole UP Function Features again with that bit added (0x11030000). The SMF
# answers with its Node ID and Cause "Request accepted".
#
# Pair: smf_pfcp_responder. Env: the UPF dials, the SMF listens
# (runik/config/lab-pfcp-upf-dials.yaml).
#
kind: flow
name: upf_pfcp_association_update
description: UPF tells the SMF its feature set changed (Association Update)
category: functional
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            message_body: |
              { "up_function_features": {"flags": 285278208} }

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_update
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPAssociationUpdateRequest
            message_body: |
              { "up_function_features": {"flags": 285409280} }

  wait_update:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationUpdateResponse
        target: settle
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: check
            field: pfcp.node_id
            op: not_empty

  # Every check above sits at least one transition before the terminal. A UE
  # whose check fails stops in the transition's TARGET state, so a check on
  # the way into the terminal would leave a failed run counted as having
  # ended there.
  settle:
    on_timeout:
      duration: 100ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: PFCPAssociationSetupRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationSetupRequest
    op: equals
    value: 1
  - name: PFCPAssociationUpdateRequest sent 1x
    metric: msg_types.tx.pfcp.PFCPAssociationUpdateRequest
    op: equals
    value: 1
  - name: a PFCPAssociationSetupResponse arrived
    metric: rx_events.pfcp.PFCPAssociationSetupResponse
    op: greater_or_equal
    value: 1
  - name: a PFCPAssociationUpdateResponse arrived
    metric: rx_events.pfcp.PFCPAssociationUpdateResponse
    op: greater_or_equal
    value: 1
  - name: all 3 declared checks ran
    metric: checks_total
    op: equals
    value: 3
  - name: no check failed
    metric: checks_failed
    op: equals
    value: 0
