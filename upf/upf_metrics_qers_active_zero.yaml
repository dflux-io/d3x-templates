# UPF metrics scrape — assert upf_qers_active == 0 (QER-leg baseline).
#
# Baseline for the upf_metrics suite's QER leg: before any QER is installed the
# gauge must read 0, so the subsequent 0 → 1 increment (after
# pfcp_session_establish_qer) is meaningful. The suite's earlier
# session_establish step installs a QER-less session, so qers stay 0 here.
#
# upf_qers_active is unlabelled → exposition line `upf_qers_active 0`; assert
# via substring `contains`. Requires the runner http1 REST option (#309).

kind: flow
name: upf_metrics_qers_active_zero
description: Assert the UPF reports upf_qers_active 0 (QER-leg baseline)
category: functional
type: client
protocol: rest
nf: external

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: ScrapeMetrics
            peer: metrics
            message_body: |
              { "method": "GET", "url": "/metrics" }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: rest.ScrapeMetrics_Answer
        target: completed
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 200
          - type: check
            field: rest.body
            op: contains
            expected: "upf_qers_active 0"
