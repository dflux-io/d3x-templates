# PFCP Session Establishment with a missing CP F-SEID
# (3GPP TS 29.244 §7.5.2.1 / §7.6 / §8.2.1).
#
# Security/negative: the CP F-SEID is a MANDATORY IE on Session Establishment.
# The `suppress_cp_fseid: true` enricher knob omits the auto-filled CP F-SEID
# so the request reaches the UPF without it. A spec-correct UPF must REJECT
# with Cause "Mandatory IE missing" (TS 29.244 §8.2.1, value 66) and stay up.
#
# Spec-correct success = a SessionEstablishmentResponse whose Cause is
# "Mandatory IE missing".

kind: flow
name: upf_pfcp_session_establish_missing_fseid
description: Session Establishment omitting mandatory CP F-SEID; UPF must reject
category: negative
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - rejected
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          # suppress_cp_fseid drops the mandatory CP F-SEID IE from the
          # encoded request (params overlay read by the enricher).
          - type: send
            message: PFCPSessionEstablishmentRequest
            params:
              suppress_cp_fseid: true
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: rejected
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Mandatory IE missing"
