# N4/PFCP — a UPF that refuses an Association Setup: Mandatory IE missing.
# 3GPP TS 29.244 §7.4.4.2, §8.2.1 (Cause).
#
# Runik is the UPF. It answers every Association Setup Request with Cause 66,
# "Mandatory IE missing". (An Association Setup Response has no Offending IE.)
#
# It refuses unconditionally — it does not look at whether the Node ID is
# really
# absent. Its job is to give smf_pfcp_association_setup_no_node_id that exact
# answer to react to. The cause value in the body is the spec's (the Cause
# enumeration is not shifted like the others).
#
# It never leaves `serving` (`stopped` is never reached; a flow must name a
# final state) and runs until the suite step that started it ends.
#
# Pair: smf_pfcp_association_setup_no_node_id. Env: the SMF dials, the UPF
# listens (runik/config/lab-pfcp.yaml).
kind: flow
name: upf_pfcp_reject_missing_node_id_responder
description: UPF answers an Association Setup with Mandatory IE missing
category: functional
type: server
protocol: pfcp
nf: upf

initial_state: serving
final_states:
  - stopped

states:
  serving:
    transitions:
      - event: pfcp.PFCPAssociationSetupRequest
        target: serving
        actions:
          - type: send
            message: PFCPAssociationSetupResponse
            message_body: |
              { "cause": {"value": 66} }
