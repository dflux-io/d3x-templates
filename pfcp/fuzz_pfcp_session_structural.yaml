# PFCP structure-aware fuzz driver — W2-F2.
#
# The W2-F1 sibling (fuzz_pfcp_session_establish.yaml) mutates BYTES. F1 proved,
# by running, that byte mutation of a length-prefixed protocol is shallow:
# truncate 37/37 and extend 45/45 died at the UPF's outer length check because
# the declared length still promised the original size, and only bitflip reached
# the decoder at all. This driver is identical up to the `fuzz:` block, but its
# strategy is STRUCTURE-AWARE: the runner mutates a typed field / IE of the
# message it already holds and re-runs pfcp.Encode(), which recomputes the length
# determinant. The malformed frame therefore CLEARS the outer check and lands in
# the IE walk — the surface F1 could not reach.
#
# STRATEGIES (set `strategy:` to one):
#   field       corrupt one scalar field (out-of-range enum / oversized length)
#   ie-drop     remove one present IE (mandatory-IE-absent handling)
#   ie-dup      duplicate one repeated IE (TS 38.415 lenient-reading defect class)
#   ie-reorder  shuffle IE wire order (canonical-order assumptions)
#   unknown-ie  inject an IE type the decoder does not know (lenient acceptance)
#
# ORACLES — this driver arms the two strong ones the F1 pilot only documented:
#   1. Panic counters. Pass -fuzz-metrics-url http://127.0.0.1:9095/metrics and
#      the campaign scrapes d3x_recovered_panics_total{site="upf_n4"} before and
#      after; a positive delta FAILS the campaign, whatever the flow states say.
#   4. Known-good replay. `known_good:` below (or -fuzz-known-good) re-runs a
#      clean session-establishment flow during and after the campaign; if the
#      UPF stops serving good traffic the campaign FAILS — the state-corruption
#      oracle no per-frame verdict can see.
#
#   d3x-run run-flow -flow fuzz_pfcp_session_structural \
#     -templates . -c config/lab-upf-metrics.yaml -gen-subscriber \
#     -fuzz-metrics-url http://127.0.0.1:9095/metrics

kind: flow
name: fuzz_pfcp_session_structural
description: Structure-aware fuzz of PFCPSessionEstablishmentRequest against a live UPF (N4)
category: robustness
type: client
protocol: pfcp
nf: upf

initial_state: idle
final_states:
  - survived_answered
  - survived_ignored
  - failed

fuzz:
  seed: 0x5eed
  targets: [PFCPSessionEstablishmentRequest]
  strategy: field
  rate: 1.0
  budget: 300
  known_good:
    flow: upf_pfcp_session_establish
    every_seconds: 0

states:
  idle:
    transitions:
      - event: Start
        target: wait_assoc
        actions:
          - type: send
            message: PFCPAssociationSetupRequest
            peer: upf

  wait_assoc:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPAssociationSetupResponse
        target: wait_session
        actions:
          - type: check
            field: pfcp.cause
            op: equals
            expected: "Request accepted"
          - type: send
            message: PFCPSessionEstablishmentRequest
            peer: upf
            message_body: |
              {
                "create_pdr": [
                  {
                    "pdr_id": {"value": 1},
                    "precedence": {"value": 255},
                    "pdi": {
                      "source_interface": 1,
                      "local_f_teid": {"ch": true}
                    },
                    "outer_header_removal": {"description": 0},
                    "far_id": {"value": 1}
                  }
                ],
                "create_far": [
                  {
                    "far_id": {"value": 1},
                    "apply_action": {"flags": 2},
                    "forwarding_parameters": {
                      "destination_interface": 2
                    }
                  }
                ]
              }

  wait_session:
    on_timeout:
      duration: 4s
      target: probe_liveness
      actions:
        - type: send
          message: PFCPHeartbeatRequest
          peer: upf
    transitions:
      - event: pfcp.PFCPSessionEstablishmentResponse
        target: survived_answered

  probe_liveness:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: pfcp.PFCPHeartbeatResponse
        target: survived_ignored
        actions:
          - type: check
            field: pfcp.recovery_timestamp
            op: not_empty
