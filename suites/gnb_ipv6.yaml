# gNB ↔ AMF ↔ SMF IPv6 / IPv4v6 PDU session suite.
#
# For a core whose DNN serves IPv6 (the d3x lab: the SMF carries an IPv6 /48
# prefix pool for "internet" and IPv6 DNS servers, docs/smf/ipv6.md). Each step
# registers one UE and establishes one PDU session:
#
#   1. pdu_session_ipv6_granted — IPv6 requested: IPv6 granted, an 8-octet
#      interface identifier in the PDU address IE, IPv6 DNS only, the N2
#      transfer says IPv6 (TS 24.501 §6.4.1.3).
#   2. pdu_session_ipv4v6       — IPv4v6 requested: IPv4v6 granted with BOTH an
#      IPv4 address and an interface identifier, no #50/#51.
#   3. pdu_session_ipv4         — IPv4 requested: the IPv4-only session is
#      unchanged next to IPv6 on the same DNN (no regression).
#
# Then the USER PLANE, which needs a UPF that forwards (the d3x lab recreates
# its UPF with the userspace datapath for this suite, and puts a data network
# host on N6 — gnb.uplane.target_addr / target_addr6):
#
#   4. ipv6_ra_ping6        — the UPF's Router Advertisement on the session's
#      tunnel (M=0 O=0, a /64 with L=0 A=1, TS 29.061 §11.2.1.3.4) configures
#      the UE's address from the accept's interface identifier, and ICMPv6
#      echo to the data network round-trips.
#   5. ipv6_udp6            — UDP over IPv6 from that address is echoed back.
#   6. ipv4v6_dual_stack    — an IPv4v6 session carries BOTH families on its
#      one tunnel: ICMP over IPv4 and ICMPv6 each round-trip.
#
# Run:
#   ./bin/rk run-suite -suite gnb-ipv6 \
#       -templates <templates-dir> -c <lab-gnb.yaml> -s <subscribers.yaml> -trace

kind: suite
name: gnb-ipv6
description: IPv6 and IPv4v6 PDU sessions granted on an IPv6-capable DNN, IPv4 unchanged, and their user plane (RA, ping6, UDP over IPv6, both families on IPv4v6).
steps:
  - name: pdu_session_ipv6_granted
    flow: pdu_session_ipv6_granted
    repetitions: 1
    timeout: 30s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: established

  - name: pdu_session_ipv4v6
    flow: pdu_session_setup_ipv4v6
    repetitions: 1
    timeout: 30s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: established

  - name: pdu_session_ipv4
    flow: pdu_session_setup
    repetitions: 1
    timeout: 30s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: established

  - name: ipv6_ra_ping6
    flow: pdu_session_ipv6_ra_ping6
    repetitions: 1
    timeout: 40s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: user_plane_verified

  - name: ipv6_udp6
    flow: pdu_session_ipv6_udp6
    repetitions: 1
    timeout: 40s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: user_plane_verified

  - name: ipv4v6_dual_stack
    flow: pdu_session_ipv4v6_dual_stack_traffic
    repetitions: 1
    timeout: 40s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: user_plane_verified
