# runner ↔ AUSF Nausf SBI compliance suite — one UE, one execution per flow.
#
# Drives the standard Nausf service procedures (UEAuthentication initiate +
# confirmation lifecycle, SoRProtection, UPUProtection) consumer-side against a
# real 5G core (Open5GS AUSF). runner is the SBI consumer/peer: for
# UEAuthentication it acts as the AMF, for SoR/UPU protection as the UDM.
# Every step runs exactly ONE UE for ONE execution (repetitions: 1, no rate)
# so each procedure is exercised deterministically and scored on its own —
# this is a conformance pass, not a load test.
#
# Each step asserts, via success_when.at_least_one_final_state, that the flow
# reached its SPEC-CORRECT terminal (e.g. the DELETE flow must reach `released`,
# the protection flows `protected`). These SBI flows are stateless from a
# transport view (each is its own HTTP/2 request over the shared AUSF
# connection), so there is no persistent association to keep alive between
# steps — unlike the gNB/SCTP suites the ORDER below is about leaving the
# core's per-SUPI auth/SoR/UPU state clean, not about a shared link.
#
# Run:
#   ./bin/d3x-run run-suite -suite ausf-compliance \
#       -templates <templates-dir> -c config/open5gs-ausf.yaml -trace
#
# stop_on_failure defaults to TRUE when unset, so every step that should NOT
# abort the run sets it explicitly to false. The 5G-AKA initiate (the basic
# positive POST that creates an authentication context) is the only hard gate:
# if a provisioned SUPI can't even get a 201 + auth context back, the AUSF is
# unreachable/misprovisioned and the dependent confirmation/protection probes
# are meaningless. Everything after runs to completion so the suite collects a
# full per-procedure pass/fail report. The DELETE-confirmation step runs LAST
# (and always_run) as the natural cleanup: it tears down the authentication
# context the chained flows created, leaving the AUSF's per-SUPI state clean.
#
# ORDER rationale:
#   1. initiate_success        — GATE: basic positive POST ue-authentications.
#   2. suci_concealed          — same procedure with a concealed SUCI input.
#   3. 5g_aka_confirmation     — chained PUT; leaves a half-done auth context.
#   4. sor_protection          — independent Nausf_SoRProtection.
#   5. upu_protection          — independent Nausf_UPUProtection.
#   6. cleanup (DELETE conf)   — always_run: tears the auth context back down.
# The confirmation flow (3) deliberately leaves the AUSF holding a half-done
# authentication context (RES* cannot be correctly computed — see below), so it
# runs after the clean positives and before the unrelated protection probes;
# the DELETE cleanup at the end removes any lingering context.
#
# Known EXPECTED failures / runtime-risk against a real Open5GS (genuine core
# gaps or unavoidable runner crypto gaps — these are the legitimate compliance
# findings this suite exists to surface, NOT flow bugs):
#   - ausf_ueauth_5g_aka_confirmation: runner has no 5G-AKA key derivation, so it
#     cannot compute a correct RES* for the live test vector. The PUT is
#     structurally valid and the AUSF answers, but the authResult is expected
#     to be AUTHENTICATION_FAILURE (or a 4xx) rather than _SUCCESS. The flow's
#     terminal is `completed` = "the AUSF answered the confirmation at all", so
#     it should still PASS; an AUTHENTICATION_SUCCESS would actually be the
#     surprising result.
#   - ausf_ueauth_5g_aka_confirmation_delete (cleanup): the DELETE on the
#     confirmation sub-resource is OM/operator-facing and frequently
#     unimplemented; Open5GS may answer 404/405 instead of 204. Terminal
#     `released` only requires that the AUSF answered the DELETE, but a hard
#     reject is a core gap to note, not a flow bug.
#   - ausf_sor_protection_success / ausf_upu_protection_success: both need the
#     K_AUSF for {supi} to be live in the AUSF (established by a prior
#     successful primary authentication). With no live K_AUSF for the SUPI a
#     real core answers 403/404 → these can legitimately FAIL against a
#     freshly-started Open5GS. Terminal `protected` means the AUSF returned the
#     protected security info; a 4xx here is a provisioning/core-state gap.
#
# First-run results (2026-06-05, Open5GS v2.7.x, runner as SBI consumer):
# 3/6 pass. SBI h2c connectivity to the AUSF on 172.22.0.11:7777 is solid.
# Pass: ueauth_5g_aka_initiate_success (201, authType=5G_AKA),
# ueauth_suci_concealed_profile_a_success, cleanup. Fail — all genuine
# runtime/core dependencies, NOT flow bugs:
#   - ueauth_5g_aka_confirmation: the PUT confirmation needs a RES* computed
#     from the RAND/AUTN of the auth vector just issued in this same exchange;
#     a one-shot compliance flow can't derive it, so the AUSF answers 400.
#   - sor_protection_success / upu_protection_success: Open5GS Nausf SoR/UPU
#     protection requires a prior live auth context (and provisioned SoR/UPU
#     data); against a fresh AUSF these return 400 — a core-state/provisioning
#     gap. NOTE: the AUSF<->UDM internal path must be healthy for any of these;
#     if a prior udm-security run crashed the UDM, restart it first (a dead UDM
#     makes the AUSF return 504 on EVERY step).

kind: suite
name: ausf-compliance
description: One-UE-per-flow Nausf SBI conformance pass for a 5G AUSF (Open5GS).
steps:
  # --- gate --------------------------------------------------------------
  - name: ueauth_5g_aka_initiate_success
    flow: ausf_ueauth_5g_aka_initiate_success
    repetitions: 1
    timeout: 20s
    stop_on_failure: true
    success_when:
      at_least_one_final_state: completed

  # --- UEAuthentication initiate variants & confirmation -----------------
  - name: ueauth_suci_concealed_profile_a_success
    flow: ausf_ueauth_suci_concealed_profile_a_success
    repetitions: 1
    timeout: 25s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: completed

  # Chained initiate -> PUT 5g-aka-confirmation. Leaves a half-done auth
  # context; terminal `completed` = the AUSF answered the confirmation at all
  # (RES* cannot be correctly derived by runner — see header runtime-risk).
  - name: ueauth_5g_aka_confirmation
    flow: ausf_ueauth_5g_aka_confirmation
    repetitions: 1
    timeout: 25s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: completed

  # --- SoR / UPU protection (independent of the auth context) ------------
  - name: sor_protection_success
    flow: ausf_sor_protection_success
    repetitions: 1
    timeout: 25s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: protected

  - name: upu_protection_success
    flow: ausf_upu_protection_success
    repetitions: 1
    timeout: 25s
    stop_on_failure: false
    success_when:
      at_least_one_final_state: protected

  # --- cleanup (always runs, even if earlier steps failed) ---------------
  # DELETE the 5g-aka-confirmation sub-resource: tears down the authentication
  # context the chained flows above created, leaving the AUSF per-SUPI state
  # clean. terminal `released` = the AUSF answered the DELETE (204 expected;
  # 404/405 is a core gap, see header).
  - name: cleanup
    flow: ausf_ueauth_5g_aka_confirmation_delete
    repetitions: 1
    timeout: 25s
    always_run: true
    success_when:
      at_least_one_final_state: released
