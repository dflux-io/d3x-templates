# S6a PUR/PUA 4-step echo flow.
# Purge-UE-Request/Answer (3GPP TS 29.272 §7.2.13).

kind: flow
name: diameter_s6a_pur_pua_success
description: S6a PUR/PUA 4-step echo against edge
category: functional
type: client
protocol: diameter
nf: mme
initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_pur_echo
        actions:
          - type: send
            message: PUR

  wait_pur_echo:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: PUR
        target: wait_pua_echo
        actions:
          - type: check
            field: PUR-Flags
            op: exists
          - type: send
            message: PUA

  wait_pua_echo:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: PUA
        target: completed
        actions:
          - type: check
            field: Result-Code
            op: equals
            expected: 2001
