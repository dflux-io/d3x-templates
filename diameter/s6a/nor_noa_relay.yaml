# S6a NOR/NOA 4-step echo flow (relay scenario).
# Notify-Request/Answer (3GPP TS 29.272 §7.2.17).
# MME-initiated notification to HSS; mirrors dsr-sim's nor_noa_relay.

kind: flow
name: diameter_s6a_nor_noa_relay
description: S6a NOR/NOA 4-step echo (relay) against edge
category: functional
type: client
protocol: diameter
nf: mme
initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_nor_echo
        actions:
          - type: send
            message: NOR

  wait_nor_echo:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: NOR
        target: wait_noa_echo
        actions:
          - type: check
            field: Visited-PLMN-Id
            op: exists
          - type: send
            message: NOA

  wait_noa_echo:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: NOA
        target: completed
        actions:
          - type: check
            field: Result-Code
            op: equals
            expected: 2001
