# Gx credit-control session with a PCRF-initiated policy update — Runik is
# the PGW (PCEF). CCR/CCA (RFC 4006 §3.1, 3GPP TS 29.212 §4.5.1) and RAR/RAA
# (TS 29.212 §4.5.2).
#
# diameter_gx_pgw_ccr_session with the PCRF's push in the middle: CCR-INITIAL,
# then the PCRF's RAR on that session, answered with an RAA 2001, then
# CCR-UPDATE and CCR-TERMINATION. Each CCA must carry Result-Code 2001 and the
# CC-Request-Type / -Number it answers (0, 1, 2). Point it at
# diameter_gx_pcrf_ccr_rar_responder in a second rk process, or at a PCRF that
# sends a RAR after the CCA-INITIAL.
#
# The RAR is waited for after the CCA-INITIAL: the PCRF sends it after that
# CCA on the same session, and Runik keeps one session's messages in order.
# Subscription-Id is the UE's IMSI, so the run needs subscribers.

kind: flow
name: diameter_gx_pgw_ccr_rar_session
description: PGW runs a Gx session (CCR-I, RAR/RAA, CCR-U, CCR-T) and expects CCA 2001 for each CCR and a RAR on the session
category: functional
type: client
protocol: diameter
nf: pgw
initial_state: idle
final_states: [completed, failed]

states:
  idle:
    transitions:
      - event: Start
        target: wait_cca_initial
        actions:
          - type: send
            message: CCRInit

  wait_cca_initial:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: CCA
        target: wait_rar
        actions:
          - type: check
            field: Result-Code
            op: equals
            expected: 2001
          - type: check
            field: CC-Request-Type
            op: equals
            expected: 1
          - type: check
            field: CC-Request-Number
            op: equals
            expected: 0

  wait_rar:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: RAR
        target: wait_cca_update
        actions:
          - type: check
            field: Re-Auth-Request-Type
            op: exists
          - type: send
            message: RAA
          - type: send
            message: CCRUpdate

  wait_cca_update:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: CCA
        target: wait_cca_terminate
        actions:
          - type: check
            field: Result-Code
            op: equals
            expected: 2001
          - type: check
            field: CC-Request-Type
            op: equals
            expected: 2
          - type: check
            field: CC-Request-Number
            op: equals
            expected: 1
          - type: send
            message: CCRTerminate

  wait_cca_terminate:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: CCA
        target: settle
        actions:
          - type: check
            field: Result-Code
            op: equals
            expected: 2001
          - type: check
            field: CC-Request-Type
            op: equals
            expected: 3
          - type: check
            field: CC-Request-Number
            op: equals
            expected: 2

  settle:
    on_timeout:
      duration: 10ms
      target: completed

any_state_transitions:
  - event: Error
    target: failed

# Count-free, so the same claim holds at -repetitions 1 and at 10k.
final_checks:
  - name: every UE completed its session
    metric: final_state_counts.failed
    op: equals
    value: 0
  - name: at least one UE completed its session
    metric: final_state_counts.completed
    op: greater_or_equal
    value: 1
  - name: the PCRF pushed a RAR on the session and it was answered
    metric: msg_types.tx.diameter.RAA
    op: greater_or_equal
    value: 1
  - name: every RAR was answered (one RAA per RAR received)
    metric: msg_types.tx.diameter.RAA
    op: equals
    value_metric: rx_events.RAR
  - name: every CCA carried Result-Code 2001 and the CC-Request-Type / -Number it answers
    metric: checks_failed
    op: equals
    value: 0
