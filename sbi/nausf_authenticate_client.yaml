# SBI smoke — Nausf_UEAuthentication_Authenticate (client side).
# Demonstrates a POST with a typed openapi/models request body.

kind: flow
name: sbi_nausf_authenticate_client
description: Client POST against AUSF Nausf_UEAuthentication_Authenticate
category: functional
type: client
protocol: sbi
nf: ausf

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_response
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate
            message_body: |
              {
                "body": {
                  "supiOrSuci": "imsi-001010000000001",
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

  wait_response:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate_Answer
        target: completed

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: one Nausf_UEAuthentication_Authenticate was sent
    metric: msg_types.tx.sbi.Nausf_UEAuthentication_Authenticate
    op: equals
    value: 1
  - name: an Authenticate answer arrived
    metric: rx_events.sbi.Nausf_UEAuthentication_Authenticate_Answer
    op: greater_or_equal
    value: 1
