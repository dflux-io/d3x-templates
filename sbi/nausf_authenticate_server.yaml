# SBI smoke — Nausf_UEAuthentication_Authenticate (server side).
# Replies with a canned UEAuthenticationCtx payload (5G-AKA shape).
# One-shot: the request is answered and the flow goes to `completed`.

kind: flow
name: sbi_nausf_authenticate_server
description: Server response template for Nausf_UEAuthentication_Authenticate
category: functional
type: server
protocol: sbi
nf: ausf

initial_state: waiting
final_states:
  - completed
  - failed

states:
  waiting:
    transitions:
      - event: sbi.Nausf_UEAuthentication_Authenticate
        target: completed
        actions:
          - type: send
            message: Nausf_UEAuthentication_Authenticate_Answer
            message_body: |
              {
                "status": 201,
                "body": {
                  "authType": "5G_AKA",
                  "5gAuthData": {
                    "rand": "11112222333344445555666677778888",
                    "autn": "AAAABBBBCCCCDDDDEEEEFFFF00001111",
                    "hxresStar": "1234567890ABCDEF1234567890ABCDEF"
                  },
                  "_links": {
                    "5g-aka": {
                      "href": "/nausf-auth/v1/ue-authentications/abcdef/5g-aka-confirmation"
                    }
                  },
                  "servingNetworkName": "5G:mnc001.mcc001.3gppnetwork.org"
                }
              }

final_checks:
  - name: the flow reached `completed`
    metric: final_state_counts.completed
    op: equals
    value: 1
  - name: one Authenticate answer was sent
    metric: msg_types.tx.sbi.Nausf_UEAuthentication_Authenticate_Answer
    op: equals
    value: 1
  - name: an Authenticate request arrived
    metric: rx_events.sbi.Nausf_UEAuthentication_Authenticate
    op: greater_or_equal
    value: 1
