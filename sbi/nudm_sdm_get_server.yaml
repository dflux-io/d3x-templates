# SBI smoke — server side.
# d3x-run listens on udm-server's binding and answers every
# Nudm_SDM_GetSubscriptionData with a canned AccessAndMobilitySubscription
# Data body. Stays in `waiting` — this flow is the background responder for
# suites/sbi_load_baseline.yaml (~2,000 requests). Do not route to
# `completed` after one answer.

kind: flow
name: sbi_nudm_sdm_get_server
description: Server response template for Nudm_SDM_GetSubscriptionData
category: functional
type: server
protocol: sbi
nf: udm

initial_state: waiting
final_states:
  - completed
  - failed

states:
  waiting:
    transitions:
      - event: sbi.Nudm_SDM_GetSubscriptionData
        target: waiting
        actions:
          - type: send
            message: Nudm_SDM_GetSubscriptionData_Answer
            message_body: |
              {
                "status": 200,
                "body": {
                  "gpsis": ["msisdn-12015550100"],
                  "subscribedUeAmbr": {
                    "uplink": "1 Gbps",
                    "downlink": "2 Gbps"
                  }
                }
              }

# Ambient responder: no procedure terminal until the suite cancels it.
# Pin traffic, not `completed` — a completed pin would fail sbi_load_baseline
# and a one-shot target would drop the remaining 1,999 requests.
final_checks:
  - name: at least one GetSubscriptionData answer was sent
    metric: msg_types.tx.sbi.Nudm_SDM_GetSubscriptionData_Answer
    op: greater_or_equal
    value: 1
  - name: at least one GetSubscriptionData request arrived
    metric: rx_events.sbi.Nudm_SDM_GetSubscriptionData
    op: greater_or_equal
    value: 1
