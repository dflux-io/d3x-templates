# SBI smoke — server side.
# d3x-run listens on udm-server's binding and answers every
# Nudm_SDM_GetSubscriptionData with a canned AccessAndMobilitySubscription
# Data body. Demonstrates a typed openapi/models payload built from YAML.

kind: flow
name: sbi_nudm_sdm_get_server
description: Server response template for Nudm_SDM_GetSubscriptionData
category: functional
type: server
protocol: sbi
nf: udm

initial_state: waiting
final_states:
  - completed
  - failed

states:
  waiting:
    transitions:
      - event: sbi.Nudm_SDM_GetSubscriptionData
        target: waiting
        actions:
          - type: send
            message: Nudm_SDM_GetSubscriptionData_Answer
            message_body: |
              {
                "status": 200,
                "body": {
                  "gpsis": ["msisdn-12015550100"],
                  "subscribedUeAmbr": {
                    "uplink": "1 Gbps",
                    "downlink": "2 Gbps"
                  }
                }
              }
