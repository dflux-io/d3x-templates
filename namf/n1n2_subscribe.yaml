# Namf_Communication — N1N2 message subscription (REST client).
# 3GPP TS 29.518 §6.1.3.6 / §5.2.2.4.2: a consumer subscribes to downlink-N1
# delivery notifications for a UE by POSTing a UeN1N2InfoSubscriptionCreateData
# to /ue-contexts/{ueContextId}/n1-n2-messages/subscriptions with an
# n1NotifyCallbackUri; the AMF replies 201 + the minted subscription id and,
# on each subsequent DL N1 delivery for that UE, POSTs an N1MessageNotify to
# the callback URI (design Flow 2; dmf amf_handlers.go:N1N2MessageSubscribe).
#
# Uses the `rest` protocol (NOT `sbi`): dmf's Namf is plain HTTP/1.1; the rest
# transport's http1 option speaks it (sbi forces HTTP/2 → frame mismatch).
#
# NOT ORCHESTRATED BY ANY HARNESS TODAY. The header used to claim that
# scripts/e2e-gnb-run.sh step 05-namf-callbacks ran this flow and substituted
# the receiver container's lab IP for a `CALLBACK_URI` placeholder. It does
# not, and never did in this repository: step 05 issues the subscribe itself
# with a curl sidecar so it can interpolate the listener's runtime IP, and no
# script references `namf_n1n2_subscribe` at all. The placeholder was therefore
# never substituted by anything — it was a literal `CALLBACK_URI` sitting in an
# `n1NotifyCallbackUri`, which is not a URI in any sense a producer could dial.
#
# It is a real absolute URI now (xp-210). The dmf refuses a destination that
# could never have been DELIVERED, and a template that is not currently run is
# exactly the kind of thing that gets run six months from now by somebody who
# assumes it works. The address matches the sibling amf_statuschange_subscribe
# flow's convention — the default LAB_SUBNET (10.55.0.0/24) and the runner's
# rest-listen port — so wiring it up later means substituting a real IP, not
# discovering the field is unusable.
#
# ueContextId is the dash-less SUPI (dmf supiFromUeCtxID key).

kind: flow
name: namf_n1n2_subscribe
description: POST n1-n2-messages/subscriptions — assert 201 + subscription id.
category: functional
type: client
protocol: rest
nf: external

initial_state: idle
final_states:
  - completed
  - failed

states:
  idle:
    transitions:
      - event: Start
        target: wait_subscribe
        actions:
          - type: send
            message: N1N2Subscribe
            peer: amf
            message_body: |
              {
                "method": "POST",
                "url": "/namf-comm/v1/ue-contexts/imsi-001010000000001/n1-n2-messages/subscriptions",
                "headers": { "Content-Type": "application/json" },
                "body": {
                  "n1NotifyCallbackUri": "http://10.55.0.99:39997/n1-message-notify",
                  "n1MessageClass": "SM",
                  "nfId": "11111111-2222-3333-4444-555555555555"
                }
              }

  wait_subscribe:
    on_timeout:
      duration: 5s
      target: failed
    transitions:
      - event: rest.N1N2Subscribe_Answer
        target: completed
        actions:
          - type: check
            field: rest.status
            op: equals
            expected: 201
          - type: check
            field: rest.body.n1n2NotifySubscriptionId
            op: not_empty

  failed: {}
